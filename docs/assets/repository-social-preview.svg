<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">My Finance Records repository social preview</title>
  <desc id="description">A dark blue finance dashboard illustration with the project name and privacy-focused feature summary.</desc>
  <defs>
    <linearGradient id="background" x1="100" y1="30" x2="1180" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#071827"/>
    </linearGradient>
    <linearGradient id="card" x1="120" y1="145" x2="500" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173a6c"/>
      <stop offset="1" stop-color="#10284d"/>
    </linearGradient>
    <linearGradient id="accent" x1="190" y1="180" x2="430" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7aa2d6" stroke-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000814" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="24" fill="url(#background)"/>
  <rect width="1280" height="640" rx="24" fill="url(#grid)"/>
  <circle cx="1160" cy="92" r="210" fill="#2563eb" opacity="0.09"/>
  <circle cx="1080" cy="596" r="250" fill="#16a34a" opacity="0.07"/>

  <g filter="url(#shadow)">
    <rect x="104" y="112" width="392" height="416" rx="40" fill="url(#card)" stroke="#335f99" stroke-width="2"/>
    <rect x="151" y="159" width="298" height="322" rx="28" fill="#081426" stroke="#4c77ae" stroke-width="2"/>
    <path d="M196 230h208M196 282h208M196 334h128" stroke="#37577f" stroke-width="12" stroke-linecap="round"/>
    <circle cx="199" cy="408" r="25" fill="#102e52" stroke="#60a5fa" stroke-width="5"/>
    <path d="m188 408 8 8 15-18" fill="none" stroke="#86efac" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 420c29-58 57-41 84-83 22-35 47-23 67-61" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="420" r="8" fill="#60a5fa"/>
    <circle cx="340" cy="337" r="8" fill="#4ade80"/>
    <circle cx="407" cy="276" r="8" fill="#86efac"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="1030" y="100" width="146" height="48" rx="24" fill="#123b2c" stroke="#2e7658"/>
    <circle cx="1057" cy="124" r="7" fill="#4ade80"/>
    <text x="1075" y="131" fill="#bbf7d0" font-size="20" font-weight="700">V15.2.18</text>

    <text x="570" y="239" fill="#93c5fd" font-size="24" font-weight="750" letter-spacing="3">MY FINANCE RECORDS</text>
    <text x="570" y="310" fill="#f8fafc" font-size="50" font-weight="800">Private by design.</text>
    <text x="570" y="370" fill="#f8fafc" font-size="50" font-weight="800">Practical every day.</text>
    <text x="574" y="431" fill="#b8c8dd" font-size="26" font-weight="500">Local-first personal finance PWA</text>

    <g font-size="19" font-weight="650">
      <rect x="570" y="474" width="172" height="44" rx="22" fill="#102c50" stroke="#2e5f98"/>
      <text x="601" y="502" fill="#bfdbfe">Offline-ready</text>
      <rect x="754" y="474" width="169" height="44" rx="22" fill="#102c50" stroke="#2e5f98"/>
      <text x="782" y="502" fill="#bfdbfe">Multi-profile</text>
      <rect x="935" y="474" width="241" height="44" rx="22" fill="#123b2c" stroke="#2e7658"/>
      <text x="963" y="502" fill="#bbf7d0">Encrypted cloud sync</text>
    </g>
  </g>
</svg>

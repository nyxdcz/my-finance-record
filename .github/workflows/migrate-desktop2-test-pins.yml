name: Migrate desktop2 test asset pins

on:
  push:
    branches:
      - agent/desktop-ui-consistency-v15-1-0
    paths:
      - .github/workflows/migrate-desktop2-test-pins.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/desktop-ui-consistency-v15-1-0
          fetch-depth: 0
      - name: Replace every stale Black Canvas test suffix
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=[]
          total=0
          for p in Path('tests').rglob('*'):
              if not p.is_file():
                  continue
              try:
                  text=p.read_text()
              except UnicodeDecodeError:
                  continue
              count=text.count('periodradius1')
              if count:
                  p.write_text(text.replace('periodradius1','desktop2'))
                  changed.append(str(p))
                  total += count
          if not total:
              raise SystemExit('No stale periodradius1 test pins found')
          print(f'Replaced {total} stale pin(s) in {len(changed)} file(s):')
          print('\n'.join(changed))
          PY
          ! grep -R 'periodradius1' tests
      - name: Remove one-time workflow
        run: rm .github/workflows/migrate-desktop2-test-pins.yml
      - name: Commit test-pin migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: migrate Black Canvas desktop2 pins"
          git push origin HEAD:agent/desktop-ui-consistency-v15-1-0

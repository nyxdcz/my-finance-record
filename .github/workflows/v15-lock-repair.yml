name: V15 lock checksum repair

on:
  push:
    branches:
      - agent/v15-0-0-liquid-glass

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/v15-0-0-liquid-glass
      - name: Restore exact locked checksum from main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('package-lock.json')
          text = path.read_text()
          bad = 'sha512-TtpcNJ3XAzx3Gq8sWRzJaVajRs0uVxA2YAkdb1jm2YkPz4G6egUFAyA3n5vtEIZefPk5Wa4UXbKuS5fKkJWdg=='
          good = 'sha512-TtpcNJ3XAzx3Gq8sWRzJaVajRs0uVxA2YAkdb1jm2YkPz4G6egUFAyA3n5vtEIZefPk5Wa4UXbKuS5fKkJWdgA=='
          if good not in text:
              if bad not in text:
                  raise SystemExit('Expected checksum was not found')
              path.write_text(text.replace(bad, good, 1))
          PY
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: restore package lock integrity checksum"
          git push origin HEAD:agent/v15-0-0-liquid-glass

name: Patch and prevalidate Light mode chrome r26

on:
  push:
    branches:
      - fix/light-mode-chrome-r26
    paths:
      - .github/workflows/patch-light-mode-chrome-r26.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/light-mode-chrome-r26
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Light mode correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import json

          OLD_CACHE="finance-v15-20260815-desktop-ui-r25"
          NEW_CACHE="finance-v15-20260815-light-chrome-r26"
          OLD_LIQUID="liquid-glass-v15.css?v=15.1.0-monthnav1"
          NEW_LIQUID="liquid-glass-v15.css?v=15.1.0-light1"
          OLD_BLACK="black-canvas-v15-1-0.css?v=15.1.0-desktop2"
          NEW_BLACK="black-canvas-v15-1-0.css?v=15.1.0-light1"
          OLD_SYNC="sync-config.js?v=15.1.0-desktop1"
          NEW_SYNC="sync-config.js?v=15.1.0-light1"

          def replace(path, old, new, expected=None):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f"{path}: expected {expected} x {old!r}, got {count}")
              if not count:
                  raise SystemExit(f"{path}: missing {old!r}")
              p.write_text(text.replace(old,new))

          # PWA delivery contract.
          for path in ("index.html","sw.js"):
              replace(path,OLD_CACHE,NEW_CACHE,1)
              replace(path,OLD_BLACK,NEW_BLACK,1)
              replace(path,OLD_SYNC,NEW_SYNC,1)
          replace("sw.js",OLD_LIQUID,NEW_LIQUID,1)
          replace("sync-config.js","./liquid-glass-v15.css?v=${VERSION}-monthnav1","./liquid-glass-v15.css?v=${VERSION}-light1",1)

          v=Path("version.json"); data=json.loads(v.read_text())
          if data["cacheVersion"] != OLD_CACHE: raise SystemExit("version.json cache mismatch")
          data["cacheVersion"]=NEW_CACHE
          data["notes"]="Light mode chrome correction: #efefef canvas with light sidebar, readable Spend controls, light marquee/month/history controls and modal chrome; Black Canvas dark mode, Finance Schema 12, Cloud Schema V3, records, calculations, sync behavior, and phone marquee behavior remain unchanged."
          v.write_text(json.dumps(data,indent=2)+"\n")

          # Spend: dark text on Light, white on Dark.
          p=Path("black-canvas-v15-1-0.css"); text=p.read_text()
          old=dedent('''
          /* V15.1.0 Available money Spend label hotfix. */
          #availableMoneySection .account-spend-button span {
            color:#ffffff !important;
          }
          ''').lstrip()
          new=dedent('''
          /* V15.1.0 Available money Spend contrast by theme. */
          html[data-theme="light"] #availableMoneySection .account-spend-button {
            background:var(--surface) !important;
            border-color:var(--line) !important;
            color:var(--text) !important;
          }
          html[data-theme="light"] #availableMoneySection .account-spend-button span {
            color:var(--text) !important;
          }
          html[data-theme="light"] #availableMoneySection .account-spend-button:hover {
            background:var(--surface-soft) !important;
          }
          html[data-theme="dark"] #availableMoneySection .account-spend-button span {
            color:#ffffff !important;
          }
          ''').lstrip()
          if text.count(old)!=1: raise SystemExit(f"Spend block count {text.count(old)}")
          p.write_text(text.replace(old,new))

          # Liquid Glass is injected last by sync-config.js, so Light mode must define
          # Light material tokens in this final layer. Dark variables are untouched.
          p=Path("liquid-glass-v15.css"); text=p.read_text(); marker="/* V15.1.0 · Light mode chrome correction r26 */"
          if marker in text: raise SystemExit("Light r26 marker already present")
          text += dedent(r'''

          /* V15.1.0 · Light mode chrome correction r26 */
          html[data-theme="light"] {
            --liquid-glass-surface:rgba(255,255,255,.82);
            --liquid-glass-surface-strong:rgba(255,255,255,.96);
            --liquid-glass-surface-soft:rgba(247,249,252,.88);
            --liquid-glass-border:rgba(23,59,103,.14);
            --liquid-glass-edge:rgba(255,255,255,.92);
            --liquid-glass-shadow:0 14px 36px rgba(16,24,40,.12),inset 0 1px 0 rgba(255,255,255,.96),inset 0 -1px 0 rgba(16,24,40,.06);
            --liquid-glass-shadow-soft:0 8px 22px rgba(16,24,40,.09),inset 0 1px 0 rgba(255,255,255,.92);
            --liquid-glass-active:rgba(23,59,103,.94);
            --liquid-glass-hover:rgba(23,59,103,.08);
            --nav:#ffffff;
            --nav-active-bg:var(--primary);
            --nav-active-text:#ffffff;
          }
          html[data-theme="light"] .sidebar { color:var(--text); }
          html[data-theme="light"] .sidebar :is(.sidebar-close-button,.nav-button) { color:var(--text); }
          html[data-theme="light"] .sidebar .nav-icon {
            background:color-mix(in srgb,var(--primary) 7%,var(--surface));
            color:var(--text);
          }
          html[data-theme="light"] .sidebar .nav-icon-image {
            filter:brightness(0) saturate(100%) !important;
            opacity:.78 !important;
          }
          html[data-theme="light"] .sidebar .nav-button.active { color:#ffffff; }
          html[data-theme="light"] .sidebar .nav-button.active .nav-icon { background:transparent; color:#ffffff; }
          html[data-theme="light"] .sidebar .nav-button.active .nav-icon-image {
            filter:brightness(0) invert(1) !important;
            opacity:1 !important;
          }
          html[data-theme="light"] .sidebar :is(.brand small,.sidebar-note) { color:var(--muted); }
          html[data-theme="light"] .sidebar:not(.desktop-open):not(.sidebar-pinned) .nav-button::after {
            border-color:var(--line);
            background:var(--surface);
            color:var(--text);
          }
          html[data-theme="light"] .workspace-switcher button.active,
          html[data-theme="light"] .workspace-switcher button[aria-selected="true"] { color:#ffffff; }
          html[data-theme="light"] :is(.dashboard-week-marquee,.finance-week-marquee,.work-week-marquee),
          html[data-theme="light"] :is(.dashboard-week-marquee,.finance-week-marquee,.work-week-marquee) .dashboard-week-day,
          html[data-theme="light"] .topbar :is(.month-nav-button,.month-display-button,.month-current-button,.topbar-history-button),
          html[data-theme="light"] :is(dialog,.modal,.dialog) :is(.modal-header,.dialog-header,.modal-footer,.dialog-footer,.modal-actions,.dialog-actions) {
            color:var(--text);
          }
          @media (prefers-reduced-transparency:reduce) {
            html[data-theme="light"] {
              --liquid-glass-surface:rgba(255,255,255,.98);
              --liquid-glass-surface-strong:#ffffff;
              --liquid-glass-surface-soft:rgba(247,249,252,.98);
            }
          }
          ''')
          p.write_text(text)

          # Update exact active test pins for the new app shell/assets.
          for p in Path("tests").rglob("*"):
              if not p.is_file(): continue
              try: text=p.read_text()
              except UnicodeDecodeError: continue
              text=text.replace(OLD_CACHE,NEW_CACHE).replace(OLD_LIQUID,NEW_LIQUID).replace(OLD_BLACK,NEW_BLACK).replace(OLD_SYNC,NEW_SYNC)
              p.write_text(text)

          # Existing palette browser expectation for Spend.
          p=Path("tests/black-canvas-v15-1-0.spec.mjs"); text=p.read_text()
          old='    expect(result.spendColor).toBe("rgb(255, 255, 255)");'
          new='    expect(result.spendColor).toBe(theme === "light" ? "rgb(24, 34, 48)" : "rgb(255, 255, 255)");'
          if text.count(old)!=1: raise SystemExit("Spend browser assertion mismatch")
          p.write_text(text.replace(old,new))

          Path("tests/validate-spend-label-v15-1-0.mjs").write_text(dedent(r'''#!/usr/bin/env node
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const css=fs.readFileSync("black-canvas-v15-1-0.css","utf8");
          const index=fs.readFileSync("index.html","utf8");
          const sw=fs.readFileSync("sw.js","utf8");
          const version=JSON.parse(fs.readFileSync("version.json","utf8"));
          assert.match(css,/html\[data-theme="light"\] #availableMoneySection \.account-spend-button\s*\{[\s\S]*color:var\(--text\) !important;/);
          assert.match(css,/html\[data-theme="light"\] #availableMoneySection \.account-spend-button span\s*\{[\s\S]*color:var\(--text\) !important;/);
          assert.match(css,/html\[data-theme="dark"\] #availableMoneySection \.account-spend-button span\s*\{[\s\S]*color:#ffffff !important;/);
          assert.match(index,/black-canvas-v15-1-0\.css\?v=15\.1\.0-light1/);
          assert.match(sw,/black-canvas-v15-1-0\.css\?v=15\.1\.0-light1/);
          assert.equal(version.version,"15.1.0");
          assert.equal(version.schemaVersion,12);
          assert.equal(version.cloudSchemaVersion,3);
          assert.equal(version.cacheVersion,"finance-v15-20260815-light-chrome-r26");
          console.log("V15.1.0 Spend theme contrast regression passed.");
          '''))

          # Strengthen current static palette validator.
          p=Path("tests/validate-black-canvas-v15-1-0.mjs"); text=p.read_text()
          anchor='assert.match(liquid,/--liquid-glass-active:rgba\\(23,62,118,/);\n'
          extra=('assert.match(liquid,/html\\[data-theme="light"\\][\\s\\S]*--liquid-glass-surface:rgba\\(255,255,255,.82\\)/);\n'
                 'assert.match(liquid,/html\\[data-theme="light"\\][\\s\\S]*--nav:#ffffff/);\n'
                 'assert.match(liquid,/html\\[data-theme="light"\\] \\.sidebar \\.nav-button\\.active[\\s\\S]*color:#ffffff/);\n')
          if text.count(anchor)!=1: raise SystemExit("Black Canvas static anchor mismatch")
          p.write_text(text.replace(anchor,anchor+extra))

          # Real cascade regression: Liquid Glass is loaded last, just as sync-config injects it.
          Path("tests/light-mode-chrome-v15-1-0.spec.mjs").write_text(dedent(r'''import { test, expect } from "@playwright/test";

          for (const theme of ["light","dark"]) {
            test(`V15.1.0 ${theme} final chrome is readable`, async ({ page }) => {
              await page.setViewportSize({width:1440,height:900});
              await page.setContent(`<!doctype html><html data-theme="${theme}"><head>
                <link rel="stylesheet" href="http://127.0.0.1:3000/app.css?v=15.1.0-desktop2">
                <link rel="stylesheet" href="http://127.0.0.1:3000/dashboard-interactions.css?v=15.1.0-desktop2">
                <link rel="stylesheet" href="http://127.0.0.1:3000/black-canvas-v15-1-0.css?v=15.1.0-light1">
                <link rel="stylesheet" href="http://127.0.0.1:3000/liquid-glass-v15.css?v=15.1.0-light1">
                <style>*,*::before,*::after{animation:none!important;transition:none!important}</style>
              </head><body>
                <aside class="sidebar desktop-open" id="sidebar">
                  <button class="nav-button" id="inactiveNav"><span class="nav-icon"><img id="inactiveIcon" class="nav-icon-image" src="http://127.0.0.1:3000/icons/sidebar-overview.png" alt=""></span><span>Overview</span></button>
                  <button class="nav-button active" id="activeNav"><span class="nav-icon"><img id="activeIcon" class="nav-icon-image" src="http://127.0.0.1:3000/icons/sidebar-finance.png" alt=""></span><span>Finance</span></button>
                </aside>
                <header class="topbar"><div class="topbar-actions"><div class="month-navigator" id="monthNav"><button class="month-nav-button">‹</button><div class="month-control"><button class="month-display-button" id="monthDisplay">August 2026</button></div><button class="month-nav-button">›</button></div><div class="topbar-history-actions" id="history"><button class="topbar-history-button" id="undo">↶</button></div></div></header>
                <div class="workspace-switcher"><button class="workspace-switcher-button active" id="workspaceActive">Budget & Expenses</button></div>
                <section class="dashboard-week-marquee" id="marquee"><div class="dashboard-week-marquee-heading"><strong>This week</strong></div><div class="dashboard-week-marquee-window"><div class="dashboard-week-marquee-track"><div class="dashboard-week-marquee-group"><article class="dashboard-week-day" id="weekDay"><div class="dashboard-week-copy"><strong>15th Month Salary</strong><small>Paycheck</small></div></article></div></div></div></section>
                <section id="availableMoneySection"><button class="button button-secondary button-small account-spend-button"><span id="spendLabel">Spend</span></button></section>
                <dialog open><form><header class="modal-header" id="modalHeader"><h3>Edit account</h3></header><div class="modal-body">Body</div><footer class="modal-footer" id="modalFooter"><button class="button button-secondary">Cancel</button><button class="button button-primary">Record spending</button></footer></form></dialog>
              </body></html>`,{waitUntil:"load"});
              const r=await page.evaluate(()=>({
                body:getComputedStyle(document.body).backgroundColor,
                strong:getComputedStyle(document.documentElement).getPropertyValue("--liquid-glass-surface-strong").trim(),
                sidebarBg:getComputedStyle(document.querySelector("#sidebar")).backgroundImage,
                inactive:getComputedStyle(document.querySelector("#inactiveNav")).color,
                active:getComputedStyle(document.querySelector("#activeNav")).color,
                inactiveFilter:getComputedStyle(document.querySelector("#inactiveIcon")).filter,
                activeFilter:getComputedStyle(document.querySelector("#activeIcon")).filter,
                workspace:getComputedStyle(document.querySelector("#workspaceActive")).color,
                marqueeBg:getComputedStyle(document.querySelector("#marquee")).backgroundImage,
                dayBg:getComputedStyle(document.querySelector("#weekDay")).backgroundImage,
                monthBg:getComputedStyle(document.querySelector("#monthNav")).backgroundImage,
                monthColor:getComputedStyle(document.querySelector("#monthDisplay")).color,
                historyBg:getComputedStyle(document.querySelector("#history")).backgroundImage,
                undoColor:getComputedStyle(document.querySelector("#undo")).color,
                spend:getComputedStyle(document.querySelector("#spendLabel")).color,
                headerBg:getComputedStyle(document.querySelector("#modalHeader")).backgroundImage,
                headerColor:getComputedStyle(document.querySelector("#modalHeader")).color,
                footerBg:getComputedStyle(document.querySelector("#modalFooter")).backgroundImage
              }));
              if(theme==="light"){
                expect(r.body).toBe("rgb(239, 239, 239)");
                expect(r.strong).toContain("255,255,255");
                expect(r.sidebarBg).toContain("rgba(255, 255, 255");
                expect(r.inactive).toBe("rgb(24, 34, 48)");
                expect(r.active).toBe("rgb(255, 255, 255)");
                expect(r.inactiveFilter).toContain("brightness(0)");
                expect(r.activeFilter).toContain("invert(1)");
                expect(r.workspace).toBe("rgb(255, 255, 255)");
                expect(r.marqueeBg).toContain("rgba(247, 249, 252");
                expect(r.dayBg).toContain("rgba(247, 249, 252");
                expect(r.monthBg).toContain("rgba(247, 249, 252");
                expect(r.monthColor).toBe("rgb(24, 34, 48)");
                expect(r.historyBg).toContain("rgba(247, 249, 252");
                expect(r.undoColor).toBe("rgb(24, 34, 48)");
                expect(r.spend).toBe("rgb(24, 34, 48)");
                expect(r.headerBg).toContain("rgba(255, 255, 255");
                expect(r.headerColor).toBe("rgb(24, 34, 48)");
                expect(r.footerBg).toContain("rgba(255, 255, 255");
              } else {
                expect(r.body).toBe("rgb(0, 0, 0)");
                expect(r.strong).toContain("7,12,20");
                expect(r.sidebarBg).toContain("rgba(7, 12, 20");
                expect(r.spend).toBe("rgb(255, 255, 255)");
                expect(r.headerBg).toContain("rgba(7, 12, 20");
              }
            });
          }
          '''))

          # No stale delivery tokens may remain in active tests/source-of-truth files.
          for p in [Path("index.html"),Path("sw.js"),Path("version.json")]:
              if OLD_CACHE in p.read_text(): raise SystemExit(f"stale r25 in {p}")
          for p in Path("tests").rglob("*"):
              if not p.is_file(): continue
              try: text=p.read_text()
              except UnicodeDecodeError: continue
              if any(x in text for x in (OLD_CACHE,OLD_LIQUID,OLD_BLACK,OLD_SYNC)):
                  raise SystemExit(f"stale delivery token in {p}")
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repository quality
        run: npm run quality
      - name: Production audit
        run: npm run audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser suite
        run: npm run test:browser
      - name: Commit validated application and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js sync-config.js version.json black-canvas-v15-1-0.css liquid-glass-v15.css tests
          git diff --cached --check
          git commit -m "fix: correct Light mode chrome contrast"
          git push origin HEAD:fix/light-mode-chrome-r26

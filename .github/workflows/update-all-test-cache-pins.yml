name: Update all r24 test cache pins

on:
  push:
    branches:
      - fix/finance-marquee-source-cache
    paths:
      - scripts/update-all-test-cache-pins.py
      - .github/workflows/update-all-test-cache-pins.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v7
        with:
          ref: fix/finance-marquee-source-cache
          fetch-depth: 0

      - name: Replace every stale test cache pin
        run: python3 scripts/update-all-test-cache-pins.py

      - name: Verify no r23 pin remains under tests
        run: |
          if grep -R -n --fixed-strings "finance-v15-20260815-month-nav-borderless-r23" tests; then
            exit 1
          fi

      - name: Remove one-time scan helper
        run: rm -f scripts/update-all-test-cache-pins.py .github/workflows/update-all-test-cache-pins.yml

      - name: Commit complete test cache migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: finish r24 cache migration"
          git push origin HEAD:fix/finance-marquee-source-cache

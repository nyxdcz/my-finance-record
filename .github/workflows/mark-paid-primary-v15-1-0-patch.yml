name: V15.1.0 Mark Paid Primary Patch

on:
  push:
    branches:
      - fix/mark-paid-primary-v15-1-0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v7
        with:
          ref: fix/mark-paid-primary-v15-1-0
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply Mark Paid palette patch
        run: python .github/patch-mark-paid-primary-v15-1-0.py
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository quality
        run: npm run quality
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regressions
        run: npm run test:browser
      - name: Commit validated patch and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf test-results playwright-report
          rm -f .github/patch-mark-paid-primary-v15-1-0.py .github/workflows/mark-paid-primary-v15-1-0-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: make expense Mark paid primary blue"
          git push origin HEAD:fix/mark-paid-primary-v15-1-0

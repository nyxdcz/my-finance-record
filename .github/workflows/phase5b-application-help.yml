name: Phase 5B Application Help Extraction

on:
  push:
    branches: [agent/phase5b-application-help]

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message == 'chore: run approved Phase 5B extraction'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Phase 5B branch
        uses: actions/checkout@v7
        with:
          ref: agent/phase5b-application-help
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply idempotent Phase 5B extraction
        run: node scripts/phase5b-extract.mjs
      - name: Validate focused source contracts
        run: node tests/validate-application-help-v15-2-7.mjs
      - name: Commit approved Phase 5B changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset scripts/phase5b-extract.mjs .github/workflows/phase5b-application-help.yml
          if git diff --cached --quiet; then
            echo "Phase 5B is already applied; nothing to commit."
            exit 0
          fi
          git commit -m "refactor: extract application help runtime V15.2.7"
          git push origin HEAD:agent/phase5b-application-help

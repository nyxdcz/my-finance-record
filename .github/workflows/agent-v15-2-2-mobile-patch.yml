name: Agent V15.2.2 Mobile Patch

on:
  push:
    branches: [fix/v15-2-2-mobile-ui-ux]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/v15-2-2-mobile-ui-ux
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Apply approved V15.2.2 mobile patch
        run: python scripts/apply-v15-2-2-mobile.py

      - name: Show remaining old release pins
        shell: bash
        run: grep -RIn "15\.2\.1\|desktop-ux-quick-wins-r31" tests || true

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run repository quality suite
        run: npm run quality

      - name: Audit production dependencies
        run: npm run audit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser suite
        run: npm run test:browser

      - name: Commit validated mobile release
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md index.html mobile-v14-0-23.css package.json package-lock.json sw.js sync-config.js version.json tests
          git commit -m "fix: refine V15.2.2 mobile UI and UX"
          git push origin HEAD:fix/v15-2-2-mobile-ui-ux

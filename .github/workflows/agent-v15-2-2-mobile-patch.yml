name: Agent V15.2.2 Mobile Patch

on:
  push:
    branches: [fix/v15-2-2-mobile-ui-ux]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/v15-2-2-mobile-ui-ux
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Apply approved V15.2.2 mobile UI and UX patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          mobile = root / 'mobile-v14-0-23.css'
          mobile_text = mobile.read_text()
          marker = '/* My Finance Records V15.2.2 · mobile UI + UX consistency */'
          if marker not in mobile_text:
              mobile_text += r'''

/* My Finance Records V15.2.2 · mobile UI + UX consistency */
@media (max-width: 850px) {
  body .workspace-switcher {
    top: var(--mobile-topbar-offset, calc(env(safe-area-inset-top) + 112px));
  }
  .sidebar .sidebar-close-button {
    top: 10px;
    right: 10px;
    width: 44px;
    min-width: 44px;
    height: 44px;
    min-height: 44px;
  }
}

@media (max-width: 700px) {
  body .toast {
    left: 12px;
    right: 12px;
    bottom: max(12px, calc(env(safe-area-inset-bottom) + 10px));
    width: auto;
    min-width: 0;
    max-width: none;
  }
  .toast .toast-dismiss {
    width: 44px;
    min-width: 44px;
    height: 44px;
    min-height: 44px;
    margin: -8px -8px -8px auto;
  }

  #income .income-active-filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  #income .income-active-filter-chips .ui-chip,
  #income .income-active-filter-chips button {
    min-height: 44px;
  }
  #income .income-active-filter-chips button {
    min-width: 44px;
  }

  .page .empty-state-actions {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-top: 10px;
  }
  .page .empty-state-actions .button {
    width: 100%;
    min-height: 44px;
  }

  .budget-planner-card .budget-planner-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 7px;
  }
  .budget-planner-card .budget-planner-actions > .button,
  .budget-planner-card .budget-planner-more-menu,
  .budget-planner-card .budget-planner-more-menu > .overflow-menu-trigger {
    width: 100%;
    min-width: 0;
    min-height: 44px;
  }
  .budget-planner-card #addBudgetItem { order: 1; }
  .budget-planner-card .budget-planner-more-menu { order: 2; }
  .budget-planner-card #buildBudgetFromExpenses { order: 3; }
  .budget-planner-card #copyPreviousBudget { order: 4; }

  .budget-planner-card .budget-planner-more-panel,
  .pc-event-more-menu .pc-event-more-panel {
    left: auto !important;
    right: 0 !important;
    top: calc(100% + 6px);
    bottom: auto !important;
    width: min(240px, calc(100vw - 28px));
    min-width: 0;
    max-width: calc(100vw - 28px);
    max-height: min(60dvh, 360px);
    overflow: auto;
    overscroll-behavior: contain;
  }
  .budget-planner-card .budget-planner-more-panel [role="menuitem"],
  .pc-event-more-menu .pc-event-more-panel [role="menuitem"] {
    width: 100%;
    min-height: 44px;
    justify-content: flex-start;
    white-space: normal;
    text-align: left;
  }
  .pc-event-more-menu > .overflow-menu-trigger,
  .pc-event-more-menu > button[aria-haspopup="menu"] {
    min-width: 44px;
    min-height: 44px;
  }

  .productivity-empty .empty-state-actions {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .productivity-empty .empty-state-actions .button {
    width: 100%;
    min-height: 44px;
  }
  .productivity-search-results {
    min-width: 0;
    max-width: 100%;
  }
  .productivity-search-result {
    min-width: 0;
  }
  .productivity-search-copy strong,
  .productivity-search-copy small {
    max-width: 100%;
  }
}

@media (max-width: 340px) {
  #paid-expenses [data-paid-expense-row] {
    grid-template-columns: 1fr !important;
  }
  #paid-expenses [data-paid-expense-row] > .record-title,
  #paid-expenses [data-paid-expense-row] > [data-label],
  #paid-expenses [data-paid-expense-row] > .amount[data-label],
  #paid-expenses [data-paid-expense-row] > .mobile-record-actions {
    grid-column: 1 !important;
  }
}

@media (min-width: 701px) and (max-width: 850px) and (max-height: 520px),
       (min-width: 701px) and (max-width: 850px) and (pointer: coarse) {
  .app-dialog .input,
  .app-dialog .select,
  .app-dialog .textarea,
  .app-dialog .button,
  .workspace-switcher-button,
  .toast .toast-dismiss,
  .budget-planner-card .budget-planner-more-panel [role="menuitem"],
  .pc-event-more-menu .pc-event-more-panel [role="menuitem"] {
    min-height: 44px;
  }
  .toast .toast-dismiss {
    width: 44px;
    min-width: 44px;
    height: 44px;
  }
  .budget-planner-card .budget-planner-more-panel,
  .pc-event-more-menu .pc-event-more-panel {
    max-width: calc(100vw - 28px);
  }
}
'''
              mobile.write_text(mobile_text)

          def replace_required(path, old, new, count=None):
              p = root / path
              text = p.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f'Missing expected text in {path}: {old}')
              text = text.replace(old, new, count if count is not None else -1)
              p.write_text(text)

          # Release metadata and cache rotation.
          replace_required('index.html', '<title>My Finance Records · V15.2.1</title>', '<title>My Finance Records · V15.2.2</title>', 1)
          replace_required('index.html', './mobile-v14-0-23.css?v=14.0.23', './mobile-v14-0-23.css?v=15.2.2-mobile1', 1)
          replace_required('index.html', 'title="V15.2.1 · Desktop UX Quick Wins · August 16, 2026">V15.2.1</small>', 'title="V15.2.2 · Mobile UI &amp; UX · August 16, 2026">V15.2.2</small>', 1)
          replace_required('index.html', 'const APP_VERSION = "15.2.1";', 'const APP_VERSION = "15.2.2";', 1)
          replace_required('index.html', 'const APP_RELEASE_NAME = "Desktop UX Quick Wins";', 'const APP_RELEASE_NAME = "Mobile UI & UX";', 1)
          replace_required('index.html', 'const APP_CACHE_VERSION = "finance-v15-20260816-desktop-ux-quick-wins-r31";', 'const APP_CACHE_VERSION = "finance-v15-20260816-mobile-ui-ux-r32";', 1)
          replace_required('index.html', './sync-config.js?v=15.2.1-ux1', './sync-config.js?v=15.2.2-mobile1', 1)

          replace_required('sync-config.js', 'const VERSION = "15.2.1";', 'const VERSION = "15.2.2";', 1)
          replace_required('sync-config.js', 'const RELEASE_NAME = "Desktop UX Quick Wins";', 'const RELEASE_NAME = "Mobile UI & UX";', 1)

          sw = (root / 'sw.js').read_text()
          sw = sw.replace('const APP_VERSION = "15.2.1";', 'const APP_VERSION = "15.2.2";', 1)
          sw = sw.replace('finance-v15-20260816-desktop-ux-quick-wins-r31', 'finance-v15-20260816-mobile-ui-ux-r32')
          sw = re.sub(r'// V15\.2\.1 desktop UX quick-win delivery r31[^\n]*', '// V15.2.2 mobile UI/UX delivery · phone layout, touch targets, menu safety, and responsive regression coverage; finance data and sync semantics unchanged.', sw, count=1)
          sw = sw.replace('mobile-v14-0-23.css?v=14.0.23', 'mobile-v14-0-23.css?v=15.2.2-mobile1')
          sw = sw.replace('liquid-glass-v15.css?v=15.2.1-light1', 'liquid-glass-v15.css?v=15.2.2-light1')
          sw = sw.replace('sync-config.js?v=15.2.1-ux1', 'sync-config.js?v=15.2.2-mobile1')
          (root / 'sw.js').write_text(sw)

          version_path = root / 'version.json'
          version = json.loads(version_path.read_text())
          version.update({
              'version':'15.2.2',
              'cacheVersion':'finance-v15-20260816-mobile-ui-ux-r32',
              'released':'2026-08-16',
              'name':'Mobile UI & UX',
              'notes':'V15.2.2 mobile UI/UX refinement: corrected sticky mobile workspace offsets, standardized key 44px touch targets, improved mobile empty/filter/search recovery, made Budget Plan and Agenda overflow menus viewport-safe, added a 320px Paid Expenses fallback, and added portrait/landscape/short-screen regression coverage. Finance Schema 12, Cloud Schema V3, calculations, saved records, account balances, budgets, projects, five-minute sync cadence, and completed desktop layout remain unchanged.'
          })
          version_path.write_text(json.dumps(version, indent=2) + '\n')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text())
          package['version'] = '15.2.2'
          validator = 'node tests/validate-v15-2-2-mobile-ui.mjs'
          if validator not in package['scripts']['test']:
              package['scripts']['test'] += ' && ' + validator
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          lock_path = root / 'package-lock.json'
          lock = lock_path.read_text()
          lock = lock.replace('"version": "15.2.1"', '"version": "15.2.2"', 2)
          lock_path.write_text(lock)

          changelog = root / 'CHANGELOG.md'
          changelog_text = changelog.read_text()
          if not changelog_text.startswith('## 15.2.2'):
              entry = '''## 15.2.2 · 2026-08-16
- Refined the phone UI across 320–428px with corrected sticky workspace navigation, 44px touch targets, safer overflow menus, and a narrow Paid Expenses fallback.
- Added deliberate mobile treatment for V15.2.1 filter chips, empty/search recovery actions, Budget Plan actions, and Project Agenda menus while preserving the completed desktop interface.
- Added portrait, landscape, and short-screen browser regression coverage and rotated the PWA cache to `finance-v15-20260816-mobile-ui-ux-r32`; Finance Schema 12, Cloud Schema V3, calculations, saved records, and five-minute sync cadence are unchanged.

'''
              changelog.write_text(entry + changelog_text)

          # Update only release/cache expectations in the existing regression suite.
          for p in (root / 'tests').glob('*.mjs'):
              text = p.read_text()
              text = text.replace('finance-v15-20260816-desktop-ux-quick-wins-r31', 'finance-v15-20260816-mobile-ui-ux-r32')
              text = text.replace('const expectedVersion = "15.2.1"', 'const expectedVersion = "15.2.2"')
              text = text.replace('version.version === "15.2.1"', 'version.version === "15.2.2"')
              text = text.replace('pkg.version === "15.2.1"', 'pkg.version === "15.2.2"')
              text = text.replace('assert.equal(version.version, "15.2.1")', 'assert.equal(version.version, "15.2.2")')
              text = text.replace('assert.equal(version.version,"15.2.1")', 'assert.equal(version.version,"15.2.2")')
              text = text.replace('assert.equal(pkg.version, "15.2.1")', 'assert.equal(pkg.version, "15.2.2")')
              text = text.replace('assert.equal(pkg.version,"15.2.1")', 'assert.equal(pkg.version,"15.2.2")')
              text = text.replace('expect(version.version).toBe("15.2.1")', 'expect(version.version).toBe("15.2.2")')
              text = text.replace('expect(pkg.version).toBe("15.2.1")', 'expect(pkg.version).toBe("15.2.2")')
              text = text.replace('.toContain("v=15.2.1")', '.toContain("v=15.2.2")')
              text = text.replace('My Finance Records · V15.2.1', 'My Finance Records · V15.2.2')
              text = text.replace('const APP_VERSION = \\"15\\.2\\.1\\";', 'const APP_VERSION = \\"15\\.2\\.2\\";')
              text = text.replace('const APP_VERSION = "15.2.1";', 'const APP_VERSION = "15.2.2";')
              text = text.replace('liquid-glass-v15.css?v=15.2.1-light1', 'liquid-glass-v15.css?v=15.2.2-light1')
              text = text.replace('liquid-glass-v15\\.css\\?v=15\\.2\\.1-light1', 'liquid-glass-v15\\.css\\?v=15\\.2\\.2-light1')
              text = text.replace('sync-config.js?v=15.2.1-ux1', 'sync-config.js?v=15.2.2-mobile1')
              text = text.replace('sync-config\\.js\\?v=15\\.2\\.1-ux1', 'sync-config\\.js\\?v=15\\.2\\.2-mobile1')
              p.write_text(text)

          validator_path = root / 'tests' / 'validate-v15-2-2-mobile-ui.mjs'
          validator_path.write_text(r'''import assert from "node:assert/strict";
import fs from "node:fs";

const read = path => fs.readFileSync(path, "utf8");
const index = read("index.html");
const mobile = read("mobile-v14-0-23.css");
const sw = read("sw.js");
const sync = read("sync-config.js");
const cloud = read("cloud-sync.js");
const version = JSON.parse(read("version.json"));
const pkg = JSON.parse(read("package.json"));

assert.equal(version.version, "15.2.2");
assert.equal(pkg.version, "15.2.2");
assert.equal(version.schemaVersion, 12);
assert.equal(version.cloudSchemaVersion, 3);
assert.equal(version.cacheVersion, "finance-v15-20260816-mobile-ui-ux-r32");
assert.match(index, /My Finance Records · V15\.2\.2/);
assert.match(index, /mobile-v14-0-23\.css\?v=15\.2\.2-mobile1/);
assert.match(index, /sync-config\.js\?v=15\.2\.2-mobile1/);
assert.match(index, /const APP_VERSION = "15\.2\.2";/);
assert.match(sw, /const APP_VERSION = "15\.2\.2";/);
assert.match(sw, /finance-v15-20260816-mobile-ui-ux-r32/);
assert.match(sw, /mobile-v14-0-23\.css\?v=15\.2\.2-mobile1/);
assert.match(sw, /liquid-glass-v15\.css\?v=15\.2\.2-light1/);
assert.match(sw, /sync-config\.js\?v=15\.2\.2-mobile1/);
assert.match(sync, /const VERSION = "15\.2\.2";/);
assert.match(sync, /const RELEASE_NAME = "Mobile UI & UX";/);
assert.match(mobile, /V15\.2\.2 · mobile UI \+ UX consistency/);
assert.match(mobile, /body \.workspace-switcher[\s\S]*var\(--mobile-topbar-offset/);
assert.match(mobile, /\.toast \.toast-dismiss[\s\S]*min-width:\s*44px/);
assert.match(mobile, /\.sidebar \.sidebar-close-button[\s\S]*min-width:\s*44px/);
assert.match(mobile, /\.budget-planner-more-panel[\s\S]*max-width:\s*calc\(100vw - 28px\)/);
assert.match(mobile, /@media \(max-width: 340px\)[\s\S]*data-paid-expense-row/);
assert.match(mobile, /max-height: 520px/);
assert.match(cloud, /5\*60\*1000/);
console.log("V15.2.2 mobile UI/UX source regression passed.");
''')

          browser_path = root / 'tests' / 'v15-2-2-mobile-ui-ux.spec.mjs'
          browser_path.write_text(r'''import { test, expect } from "@playwright/test";

const widths = [320, 360, 375, 390, 393, 412, 414, 428];
const css = [
  "budget-planning.css?v=15.1.0-desktop3",
  "productivity-tools.css?v=14.0.23",
  "projects-calendar-v13.0.20.css?v=15.1.0-desktop2",
  "mobile-v14-0-23.css?v=15.2.2-mobile1",
  "app.css?v=15.1.0-desktop3",
  "dashboard-interactions.css?v=15.1.0-desktop3",
  "ui-icon-alignment-v15-0-5.css?v=15.1.0-ui3",
  "black-canvas-v15-1-0.css?v=15.1.0-light1",
  "desktop-ui-phase1-v15-1-0.css?v=15.1.0-phase1",
  "desktop-ux-v15-2-0.css?v=15.2.1"
];

async function fixture(page, width, height = 800) {
  await page.setViewportSize({ width, height });
  const links = css.map(href => `<link rel="stylesheet" href="http://127.0.0.1:3000/${href}">`).join("");
  await page.setContent(`<!doctype html><html data-theme="light"><head>${links}<style>*,*::before,*::after{animation:none!important;transition:none!important}.edge-shell{display:flex;justify-content:flex-end;position:relative;width:100%}</style></head><body class="dashboard-view"><header class="topbar"><div class="topbar-left"><button class="menu-button">Menu</button><div><h1>Finance</h1></div></div><div class="mobile-topbar-tools"><button class="mobile-tool-button">Tools</button></div><div class="month-navigator"><button class="month-nav-button">‹</button><div class="month-control"><button class="month-display-button">August</button></div><button class="month-nav-button">›</button></div></header><aside class="sidebar"><button class="sidebar-close-button" id="drawerClose">×</button></aside><main class="main"><div class="content"><section class="page active" id="money"><div class="workspace-switcher money-workspace-switcher" id="workspace"><button class="workspace-switcher-button" id="workspaceButton">Income</button><button class="workspace-switcher-button">Budget</button><button class="workspace-switcher-button">Paid</button></div><section class="dashboard-week-marquee finance-week-marquee" id="phoneMarquee">Week</section><div class="empty-state">No records<div class="empty-state-actions"><button class="button button-secondary" id="emptyAction">Clear filters</button></div></div><article class="card budget-planner-card"><div class="budget-planner-header"><div class="budget-planner-actions"><button class="button" id="buildBudgetFromExpenses">Build</button><button class="button" id="copyPreviousBudget">Copy</button><div class="overflow-menu budget-planner-more-menu"><button class="button overflow-menu-trigger" id="budgetMore" aria-haspopup="menu">More</button><div class="record-more-panel budget-planner-more-panel" id="budgetMenu"><button class="button" role="menuitem" id="budgetMenuItem">Plan settings</button></div></div><button class="button" id="addBudgetItem">Add category</button><button class="budget-planner-toggle budget-panel-collapse">Toggle</button></div></div></article></section><section class="page active" id="income"><div class="income-active-filter-chips"><span class="ui-chip">Category<button id="chipRemove" aria-label="Remove filter">×</button></span></div></section><section class="page active" id="paid-expenses"><div class="record-row" data-paid-expense-row><div class="record-title">Expense</div><div data-label="Paid date" id="paidFieldOne">Aug 16</div><div data-label="Paid from" id="paidFieldTwo">Long account name</div><div class="amount" data-label="Amount">₱1,000</div><div class="mobile-record-actions"><button class="button">Undo</button><button class="overflow-menu-trigger">More</button></div></div></section><div class="edge-shell"><div class="pc-event-more-menu"><button class="button overflow-menu-trigger" id="agendaMore" aria-haspopup="menu">More</button><div class="record-more-panel pc-event-more-panel" id="agendaMenu"><button class="button" role="menuitem" id="agendaMenuItem">Export ICS</button></div></div></div><div class="productivity-empty">No matching records<div class="empty-state-actions"><button class="button" id="searchClear">Clear search</button></div></div><dialog class="app-dialog" open><form><div class="modal-body"><input class="input" id="dialogInput"><button class="button" id="dialogButton">Save</button></div></form></dialog><div class="toast show"><span class="toast-message">Saved</span><button class="toast-dismiss" id="toastDismiss">×</button></div></div></main></body></html>`, { waitUntil:"networkidle" });
}

for (const width of widths) {
  test(`V15.2.2 phone geometry is safe at ${width}px`, async ({ page }) => {
    await fixture(page, width);
    const metrics = await page.evaluate(() => {
      const el = id => document.getElementById(id);
      const px = (id, prop) => parseFloat(getComputedStyle(el(id))[prop]);
      const budgetRect = el("budgetMenu").getBoundingClientRect();
      const agendaRect = el("agendaMenu").getBoundingClientRect();
      const first = el("paidFieldOne").getBoundingClientRect();
      const second = el("paidFieldTwo").getBoundingClientRect();
      return {
        workspaceTop:getComputedStyle(el("workspace")).top,
        workspaceButton:px("workspaceButton", "minHeight"),
        drawerCloseW:px("drawerClose", "width"),
        drawerCloseH:px("drawerClose", "height"),
        toastDismissW:px("toastDismiss", "width"),
        toastDismissH:px("toastDismiss", "height"),
        emptyAction:px("emptyAction", "minHeight"),
        chipRemove:px("chipRemove", "minHeight"),
        budgetMore:px("budgetMore", "minHeight"),
        budgetMenuItem:px("budgetMenuItem", "minHeight"),
        agendaMore:px("agendaMore", "minHeight"),
        agendaMenuItem:px("agendaMenuItem", "minHeight"),
        searchClear:px("searchClear", "minHeight"),
        dialogInput:px("dialogInput", "minHeight"),
        dialogInputFont:px("dialogInput", "fontSize"),
        dialogButton:px("dialogButton", "minHeight"),
        marqueeDisplay:getComputedStyle(el("phoneMarquee")).display,
        budgetInside:budgetRect.left >= -1 && budgetRect.right <= innerWidth + 1,
        agendaInside:agendaRect.left >= -1 && agendaRect.right <= innerWidth + 1,
        paidSameColumn:Math.abs(first.left - second.left) < 2,
        horizontalOverflow:document.documentElement.scrollWidth > innerWidth + 1
      };
    });
    expect(metrics.workspaceTop).toBe("112px");
    expect(metrics.workspaceButton).toBeGreaterThanOrEqual(44);
    expect(metrics.drawerCloseW).toBeGreaterThanOrEqual(44);
    expect(metrics.drawerCloseH).toBeGreaterThanOrEqual(44);
    expect(metrics.toastDismissW).toBeGreaterThanOrEqual(44);
    expect(metrics.toastDismissH).toBeGreaterThanOrEqual(44);
    expect(metrics.emptyAction).toBeGreaterThanOrEqual(44);
    expect(metrics.chipRemove).toBeGreaterThanOrEqual(44);
    expect(metrics.budgetMore).toBeGreaterThanOrEqual(44);
    expect(metrics.budgetMenuItem).toBeGreaterThanOrEqual(44);
    expect(metrics.agendaMore).toBeGreaterThanOrEqual(44);
    expect(metrics.agendaMenuItem).toBeGreaterThanOrEqual(44);
    expect(metrics.searchClear).toBeGreaterThanOrEqual(44);
    expect(metrics.dialogInput).toBeGreaterThanOrEqual(44);
    expect(metrics.dialogInputFont).toBeGreaterThanOrEqual(16);
    expect(metrics.dialogButton).toBeGreaterThanOrEqual(44);
    expect(metrics.marqueeDisplay).toBe("none");
    expect(metrics.budgetInside).toBe(true);
    expect(metrics.agendaInside).toBe(true);
    expect(metrics.horizontalOverflow).toBe(false);
    expect(metrics.paidSameColumn).toBe(width <= 340);
  });
}

test("V15.2.2 short landscape phones retain touch-safe controls", async ({ page }) => {
  await fixture(page, 844, 390);
  const metrics = await page.evaluate(() => ({
    workspaceTop:getComputedStyle(document.getElementById("workspace")).top,
    input:parseFloat(getComputedStyle(document.getElementById("dialogInput")).minHeight),
    button:parseFloat(getComputedStyle(document.getElementById("dialogButton")).minHeight),
    dismiss:parseFloat(getComputedStyle(document.getElementById("toastDismiss")).height),
    drawer:parseFloat(getComputedStyle(document.getElementById("drawerClose")).height),
    overflow:document.documentElement.scrollWidth > innerWidth + 1
  }));
  expect(metrics.workspaceTop).toBe("112px");
  expect(metrics.input).toBeGreaterThanOrEqual(44);
  expect(metrics.button).toBeGreaterThanOrEqual(44);
  expect(metrics.dismiss).toBeGreaterThanOrEqual(44);
  expect(metrics.drawer).toBeGreaterThanOrEqual(44);
  expect(metrics.overflow).toBe(false);
});

test("V15.2.2 short portrait keeps the dialog within the dynamic viewport", async ({ page }) => {
  await fixture(page, 390, 480);
  const metrics = await page.evaluate(() => {

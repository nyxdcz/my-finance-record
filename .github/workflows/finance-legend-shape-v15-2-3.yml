name: Finance Legend Shape Patch

on:
  push:
    branches:
      - style/finance-legend-shape-v5

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v7
        with:
          ref: style/finance-legend-shape-v5
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply Finance legend shape patch
        run: python .github/patch-finance-legend-shape-v15-2-3.py
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository quality
        run: npm run quality
      - name: Commit validated patch and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf test-results playwright-report
          rm -f .github/patch-finance-legend-shape-v15-2-3.py .github/workflows/finance-legend-shape-v15-2-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: use supplied Finance legend marker shape"
          git push origin HEAD:style/finance-legend-shape-v5

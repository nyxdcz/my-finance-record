name: Pages Artifact R12 Patch

on:
  push:
    branches:
      - fix/pages-ui-align-artifact-r12-final

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pages-ui-align-artifact-r12-final
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply Pages artifact closure fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import textwrap

          root = Path('.')

          index = root / 'index.html'
          s = index.read_text()
          if 'ui-icon-alignment-v15-0-4.css?v=15.0.4-ui2' not in s:
              raise SystemExit('production UI2 stylesheet reference not found')
          index.write_text(s.replace('ui-icon-alignment-v15-0-4.css?v=15.0.4-ui2', 'ui-icon-alignment-v15-0-4.css?v=15.0.4-ui3'))

          sw = root / 'sw.js'
          s = sw.read_text()
          if 'finance-v15-20260815-ui-align-r11' not in s:
              raise SystemExit('r11 service-worker cache not found')
          s = s.replace('finance-v15-20260815-ui-align-r11', 'finance-v15-20260815-ui-align-r12')
          s = s.replace('ui-icon-alignment-v15-0-4.css?v=15.0.4-ui2', 'ui-icon-alignment-v15-0-4.css?v=15.0.4-ui3')
          sw.write_text(s)

          version_path = root / 'version.json'
          version = json.loads(version_path.read_text())
          version['cacheVersion'] = 'finance-v15-20260815-ui-align-r12'
          version['notes'] = 'Fixes Record spending and Add Expense refresh failures, preserves safe multi-device Finance behavior, and closes the GitHub Pages production artifact so the final UI alignment stylesheet is actually deployed and precached without changing Finance Schema 12 or Cloud Schema V3.'
          version_path.write_text(json.dumps(version, indent=2) + '\n')

          ui = root / 'ui-icon-alignment-v15-0-4.css'
          s = ui.read_text()
          s = s.replace(
              ' * This file intentionally loads before some legacy interaction CSS.\n * Use stronger selectors for the approved alignment rules so later legacy\n * declarations cannot recreate the build icon or widen icon/label spacing.',
              ' * This file is the final visual layer after legacy interaction CSS.\n * Strong selectors remain intentional so future legacy declarations cannot\n * recreate the build icon or widen icon/label spacing.'
          )
          ui.write_text(s)

          for p in (root / 'tests').glob('*.mjs'):
              s = p.read_text()
              s = s.replace('finance-v15-20260815-ui-align-r11', 'finance-v15-20260815-ui-align-r12')
              s = s.replace('ui-icon-alignment-v15-0-4.css?v=15.0.4-ui2', 'ui-icon-alignment-v15-0-4.css?v=15.0.4-ui3')
              s = s.replace('ui-icon-alignment-v15-0-4\\.css\\?v=15\\.0\\.4-ui2', 'ui-icon-alignment-v15-0-4\\.css\\?v=15\\.0\\.4-ui3')
              p.write_text(s)

          inspector = root / 'tests/inspect-project.mjs'
          s = inspector.read_text()
          required_old = '"index.html", "app.css", "dashboard-interactions.css", "liquid-glass-v15.css", "mobile-v14-0-23.css",'
          required_new = '"index.html", "app.css", "dashboard-interactions.css", "ui-icon-alignment-v15-0-4.css", "liquid-glass-v15.css", "mobile-v14-0-23.css",'
          if required_old not in s:
              raise SystemExit('inspector required-files anchor not found')
          s = s.replace(required_old, required_new, 1)

          marker = 'let pkg = {}, lock = {}, version = {};\n'
          guard = textwrap.dedent(r'''
          // Ensure every local asset referenced by production HTML or the service worker is packaged by GitHub Pages.
          const deploySources = new Set();
          const deployPrefixes = [];
          for (const line of workflow.split(/\r?\n/)) {
            const trimmed = line.trim();
            if (!trimmed.startsWith("cp ") || !trimmed.includes(" _site")) continue;
            const sources = trimmed.slice(3).split(" _site", 1)[0].trim().split(/\s+/);
            for (const source of sources) {
              const normalized = source.replace(/^\.\//, "");
              if (normalized.includes("*")) deployPrefixes.push(normalized.slice(0, normalized.indexOf("*")));
              else deploySources.add(normalized);
            }
          }
          const deployedByPages = assetPath => deploySources.has(assetPath) || deployPrefixes.some(prefix => assetPath.startsWith(prefix));
          const productionAssets = new Set();
          for (const match of html.matchAll(/\b(?:src|href)="([^"]+)"/g)) {
            const value = match[1];
            if (/^(?:https?:|data:|#|javascript:|\$\{)/.test(value)) continue;
            const local = value.split(/[?#]/, 1)[0].replace(/^\.\//, "");
            if (local) productionAssets.add(local);
          }
          for (const match of worker.matchAll(/asset\("([^"]+)"\)/g)) {
            const local = match[1].split(/[?#]/, 1)[0].replace(/^\.\//, "");
            if (local) productionAssets.add(local);
          }
          for (const assetPath of productionAssets) {
            if (!deployedByPages(assetPath)) fail(`GitHub Pages deploy omits production asset: ${assetPath}`);
          }
          if (!deploySources.has("ui-icon-alignment-v15-0-4.css")) fail("GitHub Pages must package ui-icon-alignment-v15-0-4.css");

          ''')
          if 'GitHub Pages deploy omits production asset:' not in s:
              if marker not in s:
                  raise SystemExit('inspector deployment guard insertion anchor not found')
              s = s.replace(marker, guard + marker, 1)
          inspector.write_text(s)

          workflow = (root / '.github/workflows/quality-pages.yml').read_text()
          if 'ui-icon-alignment-v15-0-4.css' not in workflow:
              raise SystemExit('Pages workflow still omits UI alignment stylesheet')
          if 'test -f _site/ui-icon-alignment-v15-0-4.css' not in workflow:
              raise SystemExit('Pages workflow missing explicit UI alignment artifact guard')
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run full repository quality
        run: npm run quality
      - name: Commit validated r12 patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/pages-artifact-r12-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js version.json ui-icon-alignment-v15-0-4.css tests .github/workflows/quality-pages.yml
          git commit -m "fix: close V15.0.4 Pages asset bundle"
          git push origin HEAD:fix/pages-ui-align-artifact-r12-final

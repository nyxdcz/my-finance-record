name: Agent V15.2.8 PWA UI ownership cleanup

on:
  push:
    branches: [agent/pwa-ui-ownership-v15-2-8]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/pwa-ui-ownership-v15-2-8
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply approved ownership cleanup
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const OLD_VERSION = '15.2.7';
          const NEW_VERSION = '15.2.8';
          const OLD_CACHE = 'finance-v15-20260819-sync-config-separation-r43';
          const NEW_CACHE = 'finance-v15-20260819-pwa-ui-ownership-r44';
          const read = file => fs.readFileSync(file, 'utf8');
          const write = (file, value) => fs.writeFileSync(file, value);
          const requireIncludes = (value, marker, file) => {
            if (!value.includes(marker)) throw new Error(`${file} missing expected marker: ${marker}`);
          };

          // 1) Remove only the runtime-injected Cash Flow stylesheet. Keep the DOM upgrade behavior.
          {
            const file = 'assets/js/pwa-update-v15-0-5.js';
            let text = read(file);
            const startMarker = '  function installCashFlowStyles() {';
            const nextMarker = '\n\n  function parseMoneyText(value) {';
            const start = text.indexOf(startMarker);
            const end = text.indexOf(nextMarker, start);
            if (start < 0 || end < 0) throw new Error('Could not isolate installCashFlowStyles()');
            text = text.slice(0, start) + text.slice(end + 2);
            const call = '    installCashFlowStyles();\n';
            requireIncludes(text, call, file);
            text = text.replace(call, '');
            text = text.replaceAll(OLD_CACHE, NEW_CACHE);
            if (text.includes('installCashFlowStyles') || text.includes('cashFlowLayoutV1522')) {
              throw new Error('Cash Flow runtime style owner still exists in pwa-update');
            }
            write(file, text);
          }

          // 2) Preserve the currently effective computed style in the static CSS owner.
          {
            const file = 'assets/css/desktop-ux-v15-2-0.css';
            let text = read(file);
            const oldLegend = `#dashCashFlowChart .cash-flow-chart-main .chart-legend{\n  flex:0 0 auto;\n  margin-top:8px;\n}`;
            const newLegend = `#dashCashFlowChart .cash-flow-chart-main .chart-legend{\n  flex:0 0 auto;\n  margin:6px 0 0;\n  padding-top:6px;\n  border-top:1px solid var(--line);\n}`;
            requireIncludes(text, oldLegend, file);
            text = text.replace(oldLegend, newLegend);
            requireIncludes(text, '  padding:10px 11px;', file);
            text = text.replace('  padding:10px 11px;', '  padding:10px;');
            write(file, text);
          }

          // 3) Release identity and cache rotation.
          const simpleReleaseFiles = [
            'index.html',
            'sw.js',
            'assets/js/ui/sync-runtime-compat.js',
            'package.json',
            'package-lock.json',
            'README.md'
          ];
          for (const file of simpleReleaseFiles) {
            let text = read(file);
            text = text.replaceAll(OLD_VERSION, NEW_VERSION).replaceAll(OLD_CACHE, NEW_CACHE);
            write(file, text);
          }

          // Correct the current service-worker release comment after the mechanical version bump.
          {
            const file = 'sw.js';
            let text = read(file);
            text = text.replace(
              '// V15.2.8 extracts Application Help UI into a dedicated precached runtime module without changing Finance or sync behavior.',
              '// V15.2.8 consolidates Cash Flow presentation ownership in static CSS without changing Finance or sync behavior.\n// V15.2.7 extracted Application Help UI into a dedicated precached runtime module without changing Finance or sync behavior.'
            );
            write(file, text);
          }

          // Current release layer name/date metadata.
          {
            const file = 'assets/js/ui/sync-runtime-compat.js';
            let text = read(file);
            text = text.replace('const RELEASE_NAME = "Application Help Module Extraction";', 'const RELEASE_NAME = "PWA UI Ownership Cleanup";');
            write(file, text);
          }

          // Canonical structured release metadata.
          {
            const file = 'version.json';
            const data = JSON.parse(read(file));
            data.version = NEW_VERSION;
            data.cacheVersion = NEW_CACHE;
            data.released = '2026-08-19';
            data.name = 'PWA UI Ownership Cleanup';
            data.notes = 'V15.2.8 moves Cash Flow presentation ownership out of the PWA update runtime and into the existing desktop UX stylesheet while preserving the current rendered geometry and Cash Flow summary behavior. The PWA update module keeps cache/update responsibilities and existing UI behavior, including Quick add, header tools, sidebar brand, and phone compact enhancements. Finance Schema 12, Cloud Schema V3, finance records, calculations, balances, storage, authentication, sync/conflict behavior, and the five-minute sync cadence are unchanged.';
            write(file, JSON.stringify(data, null, 2) + '\n');
          }

          // README current-release wording only.
          {
            const file = 'README.md';
            let text = read(file);
            text = text.replace('Current release: **V15.2.8 · Application Help Module Extraction**', 'Current release: **V15.2.8 · PWA UI Ownership Cleanup**');
            text = text.replace(
              'V15.2.8 continues the maintainability work by extracting the contextual Application Help subsystem into `assets/js/ui/application-help.js` while preserving finance behavior, storage, sync/conflict handling, desktop/mobile layouts, and installed-PWA compatibility.',
              'V15.2.8 consolidates Cash Flow presentation ownership in `assets/css/desktop-ux-v15-2-0.css` and removes the duplicate runtime-injected Cash Flow stylesheet from the PWA update module while preserving the current rendered UI, finance behavior, storage, sync/conflict handling, and installed-PWA compatibility.'
            );
            write(file, text);
          }

          // CHANGELOG: preserve historical entries and prepend only the new release.
          {
            const file = 'CHANGELOG.md';
            let text = read(file);
            const heading = '## 15.2.8 · 2026-08-19';
            if (!text.startsWith(heading)) {
              text = `${heading}\n- Consolidated Dashboard Cash Flow presentation ownership into \`assets/css/desktop-ux-v15-2-0.css\` and removed the duplicate runtime-injected Cash Flow stylesheet from \`assets/js/pwa-update-v15-0-5.js\`.\n- Preserved the current Cash Flow legend spacing, summary padding, responsive one/two-column geometry, and DOM summary upgrade behavior while keeping the legacy PWA updater URL compatible.\n- Added source and browser ownership regressions, rotated the PWA shell to \`${NEW_CACHE}\`, and kept Finance Schema 12, Cloud Schema V3, finance calculations, balances, records, storage, authentication, sync/conflict behavior, and five-minute Cloud Sync behavior unchanged.\n\n${text}`;
            }
            write(file, text);
          }

          // 4) Keep current-release tests/inspection aligned mechanically.
          const walk = dir => fs.readdirSync(dir, { withFileTypes:true }).flatMap(entry => {
            const full = path.join(dir, entry.name);
            return entry.isDirectory() ? walk(full) : [full];
          });
          for (const file of walk('tests').filter(file => /\.(?:mjs|js)$/.test(file))) {
            let text = read(file);
            if (!text.includes(OLD_CACHE)) continue;
            text = text.replaceAll(OLD_CACHE, NEW_CACHE).replaceAll(OLD_VERSION, NEW_VERSION);
            write(file, text);
          }
          {
            const file = 'tests/helpers/inspect-project.mjs';
            let text = read(file).replaceAll(OLD_VERSION, NEW_VERSION);
            write(file, text);
          }

          // 5) Strengthen source ownership regression.
          {
            const file = 'tests/regression/validate-pwa-updater-v15-0-5.mjs';
            let text = read(file);
            if (!text.includes('const desktopUx = fs.readFileSync("desktop-ux-v15-2-0.css", "utf8");')) {
              text = text.replace(
                'const updater = fs.readFileSync("pwa-update-v15-0-5.js", "utf8");',
                'const updater = fs.readFileSync("pwa-update-v15-0-5.js", "utf8");\nconst desktopUx = fs.readFileSync("desktop-ux-v15-2-0.css", "utf8");'
              );
            }
            const marker = 'assert.match(updater, /async clearFinanceCaches\\(\\)/);';
            requireIncludes(text, marker, file);
            if (!text.includes('Cash Flow presentation must not be injected by the PWA updater')) {
              text = text.replace(marker, `${marker}\nassert.doesNotMatch(updater, /installCashFlowStyles|cashFlowLayoutV1522/, "Cash Flow presentation must not be injected by the PWA updater");\nassert.match(updater, /function upgradeCashFlowLayout\\(\\)/, "Cash Flow DOM summary upgrade behavior must remain in place");\nassert.match(desktopUx, /\\.cash-flow-chart-main \\.chart-legend\\{[\\s\\S]*margin:6px 0 0;[\\s\\S]*padding-top:6px;[\\s\\S]*border-top:1px solid var\\(--line\\);/, "Static CSS must own the current Cash Flow legend geometry");\nassert.match(desktopUx, /\\.cash-flow-summary-panel\\{[\\s\\S]*padding:10px;/, "Static CSS must own the current Cash Flow summary padding");`);
            }
            write(file, text);
          }

          // 6) Add rendered ownership regression using the real app shell, CSS, and PWA updater.
          {
            const file = 'tests/browser/cash-flow-style-ownership.spec.mjs';
            const content = `import { test, expect } from "@playwright/test";\n\nconst viewports = [390, 820, 1440];\n\nfor (const width of viewports) {\n  test(\`Cash Flow uses static CSS ownership at \${width}px\`, async ({ page }) => {\n    await page.setViewportSize({ width, height: 900 });\n    await page.goto("http://127.0.0.1:3000/index.html?page=dashboard", { waitUntil:"networkidle" });\n\n    await expect(page.locator("style#cashFlowLayoutV1522")).toHaveCount(0);\n    await expect(page.locator("#dashCashFlowChart")).toHaveCount(1);\n\n    await page.evaluate(() => {\n      const target = document.getElementById("dashCashFlowChart");\n      target.innerHTML = \`\n        <div class="cash-flow-chart-grid">\n          <section class="cash-flow-chart-panel"><h4>Chart</h4><svg class="chart-svg" viewBox="0 0 100 40"></svg></section>\n          <section class="cash-flow-chart-panel">\n            <svg><title>August 2026 income: ₱10,000.00</title><title>August 2026 expenses: ₱4,000.00</title><title>August 2026 balance: ₱6,000.00</title><title>July 2026 income: ₱9,000.00</title><title>July 2026 expenses: ₱4,500.00</title><title>July 2026 balance: ₱4,500.00</title></svg>\n          </section>\n        </div>\n        <div class="chart-legend">Income · Expenses</div>\n        <div class="chart-note">Legacy note</div>\n      \`;\n    });\n\n    await expect(page.locator("#dashCashFlowChart .cash-flow-summary-panel")).toHaveCount(1);\n    const metrics = await page.evaluate(() => {\n      const target = document.getElementById("dashCashFlowChart");\n      const grid = target.querySelector(".cash-flow-chart-grid");\n      const main = target.querySelector(".cash-flow-chart-main");\n      const summary = target.querySelector(".cash-flow-summary-panel");\n      const legend = target.querySelector(".cash-flow-chart-main .chart-legend");\n      const mainRect = main.getBoundingClientRect();\n      const summaryRect = summary.getBoundingClientRect();\n      const legendStyle = getComputedStyle(legend);\n      const summaryStyle = getComputedStyle(summary);\n      return {\n        runtimeStyle:Boolean(document.getElementById("cashFlowLayoutV1522")),\n        staticOwner:[...document.styleSheets].some(sheet => String(sheet.href || "").includes("desktop-ux-v15-2-0.css")),\n        gridTemplate:getComputedStyle(grid).gridTemplateColumns,\n        mainRect:{ left:mainRect.left, right:mainRect.right, top:mainRect.top, bottom:mainRect.bottom },\n        summaryRect:{ left:summaryRect.left, right:summaryRect.right, top:summaryRect.top, bottom:summaryRect.bottom },\n        legendMarginTop:legendStyle.marginTop,\n        legendPaddingTop:legendStyle.paddingTop,\n        legendBorderTopStyle:legendStyle.borderTopStyle,\n        summaryPaddingTop:summaryStyle.paddingTop,\n        summaryPaddingRight:summaryStyle.paddingRight,\n        overflow:document.documentElement.scrollWidth > innerWidth + 1\n      };\n    });\n\n    expect(metrics.runtimeStyle).toBe(false);\n    expect(metrics.staticOwner).toBe(true);\n    expect(metrics.legendMarginTop).toBe("6px");\n    expect(metrics.legendPaddingTop).toBe("6px");\n    expect(metrics.legendBorderTopStyle).toBe("solid");\n    expect(metrics.summaryPaddingTop).toBe("10px");\n    expect(metrics.summaryPaddingRight).toBe("10px");\n    expect(metrics.overflow).toBe(false);\n    if (width <= 700) expect(metrics.summaryRect.top).toBeGreaterThanOrEqual(metrics.mainRect.bottom - 1);\n    else expect(metrics.summaryRect.left).toBeGreaterThanOrEqual(metrics.mainRect.right - 1);\n  });\n}\n`;
            write(file, content);
          }

          // No stale active release/cache pins may remain outside historical CHANGELOG text.
          const activeFiles = [
            'index.html','sw.js','version.json','package.json','package-lock.json','README.md',
            'assets/js/pwa-update-v15-0-5.js','assets/js/ui/sync-runtime-compat.js','tests/helpers/inspect-project.mjs'
          ];
          for (const file of activeFiles) {
            const text = read(file);
            if (text.includes(OLD_CACHE)) throw new Error(`${file} still contains stale r43 cache`);
          }
          if (read('assets/js/pwa-update-v15-0-5.js').includes('installCashFlowStyles')) throw new Error('Runtime Cash Flow style owner survived');
          if (!read('assets/css/desktop-ux-v15-2-0.css').includes('margin:6px 0 0;')) throw new Error('Static Cash Flow style owner was not normalized');
          NODE
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare compatibility runtime
        run: npm run prepare:runtime
      - name: Run repository quality
        run: npm run quality
      - name: Run full Chromium browser suite
        run: npm run test:browser -- --retries=0
      - name: Audit production dependencies
        run: npm run audit
      - name: Review and commit validated scope
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          git diff --stat
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/js/pwa-update-v15-0-5.js \
            assets/js/ui/sync-runtime-compat.js \
            assets/css/desktop-ux-v15-2-0.css \
            index.html sw.js version.json package.json package-lock.json README.md CHANGELOG.md \
            tests
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
            exit 1
          fi
          git commit -m "refactor(ui): consolidate cash flow styling"
          git push origin HEAD:agent/pwa-ui-ownership-v15-2-8

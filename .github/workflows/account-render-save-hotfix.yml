name: Account render save hotfix

on:
  push:
    paths:
      - ".github/workflows/account-render-save-hotfix.yml"

permissions:
  contents: write
  actions: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply account persistence/render separation
        run: |
          python .github/account-render-save-hotfix.py
          node scripts/prepare-runtime.mjs
          node --check assets/js/account-ledger.js
          node --check assets/js/pwa-update.js
          node tests/regression/validate-pwa-runtime.mjs
          node tests/finance/validate-finance-ui-source.mjs
      - name: Install browser test metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run focused account browser regressions
        run: npx playwright test tests/browser/account-balance-persistence.spec.mjs tests/browser/account-submit-compat.spec.mjs
      - name: Commit hotfix and remove temporary runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/account-render-save-hotfix.py .github/workflows/account-render-save-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: decouple account saves from UI refresh"
          git push origin HEAD:main
          gh workflow run quality-pages.yml --ref main

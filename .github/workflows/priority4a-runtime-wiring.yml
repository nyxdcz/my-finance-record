name: Priority 4A runtime wiring

on:
  push:
    branches:
      - refactor/priority4a-sync-config-separation
    paths:
      - .github/workflows/priority4a-runtime-wiring.yml

permissions:
  contents: write

jobs:
  wire-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/priority4a-sync-config-separation
      - name: Wire separated sync runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          old_cache = "finance-v15-20260819-application-help-r42"
          new_cache = "finance-v15-20260819-sync-config-separation-r43"
          runtime_url = './sync-runtime-compat.js?v=15.2.7-priority4a1'

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence of {old!r}, found {count}")
              path.write_text(text.replace(old, new, 1))

          replace_once(
              "index.html",
              '<script src="./sync-config.js?v=15.2.7-release1"></script>',
              '<script src="./sync-config.js?v=15.2.7-release1"></script>\n<script src="./sync-runtime-compat.js?v=15.2.7-priority4a1"></script>',
          )

          replace_once("sw.js", f'const CACHE_VERSION = "{old_cache}";', f'const CACHE_VERSION = "{new_cache}";')
          replace_once(
              "sw.js",
              '  asset("./sync-config.js?v=15.2.7-release1"),',
              '  asset("./sync-config.js?v=15.2.7-release1"),\n  asset("./sync-runtime-compat.js?v=15.2.7-priority4a1"),',
          )

          pwa = Path("assets/js/pwa-update-v15-0-5.js")
          pwa_text = pwa.read_text()
          if old_cache not in pwa_text:
              raise SystemExit("PWA update layer does not contain the expected cache identity")
          pwa.write_text(pwa_text.replace(old_cache, new_cache))

          runtime = Path("assets/js/ui/sync-runtime-compat.js")
          runtime_text = runtime.read_text()
          marker = "(function applyV15ReleaseLayer() {"
          marker_at = runtime_text.find(marker)
          if marker_at < 0:
              raise SystemExit("Could not find runtime compatibility marker")
          runtime.write_text(runtime_text[marker_at:])

          version_path = Path("version.json")
          version = json.loads(version_path.read_text())
          if version.get("version") != "15.2.7" or version.get("schemaVersion") != 12 or version.get("cloudSchemaVersion") != 3:
              raise SystemExit("Unexpected release/schema identity before Priority 4A")
          if version.get("cacheVersion") != old_cache:
              raise SystemExit("Unexpected cache identity before Priority 4A")
          version["cacheVersion"] = new_cache
          version["notes"] = (
              "V15.2.7 extracts the existing Application Help UI subsystem from index.html into "
              "assets/js/ui/application-help.js and preserves the same help topics, global functions, dialog behavior, "
              "focus return, and runtime URLs. Priority 4A additionally separates hosted sync configuration from the "
              "legacy compatibility/UI runtime into assets/js/ui/sync-runtime-compat.js and rotates PWA delivery to r43. "
              "Finance Schema 12, Cloud Schema V3, finance records, calculations, balances, storage, sync/conflict behavior, "
              "sidebar behavior, layouts, and the five-minute sync cadence are unchanged."
          )
          version_path.write_text(json.dumps(version, indent=2) + "\n")

          for test_path in Path("tests").rglob("*.mjs"):
              text = test_path.read_text()
              if old_cache in text:
                  test_path.write_text(text.replace(old_cache, new_cache))

          workflow = Path(".github/workflows/quality-pages.yml")
          workflow_text = workflow.read_text()
          app_help_check = "test -f _site/application-help.js"
          if app_help_check in workflow_text and "test -f _site/sync-runtime-compat.js" not in workflow_text:
              workflow.write_text(workflow_text.replace(app_help_check, app_help_check + "\n          test -f _site/sync-runtime-compat.js", 1))
          PY
      - name: Commit Priority 4A wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js version.json assets/js/pwa-update-v15-0-5.js assets/js/ui/sync-runtime-compat.js tests .github/workflows/quality-pages.yml
          git diff --cached --check
          git commit -m "refactor: wire Priority 4A sync runtime separation"
          git push origin HEAD:refactor/priority4a-sync-config-separation

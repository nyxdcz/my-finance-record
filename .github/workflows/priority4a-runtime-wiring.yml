name: Priority 4A runtime wiring

on:
  push:
    branches:
      - agent/fix-v15-2-7-ui-runtime
    paths:
      - .github/workflows/priority4a-runtime-wiring.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  wire-runtime:
    if: github.event_name == 'push' || github.head_ref == 'agent/fix-v15-2-7-ui-runtime'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-v15-2-7-ui-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply scoped runtime and PWA repair
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const oldCache = "finance-v15-20260819-application-help-r42";
          const newCache = "finance-v15-20260819-sync-config-separation-r43";
          const runtimeUrl = "./sync-runtime-compat.js?v=15.2.7-priority4a1";
          const read = file => fs.readFileSync(file, "utf8");
          const write = (file, text) => fs.writeFileSync(file, text);
          const replaceOnce = (text, from, to, label) => {
            const first = text.indexOf(from);
            if (first < 0 || text.indexOf(from, first + from.length) >= 0) throw new Error(`${label}: expected exactly one match`);
            return text.slice(0, first) + to + text.slice(first + from.length);
          };

          let index = read("index.html");
          const configTag = '<script src="./sync-config.js?v=15.2.7-release1"></script>';
          const runtimeTag = `<script src="${runtimeUrl}"></script>`;
          if (!index.includes(runtimeTag)) index = replaceOnce(index, configTag, `${configTag}\n  ${runtimeTag}`, "index sync-config tag");
          if (!index.includes(oldCache)) throw new Error("index.html: expected the current r42 cache identity");
          index = index.replaceAll(oldCache, newCache);
          write("index.html", index);

          let worker = read("sw.js");
          if (!worker.includes(oldCache)) throw new Error("sw.js: expected the current r42 cache identity");
          worker = worker.replaceAll(oldCache, newCache);
          const configAsset = '  asset("./sync-config.js?v=15.2.7-release1"),';
          const runtimeAsset = '  asset("./sync-runtime-compat.js?v=15.2.7-priority4a1"),';
          if (!worker.includes(runtimeAsset)) worker = replaceOnce(worker, configAsset, `${configAsset}\n${runtimeAsset}`, "service-worker sync-config asset");
          write("sw.js", worker);

          let pwa = read("assets/js/pwa-update-v15-0-5.js");
          if (!pwa.includes(oldCache)) throw new Error("PWA update layer does not contain the expected r42 cache identity");
          write("assets/js/pwa-update-v15-0-5.js", pwa.replaceAll(oldCache, newCache));

          let runtime = read("assets/js/ui/sync-runtime-compat.js");
          const runtimeMarker = "(function applyV15ReleaseLayer() {";
          const runtimeMarkerAt = runtime.indexOf(runtimeMarker);
          if (runtimeMarkerAt < 0) throw new Error("Could not find the sync runtime compatibility marker");
          runtime = runtime.slice(runtimeMarkerAt);
          write("assets/js/ui/sync-runtime-compat.js", runtime);

          const version = JSON.parse(read("version.json"));
          if (version.version !== "15.2.7") throw new Error("Unexpected application version before repair");
          if (version.schemaVersion !== 12 || version.cloudSchemaVersion !== 3) throw new Error("UI runtime repair must not change Finance Schema 12 or Cloud Schema V3");
          if (version.cacheVersion !== oldCache) throw new Error("Unexpected cache identity before repair");
          version.cacheVersion = newCache;
          version.notes = "V15.2.7 extracts the existing Application Help UI subsystem from index.html into assets/js/ui/application-help.js and preserves the same help topics, global functions, dialog behavior, focus return, and runtime URLs. This focused repair completes Priority 4A by loading the separated sync-runtime-compat.js after hosted sync configuration and precaching it under r43. Finance Schema 12, Cloud Schema V3, finance records, calculations, balances, storage, authentication, sync/conflict behavior, sidebar behavior, layouts, and the five-minute sync cadence are unchanged.";
          write("version.json", `${JSON.stringify(version, null, 2)}\n`);

          const walk = directory => fs.readdirSync(directory, { withFileTypes:true }).flatMap(entry => {
            const target = path.join(directory, entry.name);
            return entry.isDirectory() ? walk(target) : [target];
          });
          for (const testFile of walk("tests").filter(file => file.endsWith(".mjs"))) {
            const text = read(testFile);
            if (text.includes(oldCache)) write(testFile, text.replaceAll(oldCache, newCache));
          }

          const monthTest = "tests/regression/validate-month-navigation-borderless-v15-1-0.mjs";
          let month = read(monthTest);
          month = replaceOnce(month, 'const sync = fs.readFileSync("sync-config.js", "utf8");', 'const runtime = fs.readFileSync("assets/js/ui/sync-runtime-compat.js", "utf8");', "month-navigation source owner");
          month = replaceOnce(month, 'assert.match(sync, /liquid-glass-v15\\.css\\?v=\\$\\{VERSION\\}-light1/);', 'assert.match(runtime, /liquid-glass-v15\\.css\\?v=\\$\\{VERSION\\}-light1/);', "month-navigation runtime assertion");
          write(monthTest, month);

          const separationTest = "tests/regression/validate-sync-config-separation.mjs";
          let separation = read(separationTest);
          const serviceWorkerAssert = 'if (!serviceWorker.includes("./sync-runtime-compat.js?v=15.2.7-priority4a1")) throw new Error("Service worker must precache the sync runtime compatibility file.");';
          if (!separation.includes(serviceWorkerAssert)) throw new Error("Could not identify the existing Priority 4A service-worker assertion");
          const cacheAssert = 'if (!index.includes(`const APP_CACHE_VERSION = "${expectedCache}";`)) throw new Error("index.html cache identity is not synchronized.");';
          const runtimeConfigAssert = 'if (runtime.includes("window.FINANCE_SYNC_CONFIG")) throw new Error("sync runtime compatibility file must not own hosted sync configuration.");';
          if (!separation.includes(cacheAssert)) separation = separation.replace(serviceWorkerAssert, `${serviceWorkerAssert}\n${cacheAssert}`);
          if (!separation.includes(runtimeConfigAssert)) separation = separation.replace(cacheAssert, `${cacheAssert}\n${runtimeConfigAssert}`);
          write(separationTest, separation);

          const pagesWorkflow = ".github/workflows/quality-pages.yml";
          let pages = read(pagesWorkflow);
          const appHelpCheck = "          test -f _site/application-help.js";
          const runtimeCheck = "          test -f _site/sync-runtime-compat.js";
          if (!pages.includes(runtimeCheck)) pages = replaceOnce(pages, appHelpCheck, `${appHelpCheck}\n${runtimeCheck}`, "Pages application-help assertion");
          write(pagesWorkflow, pages);
          NODE
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run source quality and regression validation
        run: npm run quality
      - name: Run browser and UI validation
        run: npm run test:browser
      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/priority4a-runtime-wiring.yml
          rm -f .github/workflows/agent-ui-runtime-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            index.html \
            sw.js \
            version.json \
            assets/js/pwa-update-v15-0-5.js \
            assets/js/ui/sync-runtime-compat.js \
            .github/workflows/quality-pages.yml \
            .github/workflows/priority4a-runtime-wiring.yml \
            .github/workflows/agent-ui-runtime-repair.yml \
            tests
          git diff --cached --check
          git status --short
          git commit -m "fix: restore V15.2.7 UI runtime delivery"
          git push origin HEAD:agent/fix-v15-2-7-ui-runtime

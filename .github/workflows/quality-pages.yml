name: Quality and GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Regression quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository, lint, maintainability, and regression validation
        run: npm run quality
      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tests/check-pr-title.mjs
      - name: Audit production dependencies
        run: npm run audit

  browser:
    name: Browser privacy and accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run portable browser validation
        run: npm run test:browser

  deploy:
    name: Deploy validated PWA
    if: github.event_name != 'pull_request'
    needs: [quality, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Prepare production-only site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/icons _site/vendor
          cp index.html offline.html manifest.webmanifest version.json sw.js app.css dashboard-interactions.css ui-icon-alignment-v15-0-4.css dashboard-interactions-core-v14-0-23.css liquid-glass-v15.css mobile-v14-0-23.css interaction-patterns.js privacy-lock.js security-profiles.js security-profiles.css cloud-conflict-review.js cloud-conflict-resolution.js cloud-sync-lifecycle.js cloud-sync.js account-ledger.js account-ledger.css budget-planning.js budget-planning.css reports-insights.js reports-insights.css productivity-tools.js productivity-tools.css reminders-alerts.js reminders-alerts.css projects-calendar-v13.0.20.js projects-calendar-v13.0.20.css sync-config.js expense-screenshot-parser.js expense-screenshot-detect.js expense-screenshot-ai.js _site/
          cp vendor/supabase.min.js _site/vendor/
          cp icons/* _site/icons/
          test -f _site/dashboard-interactions-core-v14-0-23.css
          test -f _site/liquid-glass-v15.css
          test -f _site/ui-icon-alignment-v15-0-4.css
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

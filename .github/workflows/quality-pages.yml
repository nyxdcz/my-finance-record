name: Quality and GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize_release:
    name: Finalize compact V15.2.19
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore: activate compact V15.2.19 finalizer'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Apply approved compact expense-card release
        run: python scripts/finalize-compact-v15-2-19.py
      - name: Verify generated diff
        run: git diff --check
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/css/production-ui-audit-v15-2-13.css \
            tests/browser/production-ui-audit-v15-2-13.spec.mjs \
            index.html \
            package.json package-lock.json version.json README.md CHANGELOG.md \
            sw.js assets/js/pwa-update-v15-0-5.js \
            tests/helpers/inspect-project.mjs \
            tests/regression/validate-production-ui-audit-v15-2-13.mjs \
            tests/regression/validate-pwa-updater-v15-0-5.mjs
          git commit -m "release: V15.2.19 compact expense cards"
          git push origin HEAD:main

  quality:
    name: Regression quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository, lint, maintainability, and regression validation
        run: npm run quality
      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tests/helpers/check-pr-title.mjs
      - name: Audit production dependencies
        run: npm run audit

  browser:
    name: Browser privacy and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run portable browser validation
        run: npm run test:browser

  deploy:
    name: Deploy validated PWA
    if: github.event_name != 'pull_request'
    needs: [quality, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Prepare production-only site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/icons _site/vendor
          cp index.html offline.html manifest.webmanifest version.json sw.js sync-config.js _site/
          cp assets/css/*.css _site/
          cp assets/js/*.js _site/
          cp assets/js/features/*.js _site/
          cp assets/js/ui/*.js _site/
          cp vendor/supabase.min.js _site/vendor/
          cp icons/* _site/icons/
          test -f _site/dashboard-interactions-core-v14-0-23.css
          test -f _site/liquid-glass-v15.css
          test -f _site/ui-icon-alignment-v15-0-5.css
          test -f _site/black-canvas-v15-1-0.css
          test -f _site/desktop-ui-phase1-v15-1-0.css
          test -f _site/desktop-ux-v15-2-0.css
          test -f _site/shell-ui-v15-2-11.css
          test -f _site/production-ui-audit-v15-2-13.css
          test -f _site/pwa-update-v15-0-5.js
          test -f _site/cash-flow-summary.js
          test -f _site/form-inputs.js
          test -f _site/application-help.js
          test -f _site/header-tools-compat.js
          test -f _site/phone-finance-compat.js
          test -f _site/sync-runtime-compat.js
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before first Pages retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Retry GitHub Pages deployment
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before final Pages retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        run: sleep 45
      - name: Final GitHub Pages deployment retry
        id: deployment_retry_2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

name: Quality and GitHub Pages
# Temporary V15.2.10 validation trigger 6; removed before final review.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Regression quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository, lint, maintainability, and regression validation
        run: npm run quality
      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tests/helpers/check-pr-title.mjs
      - name: Audit production dependencies
        run: npm run audit

  browser:
    name: Browser privacy and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run portable browser validation
        run: npm run test:browser

  deploy:
    name: Deploy validated PWA
    if: github.event_name != 'pull_request'
    needs: [quality, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Prepare production-only site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/icons _site/vendor
          cp index.html offline.html manifest.webmanifest version.json sw.js sync-config.js _site/
          cp assets/css/*.css _site/
          cp assets/js/*.js _site/
          cp assets/js/ui/*.js _site/
          cp vendor/supabase.min.js _site/vendor/
          cp icons/* _site/icons/
          test -f _site/dashboard-interactions-core-v14-0-23.css
          test -f _site/liquid-glass-v15.css
          test -f _site/ui-icon-alignment-v15-0-5.css
          test -f _site/black-canvas-v15-1-0.css
          test -f _site/desktop-ui-phase1-v15-1-0.css
          test -f _site/desktop-ux-v15-2-0.css
          test -f _site/pwa-update-v15-0-5.js
          test -f _site/form-inputs.js
          test -f _site/application-help.js
          test -f _site/sync-runtime-compat.js
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before first Pages retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Retry GitHub Pages deployment
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before final Pages retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        run: sleep 45
      - name: Final GitHub Pages deployment retry
        id: deployment_retry_2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  agent_v15210_apply:
    name: Agent V15.2.10 validated apply
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/sidebar-icons-v15-2-10'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repair validation generator escaping
        run: node scripts/agent-v15-2-10-fix-generator.mjs
      - name: Register embedded-sidebar source regression
        run: node scripts/agent-v15-2-10-register-test.mjs
      - name: Apply approved V15.2.10 hotfix
        run: node scripts/agent-v15-2-10-sidebar-icons.mjs
      - name: Refresh compatibility runtime files
        run: npm run prepare:runtime
      - name: Align V15.2.10 browser contracts
        run: node scripts/agent-v15-2-10-fix-browser-contracts.mjs
      - name: Run source quality
        run: npm run quality
      - name: Run embedded-sidebar source regression
        run: node tests/regression/validate-sidebar-embedded-v15-2-10.mjs
      - name: Run focused embedded-sidebar coverage without retries
        run: npx playwright test tests/browser/ui-asset-delivery-v15-2-10.spec.mjs --retries=0
      - name: Run complete browser suite without retries
        run: npx playwright test --retries=0
      - name: Audit production dependencies
        run: npm run audit
      - name: Commit validated hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Validated V15.2.10 tree already committed."
            exit 0
          fi
          git commit -m "fix(ui): embed V15.2.10 sidebar icons"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

name: Quality and GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent_apply:
    name: Agent PR3 validated apply
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/pwa-ui-ownership-v15-2-8' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/pwa-ui-ownership-v15-2-8
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply approved V15.2.8 transform
        run: node scripts/agent-pwa-ui-ownership-v15-2-8.mjs
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare compatibility runtime
        run: npm run prepare:runtime
      - name: Run repository quality
        run: npm run quality
      - name: Run Chromium browser suite with retries disabled
        run: npm run test:browser -- --retries=0
      - name: Audit production dependencies
        run: npm run audit
      - name: Commit validated application scope
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git diff --check
          git add \
            assets/js/pwa-update-v15-0-5.js \
            assets/js/ui/sync-runtime-compat.js \
            assets/css/desktop-ux-v15-2-0.css \
            index.html sw.js version.json package.json package-lock.json README.md CHANGELOG.md \
            tests
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "refactor(ui): consolidate cash flow styling"
          git push origin HEAD:agent/pwa-ui-ownership-v15-2-8

  quality:
    name: Regression quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository, lint, maintainability, and regression validation
        run: npm run quality
      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tests/helpers/check-pr-title.mjs
      - name: Audit production dependencies
        run: npm run audit

  browser:
    name: Browser privacy and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run portable browser validation
        run: npm run test:browser

  deploy:
    name: Deploy validated PWA
    if: github.event_name != 'pull_request'
    needs: [quality, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Prepare production-only site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/icons _site/vendor
          cp index.html offline.html manifest.webmanifest version.json sw.js sync-config.js _site/
          cp assets/css/*.css _site/
          cp assets/js/*.js _site/
          cp assets/js/ui/*.js _site/
          cp vendor/supabase.min.js _site/vendor/
          cp icons/* _site/icons/
          test -f _site/dashboard-interactions-core-v14-0-23.css
          test -f _site/liquid-glass-v15.css
          test -f _site/ui-icon-alignment-v15-0-5.css
          test -f _site/black-canvas-v15-1-0.css
          test -f _site/desktop-ui-phase1-v15-1-0.css
          test -f _site/desktop-ux-v15-2-0.css
          test -f _site/pwa-update-v15-0-5.js
          test -f _site/form-inputs.js
          test -f _site/application-help.js
          test -f _site/sync-runtime-compat.js
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before first Pages retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Retry GitHub Pages deployment
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before final Pages retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        run: sleep 45
      - name: Final GitHub Pages deployment retry
        id: deployment_retry_2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

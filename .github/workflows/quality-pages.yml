name: Quality and GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-changelog:
    name: Restore PR 134 changelog history
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 134 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Restore full changelog and prepend V15.2.5
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:CHANGELOG.md > /tmp/changelog-main.md
          cat > CHANGELOG.md <<'EOF'
          ## 15.2.5 · 2026-08-18
          - Aligned the Budget & Expenses disclosure controls for Monthly budget plan, Available money, First half, Second half, and Other expenses to the First-half reference geometry: 40px desktop controls on one exact 17px right-side column.
          - Replaced the previous margin approximation with a derived Available money header inset that accounts for its existing 12px card padding, and anchored the collapsed Monthly budget plan control to the same reference edge.
          - Preserved the existing 44px mobile disclosure touch targets and phone layouts while adding source-contract regression coverage for the shared desktop size and right edge.
          - Released the alignment fix as V15.2.5 with cache `finance-v15-20260818-disclosure-alignment-r40`; Finance Schema 12, Cloud Schema V3, finance calculations, account balances, conflict-resolution behavior, and the five-minute routine sync cadence are unchanged.

          EOF
          cat /tmp/changelog-main.md >> CHANGELOG.md
      - name: Commit restored changelog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: preserve full V15.2.5 changelog history"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  quality:
    name: Regression quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository, lint, maintainability, and regression validation
        run: npm run quality
      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tests/check-pr-title.mjs
      - name: Audit production dependencies
        run: npm run audit

  browser:
    name: Browser privacy and accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run portable browser validation
        run: npm run test:browser

  deploy:
    name: Deploy validated PWA
    if: github.event_name != 'pull_request'
    needs: [quality, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Prepare production-only site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/icons _site/vendor
          cp index.html offline.html manifest.webmanifest version.json sw.js app.css dashboard-interactions.css ui-icon-alignment-v15-0-5.css black-canvas-v15-1-0.css desktop-ui-phase1-v15-1-0.css desktop-ux-v15-2-0.css pwa-update-v15-0-5.js dashboard-interactions-core-v14-0-23.css liquid-glass-v15.css mobile-v14-0-23.css interaction-patterns.js privacy-lock.js security-profiles.js security-profiles.css cloud-conflict-review.js cloud-conflict-resolution.js cloud-sync-lifecycle.js cloud-sync.js account-ledger.js account-ledger.css budget-planning.js budget-planning.css reports-insights.js reports-insights.css productivity-tools.js productivity-tools.css reminders-alerts.js reminders-alerts.css projects-calendar-v13.0.20.js projects-calendar-v13.0.20.css sync-config.js expense-screenshot-parser.js expense-screenshot-detect.js expense-screenshot-ai.js _site/
          cp vendor/supabase.min.js _site/vendor/
          cp icons/* _site/icons/
          test -f _site/dashboard-interactions-core-v14-0-23.css
          test -f _site/liquid-glass-v15.css
          test -f _site/ui-icon-alignment-v15-0-5.css
          test -f _site/black-canvas-v15-1-0.css
          test -f _site/desktop-ui-phase1-v15-1-0.css
          test -f _site/desktop-ux-v15-2-0.css
          test -f _site/pwa-update-v15-0-5.js
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before first Pages retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Retry GitHub Pages deployment
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before final Pages retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        run: sleep 45
      - name: Final GitHub Pages deployment retry
        id: deployment_retry_2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

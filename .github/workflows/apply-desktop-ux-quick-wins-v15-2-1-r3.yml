name: Apply desktop UX quick wins V15.2.1 r3

on:
  push:
    branches:
      - agent/desktop-ux-quick-wins-v15-2-1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-ux-quick-wins-v15-2-1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reuse approved source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/apply-desktop-ux-quick-wins-v15-2-1.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, 'approved-desktop-ux-patch.py', 'exec'), {})
          PY

      - name: Align V15.2.1 release metadata and validators
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def one(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              write(path, text.replace(old, new, 1))

          for filename in ('package.json', 'package-lock.json'):
              path = Path(filename)
              data = json.loads(path.read_text(encoding='utf-8'))
              data['version'] = '15.2.1'
              if filename == 'package-lock.json': data['packages']['']['version'] = '15.2.1'
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          one('sync-config.js', 'const VERSION = "15.2.0";', 'const VERSION = "15.2.1";')
          one('sync-config.js', 'const RELEASE_NAME = "Desktop UX Consistency";', 'const RELEASE_NAME = "Desktop UX Quick Wins";')
          one('index.html', 'sync-config.js?v=15.2.0-ux1', 'sync-config.js?v=15.2.1-ux1')
          one('sw.js', 'sync-config.js?v=15.2.0-ux1', 'sync-config.js?v=15.2.1-ux1')

          installer = read('Install_V15_2_0.command').replace('V15.2.0', 'V15.2.1')
          write('Install_V15_2_0.command', installer)

          inspector = read('tests/inspect-project.mjs')
          inspector = inspector.replace('pkg.version !== "15.2.0"', 'pkg.version !== "15.2.1"')
          inspector = inspector.replace('Expected current package version 15.2.0', 'Expected current package version 15.2.1')
          inspector = inspector.replace('# My Finance Records · V15.2.0', '# My Finance Records · V15.2.1')
          inspector = inspector.replace('README release heading is not V15.2.0', 'README release heading is not V15.2.1')
          inspector = inspector.replace('## 15.2.0 · 2026-08-16', '## 15.2.1 · 2026-08-16')
          inspector = inspector.replace('CHANGELOG latest entry is not V15.2.0', 'CHANGELOG latest entry is not V15.2.1')
          inspector = inspector.replace('Repository inspection passed: V15.2.0 release files', 'Repository inspection passed: V15.2.1 release files')
          write('tests/inspect-project.mjs', inspector)

          contract = read('tests/validate-v15-2-0-desktop-ux.mjs')
          contract = contract.replace('version.version === "15.2.0"', 'version.version === "15.2.1"')
          contract = contract.replace('version.json is V15.2.0', 'version.json is V15.2.1')
          contract = contract.replace('pkg.version === "15.2.0"', 'pkg.version === "15.2.1"')
          contract = contract.replace('package.json is V15.2.0', 'package.json is V15.2.1')
          contract = contract.replace('finance-v15-20260816-desktop-ux-r29', 'finance-v15-20260816-desktop-ux-quick-wins-r30')
          contract = contract.replace('r29 cache is declared', 'r30 cache is declared')
          contract = contract.replace('My Finance Records · V15.2.0', 'My Finance Records · V15.2.1')
          contract = contract.replace('page title is V15.2.0', 'page title is V15.2.1')
          contract = contract.replace('const APP_VERSION = "15.2.0"', 'const APP_VERSION = "15.2.1"')
          contract = contract.replace('desktop-ux-v15-2-0.css?v=15.2.0', 'desktop-ux-v15-2-0.css?v=15.2.1')
          contract = contract.replace('const VERSION = "15.2.0"', 'const VERSION = "15.2.1"')
          contract = contract.replace('const RELEASE_NAME = "Desktop UX Consistency"', 'const RELEASE_NAME = "Desktop UX Quick Wins"')
          contract = contract.replace('release override matches V15.2.0', 'release override matches V15.2.1')
          contract = contract.replace('sync-config.js?v=15.2.0-ux1', 'sync-config.js?v=15.2.1-ux1')
          contract = contract.replace('V15.2.0 desktop UX source contract passed', 'V15.2.1 desktop UX source contract passed')
          write('tests/validate-v15-2-0-desktop-ux.mjs', contract)

          new_test = read('tests/v15-2-1-desktop-ux-quick-wins.spec.mjs')
          new_test = new_test.replace("expect(index).toContain('data-empty-action=\"clear-income-filters\"');", "expect(index).toContain('action:\"clear-income-filters\"');")
          write('tests/v15-2-1-desktop-ux-quick-wins.spec.mjs', new_test)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Quality
        run: npm run quality

      - name: Dependency audit
        run: npm run audit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser regression suite
        run: npm run test:browser

      - name: Diff safety checks
        shell: bash
        run: |
          git diff --check
          if git diff --name-only | grep -q '^mobile-v14-0-23.css$'; then
            echo 'Mobile stylesheet must remain unchanged in this desktop pass.' >&2
            exit 1
          fi
          if git diff --name-only | grep -E '^(account-ledger|cloud-conflict|cloud-sync-lifecycle|privacy-lock|mobile-v14-0-23)'; then
            echo 'Unexpected finance/sync/mobile implementation file changed.' >&2
            exit 1
          fi
          git diff --name-only

      - name: Package validated patch
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ux-quick-wins-v15-2-1-r3
          path: |
            index.html
            projects-calendar-v13.0.20.js
            budget-planning.js
            desktop-ux-v15-2-0.css
            cloud-sync.js
            sync-config.js
            sw.js
            version.json
            package.json
            package-lock.json
            Install_V15_2_0.command
            README.md
            CHANGELOG.md
            tests/inspect-project.mjs
            tests/validate-v15-2-0-desktop-ux.mjs
            tests/v15-2-1-desktop-ux-quick-wins.spec.mjs

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects-calendar-v13.0.20.js budget-planning.js desktop-ux-v15-2-0.css cloud-sync.js sync-config.js sw.js version.json package.json package-lock.json Install_V15_2_0.command README.md CHANGELOG.md tests/inspect-project.mjs tests/validate-v15-2-0-desktop-ux.mjs tests/v15-2-1-desktop-ux-quick-wins.spec.mjs
          git commit -m "feat: refine desktop UX quick wins"
          git push origin HEAD:agent/desktop-ux-quick-wins-v15-2-1

name: PR4 Phone Finance CSS Ownership

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.head_ref == 'agent/phone-finance-css-ownership-v15-2-11'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Check out PR4 branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply Phone Finance CSS ownership cleanup
        run: node scripts/agent-pr4-phone-finance-css-ownership.mjs
      - name: Refresh compatibility runtime files
        run: npm run prepare:runtime
      - name: Run source quality
        run: npm run quality
      - name: Run focused Phone Finance ownership browser coverage
        run: npx playwright test tests/browser/phone-finance-css-ownership-v15-2-10.spec.mjs --retries=0
      - name: Run complete browser suite without retries
        run: npx playwright test --retries=0
      - name: Audit production dependencies
        run: npm run audit
      - name: Commit validated PR4 application patch
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Validated PR4 tree already committed."
            exit 0
          fi
          git commit -m "refactor(ui): move phone Finance CSS to static ownership"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

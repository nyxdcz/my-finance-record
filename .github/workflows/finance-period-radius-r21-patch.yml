name: V15.1.0 Finance Period Radius Patch

on:
  push:
    branches:
      - fix/finance-period-radius-v15-1-0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch Finance period corners and PWA delivery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          old_cache = "finance-v15-20260815-toolbar-height-r20"
          new_cache = "finance-v15-20260815-period-radius-r21"
          old_pin = "black-canvas-v15-1-0.css?v=15.1.0-accountborder2"
          new_pin = "black-canvas-v15-1-0.css?v=15.1.0-periodradius1"
          old_pin_regex = r"black-canvas-v15-1-0\.css\?v=15\.1\.0-accountborder2"
          new_pin_regex = r"black-canvas-v15-1-0\.css\?v=15\.1\.0-periodradius1"

          css_path = Path("black-canvas-v15-1-0.css")
          css = css_path.read_text()
          marker = "/* V15.1.0 Finance period corner-radius polish. */"
          block = '''

/* V15.1.0 Finance period corner-radius polish. */
#money .period-card {
  border-radius:9px !important;
  overflow:hidden;
}
#money .period-card .period-header,
#money .period-card .record-row {
  border-radius:9px !important;
  overflow:hidden;
}
'''
          if marker not in css:
              css = css.rstrip() + block
          css_path.write_text(css.rstrip() + "\n")

          for path in [Path("index.html"), Path("sw.js")]:
              text = path.read_text()
              if old_cache not in text:
                  raise SystemExit(f"Missing expected cache token in {path}")
              if old_pin not in text:
                  raise SystemExit(f"Missing expected Black Canvas pin in {path}")
              text = text.replace(old_cache, new_cache).replace(old_pin, new_pin)
              path.write_text(text.rstrip() + "\n")

          version_path = Path("version.json")
          version = json.loads(version_path.read_text())
          if version.get("version") != "15.1.0":
              raise SystemExit("Unexpected semantic version")
          if version.get("schemaVersion") != 12 or version.get("cloudSchemaVersion") != 3:
              raise SystemExit("Schema versions changed unexpectedly")
          version["cacheVersion"] = new_cache
          version["notes"] = (
              "Introduces the Black Canvas UI with a #000000 app background and #173e76 primary color across both appearance modes, "
              "PWA chrome, Liquid Glass controls, Expense Mark paid actions, a pure-white Available money Spend label, softer Available money "
              "account-card outlines, consistent 38px desktop topbar controls using Synced as the height reference, and 9px rounded Finance period "
              "headers and expense rows while preserving 44px mobile touch targets, Finance Schema 12, Cloud Schema V3, records, calculations, and sync behavior."
          )
          version_path.write_text(json.dumps(version, indent=2) + "\n")

          tests_dir = Path("tests")
          for path in tests_dir.glob("*.mjs"):
              text = path.read_text()
              updated = (text
                  .replace(old_cache, new_cache)
                  .replace(old_pin, new_pin)
                  .replace(old_pin_regex, new_pin_regex))
              if updated != text:
                  path.write_text(updated.rstrip() + "\n")

          validator_path = Path("tests/validate-black-canvas-v15-1-0.mjs")
          validator = validator_path.read_text()
          radius_assert = 'assert.match(css,/#money \\.period-card \\{[\\s\\S]*border-radius:9px !important;[\\s\\S]*#money \\.period-card \\.period-header,[\\s\\S]*#money \\.period-card \\.record-row \\{[\\s\\S]*border-radius:9px !important;/);'
          if radius_assert not in validator:
              needle = 'assert.match(css,/\\.button-paid:hover \\{[\\s\\S]*background:var\\(--primary-dark\\) !important;/);'
              if needle not in validator:
                  raise SystemExit("Missing Black Canvas validator insertion point")
              validator = validator.replace(needle, needle + "\n" + radius_assert, 1)
              validator_path.write_text(validator.rstrip() + "\n")

          browser_path = Path("tests/finance-period-radius.spec.mjs")
          browser_path.write_text('''import { test, expect } from "@playwright/test";\n\ntest("V15.1.0 Finance period headers and expense rows use 9px corners", async ({ page }) => {\n  await page.goto("http://127.0.0.1:3000/index.html?page=money", { waitUntil:"networkidle" });\n\n  await page.evaluate(() => {\n    const money = document.getElementById("money");\n    if (!money) throw new Error("Money page fixture missing");\n    const fixture = document.createElement("section");\n    fixture.id = "periodRadiusFixture";\n    fixture.className = "period-card";\n    fixture.innerHTML = `<div class="period-header">Period header</div><div class="record-row">Expense row</div>`;\n    money.appendChild(fixture);\n  });\n\n  const radiusOf = selector => page.locator(selector).evaluate(element => ({\n    topLeft:getComputedStyle(element).borderTopLeftRadius,\n    topRight:getComputedStyle(element).borderTopRightRadius,\n    bottomRight:getComputedStyle(element).borderBottomRightRadius,\n    bottomLeft:getComputedStyle(element).borderBottomLeftRadius\n  }));\n\n  for (const selector of [\n    "#periodRadiusFixture",\n    "#periodRadiusFixture .period-header",\n    "#periodRadiusFixture .record-row"\n  ]) {\n    expect(await radiusOf(selector)).toEqual({\n      topLeft:"9px",\n      topRight:"9px",\n      bottomRight:"9px",\n      bottomLeft:"9px"\n    });\n  }\n});\n''')

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          bullet = "- Rounded Finance period headers and expense rows to 9px so the First half, Second half, Other expenses, and individual expense surfaces match the compact Black Canvas card language."
          if bullet not in changelog:
              heading = "## 15.1.0 · 2026-08-15"
              if heading not in changelog:
                  raise SystemExit("Missing V15.1.0 changelog heading")
              changelog = changelog.replace(heading, heading + "\n" + bullet, 1)
              changelog_path.write_text(changelog.rstrip() + "\n")

          remaining = []
          for path in [Path("index.html"), Path("sw.js"), Path("version.json"), *tests_dir.glob("*.mjs")]:
              text = path.read_text()
              if old_cache in text or old_pin in text or old_pin_regex in text:
                  remaining.append(str(path))
          if remaining:
              raise SystemExit(f"Stale delivery token remains in: {remaining}")
          PY
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run repository quality checks
        run: npm run quality
      - name: Run browser regressions
        run: npm run test:browser
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finance-period-radius-r21-patch.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: round finance period surfaces"
          git push origin HEAD:fix/finance-period-radius-v15-1-0

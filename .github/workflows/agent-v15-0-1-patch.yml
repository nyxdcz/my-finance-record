name: Agent V15.0.1 Release Patch

on:
  push:
    branches:
      - agent/v15-0-1-sidebar-records-header

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply V15.0.1 sidebar and release patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          OLD = "15.0.0"
          NEW = "15.0.1"
          OLD_CACHE = "finance-v15-20260815-liquid-glass-r4"
          NEW_CACHE = "finance-v15-20260815-liquid-glass-r5"

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_required(text, old, new, label, count=None):
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f"Missing expected {label}: {old!r}")
              if count is not None and found != count:
                  raise SystemExit(f"Expected {count} occurrence(s) for {label}, found {found}")
              return text.replace(old, new, count if count is not None else -1)

          # Canonical package/release metadata.
          package = json.loads(read("package.json"))
          package["version"] = NEW
          package["scripts"]["test"] = package["scripts"]["test"].replace("validate-v15-0-0.mjs", "validate-v15-0-1.mjs")
          write("package.json", json.dumps(package, indent=2) + "\n")

          lock = json.loads(read("package-lock.json"))
          lock["version"] = NEW
          lock.setdefault("packages", {}).setdefault("", {})["version"] = NEW
          write("package-lock.json", json.dumps(lock, indent=2) + "\n")

          version = json.loads(read("version.json"))
          version["version"] = NEW
          version["cacheVersion"] = NEW_CACHE
          version["notes"] = "Refines the expanded sidebar header to a clean Records title, preserves the compact Insights/Pin rail behavior, and refreshes V15 PWA delivery without changing finance or cloud schemas."
          write("version.json", json.dumps(version, indent=2) + "\n")

          # App bootstrap release identity + exact sidebar header requested by the user.
          index = read("index.html")
          index = replace_required(index, "<title>My Finance Records · V15.0.0</title>", "<title>My Finance Records · V15.0.1</title>", "browser title", 1)
          index = replace_required(index, 'title="V15.0.0 · Liquid Glass Interface · August 15, 2026">V15.0.0</small>', 'title="V15.0.1 · Liquid Glass Interface · August 15, 2026">V15.0.1</small>', "build badge", 1)
          old_brand = '''      <div class="brand">\n        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 18V9m7 9V5m7 13v-7M3 18h18"/></svg></div>\n        <div>\n          <strong>My Finance Records</strong>\n          <small>Expenses and projects</small>\n        </div>\n      </div>'''
          new_brand = '''      <div class="brand">\n        <strong>Records</strong>\n      </div>'''
          index = replace_required(index, old_brand, new_brand, "expanded sidebar brand", 1)
          index = replace_required(index, 'const APP_VERSION = "15.0.0";', 'const APP_VERSION = "15.0.1";', "index app version", 1)
          index = replace_required(index, 'id="settingsOverviewAppStatus">Version 15.0.0<', 'id="settingsOverviewAppStatus">Version 15.0.1<', "Settings app version", 1)
          index = replace_required(index, '<script src="./sync-config.js"></script>', '<script src="./sync-config.js?v=15.0.1"></script>', "sync config cache pin", 1)
          index = replace_required(index, '<script src="./cloud-sync.js?v=15.0.0"></script>', '<script src="./cloud-sync.js?v=15.0.1"></script>', "cloud sync cache pin", 1)
          history_needle = '    VERSION_HISTORY.unshift({"version":"V15.0.0"'
          history_insert = '    VERSION_HISTORY.unshift({"version":"V15.0.1","title":"Sidebar Header Maintenance","changes":["Simplifies the expanded sidebar header to a larger Records title with no decorative icon or subtitle.","Keeps Overview, Finance, Work, Insights, and Settings aligned in their existing rail positions while preserving collapsed Insights and expanded-only Pin behavior.","Refreshes V15 PWA delivery and release metadata without changing Finance Schema 12, Cloud Schema V3, calculations, records, or sync behavior."]},{"version":"V15.0.0"'
          index = replace_required(index, history_needle, history_insert, "V15.0.1 version history", 1)
          write("index.html", index)

          # Sidebar presentation only; no dashboard/finance layout selectors are changed.
          css_path = Path("dashboard-interactions.css")
          css = css_path.read_text()
          marker = "/* V15.0.1 · expanded sidebar Records header cleanup. */"
          if marker not in css:
              css += '''\n\n/* V15.0.1 · expanded sidebar Records header cleanup. */\n@media(min-width:851px){\n  .sidebar.desktop-open .brand,.sidebar.sidebar-pinned .brand{\n    left:64px!important;\n    right:8px!important;\n    height:42px!important;\n    display:flex!important;\n    align-items:center!important;\n    gap:0!important;\n    padding:0!important;\n  }\n  .sidebar.desktop-open .brand strong,.sidebar.sidebar-pinned .brand strong{\n    font-size:1.08rem!important;\n    line-height:1.1!important;\n    font-weight:850!important;\n    letter-spacing:-.01em;\n  }\n}\n'''
          css_path.write_text(css)

          # Runtime release layer and V15 cache pins.
          sync = read("sync-config.js")
          sync = replace_required(sync, 'const VERSION = "15.0.0";', 'const VERSION = "15.0.1";', "runtime version", 1)
          sync = replace_required(sync, "expense-screenshot-parser.js?v=15.0.0", "expense-screenshot-parser.js?v=15.0.1", "screenshot parser pin", 1)
          sync = replace_required(sync, "expense-screenshot-detect.js?v=15.0.0", "expense-screenshot-detect.js?v=15.0.1", "screenshot detector pin", 1)
          sync = replace_required(sync, "expense-screenshot-ai.js?v=15.0.0", "expense-screenshot-ai.js?v=15.0.1", "screenshot AI pin", 1)
          write("sync-config.js", sync)

          cloud = read("cloud-sync.js")
          cloud = replace_required(cloud, 'const APP_VERSION_FALLBACK = "15.0.0";', 'const APP_VERSION_FALLBACK = "15.0.1";', "cloud fallback version", 1)
          write("cloud-sync.js", cloud)

          worker = read("sw.js")
          worker = replace_required(worker, 'const APP_VERSION = "15.0.0";', 'const APP_VERSION = "15.0.1";', "worker app version", 1)
          worker = replace_required(worker, OLD_CACHE, NEW_CACHE, "worker cache generation")
          worker = replace_required(worker, 'asset("./sync-config.js"),', 'asset("./sync-config.js?v=15.0.1"),', "worker sync config pin", 1)
          worker = replace_required(worker, "liquid-glass-v15.css?v=15.0.0", "liquid-glass-v15.css?v=15.0.1", "worker glass pin", 1)
          worker = replace_required(worker, "cloud-sync.js?v=15.0.0", "cloud-sync.js?v=15.0.1", "worker cloud pin", 1)
          worker = replace_required(worker, "expense-screenshot-parser.js?v=15.0.0", "expense-screenshot-parser.js?v=15.0.1", "worker screenshot parser pin", 1)
          worker = replace_required(worker, "expense-screenshot-detect.js?v=15.0.0", "expense-screenshot-detect.js?v=15.0.1", "worker screenshot detector pin", 1)
          worker = replace_required(worker, "expense-screenshot-ai.js?v=15.0.0", "expense-screenshot-ai.js?v=15.0.1", "worker screenshot AI pin", 1)
          worker = worker.replace("collapsed sidebar Insights/Pin state refresh:", "collapsed sidebar Insights/Pin state refresh · V15.0.1 Records header refresh:", 1)
          write("sw.js", worker)

          # README + changelog remain compact and release-oriented.
          readme = read("README.md")
          readme = replace_required(readme, "# My Finance Records · V15.0.0", "# My Finance Records · V15.0.1", "README heading", 1)
          recent = "## Recent updates\n\n"
          new_bullet = "- **V15.0.1 · Sidebar Header Maintenance** — Simplifies the expanded sidebar to a larger Records title, preserves collapsed Insights/expanded-only Pin behavior, and refreshes PWA cache delivery without changing finance or cloud schemas.\n"
          readme = replace_required(readme, recent, recent + new_bullet, "README recent updates", 1)
          write("README.md", readme)

          changelog = read("CHANGELOG.md")
          section = '''## 15.0.1 · 2026-08-15\n\n### Changed\n- Simplified the expanded desktop sidebar header to a larger **Records** title with no decorative chart icon or subtitle.\n- Preserved Overview, Finance, Work, Insights, and Settings positions, including collapsed Insights visibility and expanded-only Pin/Unpin controls.\n- Rotated the V15 PWA cache and release pins so the maintenance update reaches installed and previously visited clients.\n\n### Preserved\n- Dashboard and bento layouts, Finance Schema 12, Cloud Schema V3, encrypted records, calculations, five-minute sync behavior, and saved navigation preferences remain unchanged.\n\n'''
          if not changelog.startswith("## 15.0.1 · 2026-08-15"):
              changelog = section + changelog
          write("CHANGELOG.md", changelog)

          # Rename the release installer and validator, preserving their behavior.
          old_installer = Path("Install_V15_0_0.command")
          new_installer = Path("Install_V15_0_1.command")
          installer = old_installer.read_text().replace("V15.0.0", "V15.0.1")
          new_installer.write_text(installer)
          old_installer.unlink()

          old_validator = Path("tests/validate-v15-0-0.mjs")
          new_validator = Path("tests/validate-v15-0-1.mjs")
          validator = old_validator.read_text()
          validator = validator.replace("V15.0.0", "V15.0.1").replace("15.0.0", "15.0.1")
          validator = validator.replace(OLD_CACHE, NEW_CACHE)
          validator = validator.replace("Install_V15_0_0.command", "Install_V15_0_1.command")
          anchor = 'assert.match(dashboardInteractions, /sidebar-insights-v14-0-24\\.png/, "Insights must continue using the supplied sidebar icon asset");\n'
          extra = '''assert.match(index, /<div class="brand">\\s*<strong>Records<\\/strong>\\s*<\\/div>/, "expanded sidebar header must contain only the Records title");\nassert.doesNotMatch(index, /Expenses and projects/, "sidebar header subtitle must be removed");\nassert.match(dashboardInteractions, /V15\\.0\\.1 · expanded sidebar Records header cleanup/, "sidebar header maintenance CSS must be present");\nassert.match(dashboardInteractions, /brand strong[\\s\\S]*font-size:1\\.08rem!important/, "expanded Records title must be slightly larger");\n'''
          if anchor not in validator:
              raise SystemExit("Could not locate sidebar validation anchor")
          validator = validator.replace(anchor, anchor + extra, 1)
          new_validator.write_text(validator)
          old_validator.unlink()

          # Update release/cache expectations in focused validators.
          for test_path in [Path("tests/validate-cloud-authority.mjs"), Path("tests/validate-expense-screenshot.mjs")]:
              text = test_path.read_text()
              text = text.replace(OLD_CACHE, NEW_CACHE)
              text = text.replace("v=15.0.0", "v=15.0.1")
              test_path.write_text(text)

          # Update references to renamed V15 files elsewhere, if any.
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path == Path(".github/workflows/agent-v15-0-1-patch.yml"):
                  continue
              if path.suffix.lower() not in {".md", ".yml", ".yaml", ".json", ".mjs", ".js", ".sh", ".command"}:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              updated = text.replace("validate-v15-0-0.mjs", "validate-v15-0-1.mjs").replace("Install_V15_0_0.command", "Install_V15_0_1.command")
              if updated != text:
                  path.write_text(updated)

          # Temporary workflow deletes itself before the release commit.
          Path(".github/workflows/agent-v15-0-1-patch.yml").unlink()
          PY

          git diff --check
          npm ci --ignore-scripts --no-audit --no-fund
          npm run quality

      - name: Commit V15.0.1 patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "release: V15.0.1 sidebar Records header"
          git push origin HEAD:${GITHUB_REF_NAME}

name: Apply Available Money badge patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/account-badge-v15-2-5.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply universal 35px account badges
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          css_path = Path("ui-icon-alignment-v15-0-5.css")
          css = css_path.read_text()
          marker = "/* V15.2.5-r3 · Available Money uses universal 35px scalloped account badges without cropping. */"
          mask = "data:image/png;base64,"
          block = f'''

          {marker}
          html body #money #moneyAccounts .account-card-icon {{
            --available-account-badge-fill:color-mix(in srgb,var(--surface-soft) 82%,var(--primary) 18%);
            box-sizing:border-box !important;
            width:35px !important;
            min-width:35px !important;
            max-width:35px !important;
            height:35px !important;
            min-height:35px !important;
            max-height:35px !important;
            flex:0 0 35px !important;
            padding:0 !important;
            border:0 !important;
            border-radius:0 !important;
            background:var(--available-account-badge-fill) !important;
            display:inline-grid !important;
            place-items:center !important;
            overflow:hidden !important;
            -webkit-mask-image:url("{mask}") !important;
            mask-image:url("{mask}") !important;
            -webkit-mask-repeat:no-repeat !important;
            mask-repeat:no-repeat !important;
            -webkit-mask-position:center !important;
            mask-position:center !important;
            -webkit-mask-size:100% 100% !important;
            mask-size:100% 100% !important;
          }}
          html body #money #moneyAccounts .account-card-icon > img {{
            width:29px !important;
            max-width:29px !important;
            height:29px !important;
            max-height:29px !important;
            object-fit:contain !important;
            object-position:center !important;
            border-radius:0 !important;
          }}

          /* Current uploaded account artwork: extend each logo's own badge color through the outer scallop. */
          html body #money #moneyAccounts .account-card-icon:has(> img[alt="Wallet icon" i]) {{ --available-account-badge-fill:#ffffff; }}
          html body #money #moneyAccounts .account-card-icon:has(> img[alt="UnionBank icon" i]) {{ --available-account-badge-fill:#f58220; }}
          html body #money #moneyAccounts .account-card-icon:has(> img[alt="RCBC icon" i]) {{ --available-account-badge-fill:#4b9bd4; }}
          html body #money #moneyAccounts .account-card-icon:has(> img[alt="Maya icon" i]) {{ --available-account-badge-fill:#101713; }}
          html body #money #moneyAccounts .account-card-icon:has(> img[alt="GCash icon" i]) {{ --available-account-badge-fill:#0b66d6; }}
          html body #money #moneyAccounts .account-card-icon:has(> img[alt="GoTyme icon" i]) {{ --available-account-badge-fill:#16d3cf; }}
          html body #money #moneyAccounts .account-card-icon:has(> img[alt="Metrobank icon" i]) {{ --available-account-badge-fill:#005baa; }}
          '''
          if marker not in css:
              css_path.write_text(css.rstrip() + block + "\n")

          desktop_path = Path("desktop-ux-v15-2-0.css")
          desktop = desktop_path.read_text()
          old_marker = "/* V15.2.5-r2 · Approved scalloped badge shape for current Bank / E-wallet logos. */"
          if old_marker in desktop:
              desktop = desktop.split(old_marker, 1)[0].rstrip() + "\n\n/* V15.2.5-r2 · Account badge delivery moved to the network-first icon alignment layer. */\n"
              desktop_path.write_text(desktop)

          test_path = Path("tests/validate-v15-2-0-desktop-ux.mjs")
          test = test_path.read_text()
          if 'const uiIcons = read("ui-icon-alignment-v15-0-5.css");' not in test:
              test = test.replace('const desktopUx = read("desktop-ux-v15-2-0.css");', 'const desktopUx = read("desktop-ux-v15-2-0.css");\nconst uiIcons = read("ui-icon-alignment-v15-0-5.css");')
          anchor = '  [!desktopUx.includes("margin-right:5px !important"), "Budget disclosure alignment no longer relies on hard-coded margin offsets"],\n'
          checks = '''  [uiIcons.includes("V15.2.5-r3 · Available Money uses universal 35px scalloped account badges without cropping"), "Available Money universal badge layer is present"],
  [uiIcons.includes("#money #moneyAccounts .account-card-icon") && uiIcons.includes("width:35px !important") && uiIcons.includes("height:35px !important"), "Available Money account badges are 35px"],
  [uiIcons.includes("width:29px !important") && uiIcons.includes("object-fit:contain !important") && uiIcons.includes("object-position:center !important"), "Account logos use a centered no-crop safe area"],
  [uiIcons.includes('img[alt="Wallet icon" i]') && uiIcons.includes("--available-account-badge-fill:#ffffff"), "Wallet receives the universal badge treatment"],
  [!desktopUx.includes("object-fit:cover !important"), "Legacy cropped account-logo rule is removed"],
'''
          if "Available Money universal badge layer is present" not in test:
              test = test.replace(anchor, anchor + checks)
          test_path.write_text(test)
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate repository
        run: npm run quality
      - name: Commit badge patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/account-badge-v15-2-5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-icon-alignment-v15-0-5.css desktop-ux-v15-2-0.css tests/validate-v15-2-0-desktop-ux.mjs .github/workflows/account-badge-v15-2-5.yml
          git commit -m "fix: standardize Available Money account badges"
          git push origin HEAD:main
      - name: Run full Quality and GitHub Pages workflow on patched main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run quality-pages.yml --ref main

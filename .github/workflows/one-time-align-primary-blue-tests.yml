name: One-time Align Primary Blue Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  align:
    if: github.head_ref == 'style/talaan-primary-blue' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: style/talaan-primary-blue
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Align browser assertions
        run: node scripts/align-primary-blue-tests.mjs

      - name: Validate repository
        run: npm run quality

      - name: Remove one-time files
        run: |
          rm scripts/align-primary-blue-tests.mjs
          rm .github/workflows/one-time-align-primary-blue-tests.yml

      - name: Commit aligned tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No test changes to commit.'
            exit 0
          fi
          git commit -m 'test: align primary blue browser expectations'
          git push origin HEAD:style/talaan-primary-blue

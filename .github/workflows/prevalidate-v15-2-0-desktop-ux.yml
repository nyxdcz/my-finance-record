name: Prevalidate V15.2.0 Desktop UX

on:
  push:
    branches:
      - fix/v15-2-0-desktop-ux

permissions:
  contents: write

jobs:
  prevalidate:
    if: github.event.head_commit.message == 'chore: add v15.2.0 prevalidation runner'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply V15.2.0 desktop UX patch
        run: python3 scripts/apply-v15-2-0-desktop-ux.py
      - name: Install dependencies
        run: npm ci
      - name: Repository quality
        run: npm run quality
      - name: Production dependency audit
        run: npm run audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser
      - name: Commit validated app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/prevalidate-v15-2-0-desktop-ux.yml' ':!scripts/apply-v15-2-0-desktop-ux.py'
          git diff --cached --quiet && exit 1
          git commit -m "feat: prepare V15.2.0 desktop UX"
          git push origin HEAD:fix/v15-2-0-desktop-ux

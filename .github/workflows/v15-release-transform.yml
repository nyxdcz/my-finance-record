name: V15 release transform

on:
  push:
    branches:
      - agent/v15-0-0-liquid-glass

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out V15 branch
        uses: actions/checkout@v7
        with:
          ref: agent/v15-0-0-liquid-glass
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply exact V15 release replacements
        run: node scripts/apply-v15-release.mjs
      - name: Commit transformed release files
        shell: bash
        run: |
          set -euo pipefail
          chmod +x Install_V15_0_0.command
          if git diff --quiet -- index.html cloud-sync.js CHANGELOG.md Install_V15_0_0.command; then
            echo "V15 release files are already transformed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cloud-sync.js CHANGELOG.md Install_V15_0_0.command
          git commit -m "chore: complete v15.0.0 release conversion"
          git push origin HEAD:agent/v15-0-0-liquid-glass

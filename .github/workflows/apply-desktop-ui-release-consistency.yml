name: Apply desktop UI release consistency

on:
  push:
    branches: [fix/desktop-ui-phase1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/desktop-ui-phase1
      - name: Align cache, deploy packaging, and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          old_cache = "finance-v15-20260815-desktop-consistency-r27"
          new_cache = "finance-v15-20260815-desktop-ui-phase1-r28"

          # Update every validation/source reference that pins the previous cache.
          targets = [Path("sw.js"), Path("version.json")]
          targets += list(Path("tests").glob("*.mjs"))
          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text()
              if old_cache in text:
                  path.write_text(text.replace(old_cache, new_cache))

          # Precache the new desktop-only stylesheet.
          sw = Path("sw.js")
          text = sw.read_text()
          asset = '  asset("./desktop-ui-phase1-v15-1-0.css?v=15.1.0-phase1"),\n'
          anchor = '  asset("./black-canvas-v15-1-0.css?v=15.1.0-light1"),\n'
          if asset not in text:
              if anchor not in text:
                  raise SystemExit("sw.js black-canvas asset anchor not found")
              text = text.replace(anchor, anchor + asset, 1)
          text = text.replace(
              "// V15.0.4 UI alignment delivery refresh · forces installed PWAs to fetch the cascade-safe icon alignment rules while preserving finance and sync behavior.",
              "// V15.1.0 desktop UI phase 1 delivery refresh · ships the desktop-only hierarchy layer without changing finance, sync, or phone behavior."
          )
          sw.write_text(text)

          # Refresh public release metadata without changing semantic version/schema versions.
          version_path = Path("version.json")
          version = json.loads(version_path.read_text())
          version["cacheVersion"] = new_cache
          version["notes"] = "Desktop UI Phase 1: clearer header/workspace hierarchy, compact Income KPIs, calmer Dashboard and Finance surfaces, consolidated Report exports, simplified Calendar status color, contextual Paid Expenses guidance, progressive disclosure for advanced cloud connection fields, consistent desktop controls/statuses/modals/empty states/toasts, and ultra-wide Settings constraints. Phone layout, Finance Schema 12, Cloud Schema V3, records, calculations, and sync behavior remain unchanged."
          version_path.write_text(json.dumps(version, indent=2, ensure_ascii=False) + "\n")

          # Package the stylesheet in GitHub Pages and assert it exists in the staged site.
          workflow = Path(".github/workflows/quality-pages.yml")
          text = workflow.read_text()
          if " desktop-ui-phase1-v15-1-0.css " not in text:
              text = text.replace(
                  "ui-icon-alignment-v15-0-5.css black-canvas-v15-1-0.css pwa-update-v15-0-5.js",
                  "ui-icon-alignment-v15-0-5.css black-canvas-v15-1-0.css desktop-ui-phase1-v15-1-0.css pwa-update-v15-0-5.js",
                  1
              )
          test_anchor = "          test -f _site/black-canvas-v15-1-0.css\n"
          test_line = "          test -f _site/desktop-ui-phase1-v15-1-0.css\n"
          if test_line not in text:
              if test_anchor not in text:
                  raise SystemExit("quality-pages stylesheet test anchor not found")
              text = text.replace(test_anchor, test_anchor + test_line, 1)
          workflow.write_text(text)

          # Make the new source contract part of npm test.
          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          static_test = "node tests/validate-desktop-ui-phase1-v15-1-0.mjs"
          current = package["scripts"]["test"]
          if static_test not in current:
              package["scripts"]["test"] = current.replace(
                  "node tests/validate-finance-marquee-source-v15-1-0.mjs",
                  "node tests/validate-finance-marquee-source-v15-1-0.mjs && " + static_test,
                  1
              )
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          # Include the final production cascade in the existing five-width browser fixture.
          desktop_spec = Path("tests/desktop-ui-consistency.spec.mjs")
          text = desktop_spec.read_text()
          css_entry = '  "desktop-ui-phase1-v15-1-0.css?v=15.1.0-phase1"\n'
          if "desktop-ui-phase1-v15-1-0.css" not in text:
              anchor = '  "black-canvas-v15-1-0.css?v=15.1.0-light1"\n'
              if anchor not in text:
                  raise SystemExit("desktop consistency CSS anchor not found")
              text = text.replace(anchor, '  "black-canvas-v15-1-0.css?v=15.1.0-light1",\n' + css_entry, 1)
          desktop_spec.write_text(text)

          # Make repository inspection explicitly aware of the new production layer.
          inspect = Path("tests/inspect-project.mjs")
          text = inspect.read_text()
          if '"desktop-ui-phase1-v15-1-0.css"' not in text:
              text = text.replace(
                  '"ui-icon-alignment-v15-0-5.css", "black-canvas-v15-1-0.css", "pwa-update-v15-0-5.js"',
                  '"ui-icon-alignment-v15-0-5.css", "black-canvas-v15-1-0.css", "desktop-ui-phase1-v15-1-0.css", "pwa-update-v15-0-5.js"',
                  1
              )
          deploy_anchor = 'if (!deploySources.has("black-canvas-v15-1-0.css")) fail("GitHub Pages must package black-canvas-v15-1-0.css");\n'
          deploy_line = 'if (!deploySources.has("desktop-ui-phase1-v15-1-0.css")) fail("GitHub Pages must package desktop-ui-phase1-v15-1-0.css");\n'
          if deploy_line not in text:
              if deploy_anchor not in text:
                  raise SystemExit("inspect deploy assertion anchor not found")
              text = text.replace(deploy_anchor, deploy_anchor + deploy_line, 1)
          inspect.write_text(text)

          # Document the same-version UI delivery in the current changelog entry.
          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          bullet = "- Desktop UI Phase 1: simplified desktop hierarchy, report export menu, compact Income summary, calmer Calendar/Settings/status surfaces, and r28 PWA delivery while leaving phone layout and finance/sync behavior unchanged.\n"
          if bullet not in text:
              header = "## 15.1.0 · 2026-08-15\n"
              if header not in text:
                  raise SystemExit("15.1.0 changelog header not found")
              text = text.replace(header, header + bullet, 1)
          changelog.write_text(text)
          PY
      - name: Commit consistency updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No release consistency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js version.json package.json CHANGELOG.md .github/workflows/quality-pages.yml tests
          git commit -m "test: align desktop UI phase 1 delivery"
          git push origin HEAD:fix/desktop-ui-phase1

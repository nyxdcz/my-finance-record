name: V15.1.0 Available Money Border Opacity Patch

on:
  push:
    branches:
      - fix/available-money-border-opacity-v15-1-0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v7
        with:
          ref: fix/available-money-border-opacity-v15-1-0
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply account-border opacity patch
        run: python .github/patch-available-money-border-opacity-v15-1-0.py
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository quality
        run: npm run quality
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regressions
        run: npm run test:browser
      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf test-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add black-canvas-v15-1-0.css index.html sw.js version.json tests
          git diff --cached --check
          git commit -m "style: soften Available money account borders further"
          git push origin HEAD:fix/available-money-border-opacity-v15-1-0

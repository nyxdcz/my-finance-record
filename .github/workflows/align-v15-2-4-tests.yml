name: Align V15.2.4 tests

on:
  push:
    branches: [release/v15-2-4]

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v15-2-4
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/align-v15-2-4-tests.mjs
      - name: Commit aligned tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/inspect-project.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: align release inspection with V15.2.4"
          git push origin HEAD:release/v15-2-4

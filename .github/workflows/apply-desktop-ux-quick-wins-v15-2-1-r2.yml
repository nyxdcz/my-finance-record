name: Apply desktop UX quick wins V15.2.1 r2

on:
  push:
    branches:
      - agent/desktop-ux-quick-wins-v15-2-1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-ux-quick-wins-v15-2-1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reuse approved source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/apply-desktop-ux-quick-wins-v15-2-1.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, 'approved-desktop-ux-patch.py', 'exec'), {})
          PY

      - name: Align package release metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for filename in ('package.json', 'package-lock.json'):
              path = Path(filename)
              data = json.loads(path.read_text(encoding='utf-8'))
              data['version'] = '15.2.1'
              if filename == 'package-lock.json':
                  data['packages']['']['version'] = '15.2.1'
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Quality
        run: npm run quality

      - name: Dependency audit
        run: npm run audit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser regression suite
        run: npm run test:browser

      - name: Diff safety checks
        shell: bash
        run: |
          git diff --check
          if git diff --name-only | grep -q '^mobile-v14-0-23.css$'; then
            echo 'Mobile stylesheet must remain unchanged in this desktop pass.' >&2
            exit 1
          fi
          git diff --name-only

      - name: Package validated patch
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ux-quick-wins-v15-2-1-r2
          path: |
            index.html
            projects-calendar-v13.0.20.js
            budget-planning.js
            desktop-ux-v15-2-0.css
            cloud-sync.js
            sw.js
            version.json
            package.json
            package-lock.json
            README.md
            CHANGELOG.md
            tests/v15-2-1-desktop-ux-quick-wins.spec.mjs

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects-calendar-v13.0.20.js budget-planning.js desktop-ux-v15-2-0.css cloud-sync.js sw.js version.json package.json package-lock.json README.md CHANGELOG.md tests/v15-2-1-desktop-ux-quick-wins.spec.mjs
          git commit -m "feat: refine desktop UX quick wins"
          git push origin HEAD:agent/desktop-ux-quick-wins-v15-2-1

name: Finalize desktop UI consistency

on:
  push:
    branches:
      - agent/desktop-ui-consistency-v15-1-0
    paths:
      - .github/workflows/finalize-desktop-ui-consistency.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/desktop-ui-consistency-v15-1-0
          fetch-depth: 0
      - name: Align with established compact desktop contract
        run: |
          python - <<'PY'
          from pathlib import Path

          def exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {found}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          app = Path('app.css')
          text = app.read_text()
          replacements = [
              ('      --radius: 12px;', '      --radius: 9px;'),
              ('      --desktop-card-padding: 16px;', '      --desktop-card-padding: 13px;'),
              ('      --desktop-compact-card-padding: 12px;', '      --desktop-compact-card-padding: 11px;'),
              ('      --desktop-inner-radius: 8px;', '      --desktop-inner-radius: 7px;'),
              ('      --desktop-control-height: 40px;', '      --desktop-control-height: 38px;'),
              ('      --desktop-control-compact-height: 34px;', '      --desktop-control-compact-height: 35px;'),
              ('      --desktop-section-gap: 16px;', '      --desktop-section-gap: 10px;'),
              ('    .content { padding: 20px var(--desktop-page-gutter) 42px; }', '    .content { padding: 18px var(--desktop-page-gutter) 34px; }'),
              ('    .page-heading h2 { margin: 0 0 4px; font-size: 1.28rem; letter-spacing: -0.03em; }', '    .page-heading h2 { margin: 0 0 4px; font-size: 1.34rem; letter-spacing: -0.03em; }'),
              ('    .content { padding:18px 22px 34px; }', '    .content { padding:18px var(--desktop-page-gutter) 34px; }')
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"app.css replacement mismatch for {old!r}: {text.count(old)}")
              text = text.replace(old, new)
          app.write_text(text)

          exact('budget-planning.css',
                '.budget-panel-collapse { width:32px; min-width:32px; height:32px; min-height:32px; border-radius:8px; }',
                '.budget-panel-collapse { width:40px; min-width:40px; height:40px; min-height:40px; border-radius:7px; }')

          dash = Path('dashboard-interactions.css')
          text = dash.read_text()
          old_block = '''#customizeDashboardButton[data-dashboard-toolbar-action]{\n  width:32px!important;\n  min-width:32px!important;\n  max-width:32px!important;\n  height:32px!important;\n  min-height:32px!important;\n  max-height:32px!important;\n  flex:0 0 32px!important;'''
          new_block = '''#customizeDashboardButton[data-dashboard-toolbar-action]{\n  width:38px!important;\n  min-width:38px!important;\n  max-width:38px!important;\n  height:38px!important;\n  min-height:38px!important;\n  max-height:38px!important;\n  flex:0 0 38px!important;'''
          if text.count(old_block) != 1:
              raise SystemExit(f"Customize compact block mismatch: {text.count(old_block)}")
          text = text.replace(old_block, new_block)
          text = text.replace('border-radius:8px;background:var(--surface);overflow:hidden}', 'border-radius:7px;background:var(--surface);overflow:hidden}', 1)
          old_glass = '''.workspace-switcher,\n.dashboard-week-marquee{\n  border-color:var(--line);\n  border-radius:8px;'''
          new_glass = '''.workspace-switcher,\n.dashboard-week-marquee{\n  border-color:var(--line);\n  border-radius:7px;'''
          if text.count(old_glass) != 1:
              raise SystemExit(f"Workspace glass radius block mismatch: {text.count(old_glass)}")
          text = text.replace(old_glass, new_glass)
          dash.write_text(text)

          # Migrate all remaining changed-asset pins and obsolete cache references in tests.
          test_replacements = {
              'black-canvas-v15-1-0.css?v=15.1.0-periodradius1':'black-canvas-v15-1-0.css?v=15.1.0-desktop2',
              'finance-v15-20260815-finance-marquee-r24':'finance-v15-20260815-desktop-ui-r25'
          }
          for p in Path('tests').rglob('*'):
              if not p.is_file() or p.suffix not in {'.mjs','.js','.json','.html','.css'}:
                  continue
              data = p.read_text()
              new = data
              for old, replacement in test_replacements.items():
                  new = new.replace(old, replacement)
              if new != data:
                  p.write_text(new)
          PY
      - name: Validate source contract
        run: |
          git diff --check
          grep -q -- '--desktop-page-gutter: 24px' app.css
          grep -q -- 'padding:18px var(--desktop-page-gutter) 34px' app.css
          grep -q -- 'width:38px!important' dashboard-interactions.css
          grep -q -- 'border-radius:7px' dashboard-interactions.css
          grep -q -- 'const APP_CACHE_VERSION = "finance-v15-20260815-desktop-ui-r25";' index.html
          grep -q -- 'const CACHE_VERSION = "finance-v15-20260815-desktop-ui-r25";' sw.js
          ! grep -R 'finance-v15-20260815-finance-marquee-r24' tests sw.js version.json index.html
          ! grep -R 'black-canvas-v15-1-0.css?v=15.1.0-periodradius1' tests index.html sw.js
      - name: Remove one-time workflow
        run: rm .github/workflows/finalize-desktop-ui-consistency.yml
      - name: Commit final source contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: align compact desktop contract"
          git push origin HEAD:agent/desktop-ui-consistency-v15-1-0

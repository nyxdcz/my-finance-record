name: V15.1.0 Black Canvas Patch

on:
  push:
    branches:
      - feat/v15-1-0-black-canvas

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v7
        with:
          ref: feat/v15-1-0-black-canvas
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply V15.1.0 patch
        run: |
          python .github/patch-v15-1-0-black-canvas.py
          chmod +x Install_V15_1_0.command
          python - <<'PY'
          from pathlib import Path
          for filename in ["index.html", "sw.js"]:
              path = Path(filename)
              text = path.read_text()
              text = text.replace("ui-icon-alignment-v15-0-5.css?v=15.0.5-ui2", "ui-icon-alignment-v15-0-5.css?v=15.1.0-ui2")
              text = text.replace("privacy-lock.js?v=15.0.5-ui1", "privacy-lock.js?v=15.1.0-ui1")
              path.write_text(text)
          spec = "\n".join([
              'import { test, expect } from "@playwright/test";',
              'for (const theme of ["light","dark"]) {',
              '  test(`V15.1.0 Black Canvas uses exact palette in ${theme} appearance`, async ({ browser }) => {',
              '    const context = await browser.newContext({ javaScriptEnabled:false });',
              '    const page = await context.newPage();',
              '    await page.goto("http://127.0.0.1:3000/index.html?page=settings", { waitUntil:"networkidle" });',
              '    await page.locator("html").evaluate((element, value) => { element.dataset.theme = value; }, theme);',
              '    const result = await page.evaluate(() => {',
              '      const root = getComputedStyle(document.documentElement);',
              '      const body = getComputedStyle(document.body);',
              '      return { bg:root.getPropertyValue("--bg").trim(), primary:root.getPropertyValue("--primary").trim(), bodyBg:body.backgroundColor };',
              '    });',
              '    expect(result.bg).toBe("#000000");',
              '    expect(result.primary).toBe("#173e76");',
              '    expect(result.bodyBg).toBe("rgb(0, 0, 0)");',
              '    await context.close();',
              '  });',
              '}',
              ''
          ])
          Path("tests/black-canvas-v15-1-0.spec.mjs").write_text(spec)
          PY
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository quality
        run: npm run quality
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regressions
        run: npm run test:browser
      - name: Commit validated release and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf test-results playwright-report
          rm -f .github/patch-v15-1-0-black-canvas.py .github/workflows/v15-1-0-black-canvas-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: release V15.1.0 Black Canvas UI"
          git push origin HEAD:feat/v15-1-0-black-canvas

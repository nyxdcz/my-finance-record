name: Prevalidate Light mode r26 v4

on:
  push:
    branches:
      - fix/light-mode-chrome-r26
    paths:
      - .github/workflows/prevalidate-light-mode-r26-v4.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/light-mode-chrome-r26
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply base r26 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          workflow=Path('.github/workflows/patch-light-mode-chrome-r26.yml').read_text()
          start_marker="          python3 - <<'PY'\n"
          start=workflow.index(start_marker)+len(start_marker)
          end=workflow.index("\n          PY",start)
          script=dedent(workflow[start:end])
          exec(compile(script,'light-mode-r26-patch.py','exec'))
          PY
      - name: Normalize all active delivery assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          OLD_CACHE='finance-v15-20260815-desktop-ui-r25'
          NEW_CACHE='finance-v15-20260815-light-chrome-r26'
          for p in Path('tests').rglob('*'):
            if not p.is_file(): continue
            try: text=p.read_text()
            except UnicodeDecodeError: continue
            text=text.replace(OLD_CACHE,NEW_CACHE)
            text=text.replace('monthnav1','light1')
            text=text.replace(r'black-canvas-v15-1-0\.css\?v=15\.1\.0-desktop2',r'black-canvas-v15-1-0\.css\?v=15\.1\.0-light1')
            text=text.replace(r'sync-config\.js\?v=15\.1\.0-desktop1',r'sync-config\.js\?v=15\.1\.0-light1')
            p.write_text(text)
          for p in Path('tests').rglob('*'):
            if not p.is_file(): continue
            try: text=p.read_text()
            except UnicodeDecodeError: continue
            if OLD_CACHE in text or 'monthnav1' in text:
              raise SystemExit(f'stale r25/monthnav token remains in {p}')
          PY
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repository quality
        run: npm run quality
      - name: Production audit
        run: npm run audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser suite
        run: npm run test:browser
      - name: Commit validated application and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js sync-config.js version.json black-canvas-v15-1-0.css liquid-glass-v15.css tests
          git diff --cached --check
          git commit -m "fix: correct Light mode chrome contrast"
          git push origin HEAD:fix/light-mode-chrome-r26

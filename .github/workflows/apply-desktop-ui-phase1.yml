name: Apply desktop UI phase 1

on:
  push:
    branches: [fix/desktop-ui-phase1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/desktop-ui-phase1
      - name: Apply source-level desktop markup changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          def replace_exact(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_exact(
              '  <link rel="stylesheet" href="./black-canvas-v15-1-0.css?v=15.1.0-light1">\n  <script src="./pwa-update-v15-0-5.js?v=15.1.0"></script>',
              '  <link rel="stylesheet" href="./black-canvas-v15-1-0.css?v=15.1.0-light1">\n  <link rel="stylesheet" href="./desktop-ui-phase1-v15-1-0.css?v=15.1.0-phase1">\n  <script src="./pwa-update-v15-0-5.js?v=15.1.0"></script>',
              'desktop stylesheet link'
          )

          replace_exact(
              '<span class="settings-status-copy"><span>App &amp; About</span><strong id="settingsOverviewAppStatus">Version 15.0.3</strong><small id="settingsOverviewAppText">Installation, notifications, and app information.</small></span>',
              '<span class="settings-status-copy"><span>App &amp; About</span><strong id="settingsOverviewAppStatus">Version 15.1.0</strong><small id="settingsOverviewAppText">Installation, notifications, and app information.</small></span>',
              'settings version status'
          )

          replace_exact(
              '<div>\n              <h2 id="paid-expenses-title">Paid expenses</h2>\n              <p>Expenses marked as paid are moved here. Marking an item paid does not change the account balance automatically.</p>\n            </div>',
              '<div>\n              <h2 id="paid-expenses-title">Paid expenses</h2>\n              <p>Review expenses already marked as paid.</p>\n            </div>',
              'paid expenses heading copy'
          )

          replace_exact(
              '          <article class="card collapsible-section" id="paidExpensesSection" data-collapse-key="paid-expenses" style="margin-top:16px">',
              '          <p class="paid-expenses-info-note">Marking an item paid moves it to this list; it does not automatically change the account balance.</p>\n\n          <article class="card collapsible-section" id="paidExpensesSection" data-collapse-key="paid-expenses" style="margin-top:10px">',
              'paid expenses contextual note'
          )

          old_export = '''            <div class="toolbar" style="margin-bottom:0">
              <button class="button button-primary" type="button" onclick="window.print()">Print / Save PDF</button>
              <button class="button button-secondary" id="exportMonthlyReportCsv">Export report CSV</button>
              <button class="button button-secondary" id="exportMonthlyReportJson">Export report JSON</button>
              <button class="button button-secondary" id="exportIncomeReportCsv">Export income CSV</button><button class="button button-secondary" id="exportExpensesCsv">Export all expenses CSV</button>
              <button class="button button-secondary" id="exportProjectsCsv">Export all projects CSV</button>
            </div>'''
          new_export = '''            <div class="toolbar report-export-actions" style="margin-bottom:0">
              <button class="button button-primary" type="button" onclick="window.print()">Print / Save PDF</button>
              <div class="overflow-menu report-export-menu">
                <button class="button button-secondary overflow-menu-trigger" type="button" aria-haspopup="menu" aria-controls="reportExportMenuPanel" aria-expanded="false">Export <span aria-hidden="true">▾</span></button>
                <div class="record-more-panel report-export-menu-panel" id="reportExportMenuPanel" role="menu" aria-label="Export report" hidden>
                  <button id="exportMonthlyReportCsv" type="button" role="menuitem">Monthly report CSV</button>
                  <button id="exportMonthlyReportJson" type="button" role="menuitem">Monthly report JSON</button>
                  <button id="exportIncomeReportCsv" type="button" role="menuitem">Income CSV</button>
                  <button id="exportExpensesCsv" type="button" role="menuitem">All expenses CSV</button>
                  <button id="exportProjectsCsv" type="button" role="menuitem">All projects CSV</button>
                </div>
              </div>
            </div>'''
          replace_exact(old_export, new_export, 'report export actions')

          config_start = '              <article class="card cloud-config-card" id="cloudConfigCard">'
          next_card = '              <article class="card" id="cloudDisconnectedSection" hidden>'
          start = text.find(config_start)
          end = text.find(next_card, start)
          if start < 0 or end < 0:
              raise SystemExit('advanced cloud connection block markers not found')
          block = text[start:end]
          grid_marker = '                <div class="cloud-config-grid">'
          if block.count(grid_marker) != 1:
              raise SystemExit(f'cloud config grid: expected 1 match, found {block.count(grid_marker)}')
          block = block.replace(
              grid_marker,
              '                <details class="advanced-settings-disclosure">\n                  <summary><span>Connection details</span><small>Supabase URL and publishable key</small></summary>\n                  <div class="advanced-settings-content">\n' + grid_marker,
              1
          )
          closing = '                <p class="v12-help">A hosted `sync-config.js` can configure both devices automatically. Secret and service-role keys are rejected and must never be placed in this PWA.</p>\n              </article>\n\n'
          if block.count(closing) != 1:
              raise SystemExit(f'cloud config closing: expected 1 match, found {block.count(closing)}')
          block = block.replace(
              closing,
              '                <p class="v12-help">A hosted `sync-config.js` can configure both devices automatically. Secret and service-role keys are rejected and must never be placed in this PWA.</p>\n                  </div>\n                </details>\n              </article>\n\n',
              1
          )
          text = text[:start] + block + text[end:]

          path.write_text(text)
          PY
      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: apply desktop UI phase 1 markup"
          git push origin HEAD:fix/desktop-ui-phase1

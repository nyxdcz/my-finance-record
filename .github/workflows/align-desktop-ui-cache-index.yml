name: Align desktop UI cache in index

on:
  push:
    branches: [fix/desktop-ui-phase1]

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/desktop-ui-phase1
      - name: Align page bootstrap cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = 'finance-v15-20260815-desktop-consistency-r27'
          new = 'finance-v15-20260815-desktop-ui-phase1-r28'
          count = text.count(old)
          if count < 1:
              raise SystemExit('Old r27 cache constant not found in index.html')
          path.write_text(text.replace(old, new))
          print(f'Updated {count} index cache reference(s)')
          PY
      - name: Commit aligned cache
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: align desktop UI page cache"
          git push origin HEAD:fix/desktop-ui-phase1

name: Apply desktop UX quick wins V15.2.1 r7

on:
  push:
    branches:
      - agent/desktop-ux-quick-wins-v15-2-1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-ux-quick-wins-v15-2-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reuse approved validated patch stages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          def execute_step(workflow_path, section_label=None):
              workflow = Path(workflow_path).read_text(encoding='utf-8')
              if section_label: workflow = workflow[workflow.index(section_label):]
              marker = "          python3 - <<'PY'\n"
              start = workflow.index(marker) + len(marker)
              end = workflow.index("\n          PY\n", start)
              exec(compile(textwrap.dedent(workflow[start:end]), workflow_path, 'exec'), {})
          execute_step('.github/workflows/apply-desktop-ux-quick-wins-v15-2-1.yml')
          execute_step('.github/workflows/apply-desktop-ux-quick-wins-v15-2-1-r3.yml', '- name: Align V15.2.1 release metadata and validators')
          execute_step('.github/workflows/apply-desktop-ux-quick-wins-v15-2-1-r4.yml', '- name: Extract new interaction helpers from index')
          execute_step('.github/workflows/apply-desktop-ux-quick-wins-v15-2-1-r5.yml', '- name: Finish cohesive interaction extraction')
          execute_step('.github/workflows/apply-desktop-ux-quick-wins-v15-2-1-r6.yml', '- name: Align current-shell regression expectations')
          PY

      - name: Align Settings version label regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/validate-desktop-ui-phase1-v15-1-0.mjs')
          text = path.read_text(encoding='utf-8')
          old = 'id="settingsOverviewAppStatus">Version 15.2.0</strong>'
          new = 'id="settingsOverviewAppStatus">Version 15.2.1</strong>'
          if old not in text:
              raise SystemExit('Expected stale Settings version assertion was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci
      - name: Quality
        run: npm run quality
      - name: Dependency audit
        run: npm run audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression suite
        run: npm run test:browser
      - name: Diff safety checks
        shell: bash
        run: |
          git diff --check
          if git diff --name-only | grep -q '^mobile-v14-0-23.css$'; then echo 'Mobile stylesheet changed.' >&2; exit 1; fi
          if git diff --name-only | grep -E '^(account-ledger|cloud-conflict|cloud-sync-lifecycle|privacy-lock|mobile-v14-0-23)'; then echo 'Unexpected finance/sync/mobile implementation file changed.' >&2; exit 1; fi
          git diff --name-only
      - name: Package validated patch
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ux-quick-wins-v15-2-1-r7
          path: |
            index.html
            interaction-patterns.js
            projects-calendar-v13.0.20.js
            budget-planning.js
            desktop-ux-v15-2-0.css
            cloud-sync.js
            sync-config.js
            sw.js
            version.json
            package.json
            package-lock.json
            Install_V15_2_0.command
            README.md
            CHANGELOG.md
            tests/*.mjs
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html interaction-patterns.js projects-calendar-v13.0.20.js budget-planning.js desktop-ux-v15-2-0.css cloud-sync.js sync-config.js sw.js version.json package.json package-lock.json Install_V15_2_0.command README.md CHANGELOG.md tests/*.mjs
          git commit -m "feat: refine desktop UX quick wins"
          git push origin HEAD:agent/desktop-ux-quick-wins-v15-2-1

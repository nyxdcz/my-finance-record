name: Apply desktop UI consistency patch

on:
  push:
    branches:
      - agent/desktop-ui-consistency-v15-1-0
    paths:
      - .github/workflows/desktop-ui-consistency-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/desktop-ui-consistency-v15-1-0
          fetch-depth: 0
      - name: Tighten one-time patch selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/patch-desktop-ui-consistency.mjs")
          text = p.read_text()
          replacements = {
              'replaceRegex(app, /(\\.topbar\\s*\\{[\\s\\S]*?min-height:\\s*)72px;/, "$1var(--desktop-header-height);");': 'replaceRegex(app, /(^    \\.topbar\\s*\\{[^}]*?min-height:\\s*)72px;/m, "$1var(--desktop-header-height);");',
              'replaceRegex(app, /(\\.button\\s*\\{[\\s\\S]*?min-height:\\s*)40px;/, "$1var(--desktop-control-height);");': 'replaceRegex(app, /(^    \\.button\\s*\\{[^}]*?min-height:\\s*)40px;/m, "$1var(--desktop-control-height);");',
              'replaceRegex(app, /(\\.card\\s*\\{[\\s\\S]*?padding:\\s*)18px;/, "$1var(--desktop-card-padding);");': 'replaceRegex(app, /(^    \\.card\\s*\\{[^}]*?padding:\\s*)18px;/m, "$1var(--desktop-card-padding);");',
              'replaceRegex(app, /(\\.dashboard-customize-toolbar\\s*\\{[\\s\\S]*?top:)68px;/, "$1var(--desktop-header-height);");': 'replaceRegex(app, /(^    \\.dashboard-customize-toolbar\\s*\\{[^}]*?top:)68px;/m, "$1var(--desktop-header-height);");',
              'replaceRegex(interactions, /#customizeDashboardButton\\[data-dashboard-toolbar-action\\]\\{[\\s\\S]*?\\n\\}/, block => {': 'replaceRegex(interactions, /(^#customizeDashboardButton\\[data-dashboard-toolbar-action\\]\\{(?=[^}]*38px)[^}]*\\})/m, block => {'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"patch selector source not found: {old[:90]}")
              text = text.replace(old, new)
          p.write_text(text)
          PY
      - name: Apply validated desktop patch
        run: node scripts/patch-desktop-ui-consistency.mjs
      - name: Verify scoped source changes
        run: |
          git diff --check
          test -f tests/desktop-ui-consistency.spec.mjs
          ! grep -R "finance-v15-20260815-finance-marquee-r24" tests sw.js version.json
          grep -q -- "--bg:#efefef" black-canvas-v15-1-0.css
          grep -q -- "--desktop-header-height: 72px" app.css
      - name: Remove one-time patch machinery
        run: |
          rm scripts/patch-desktop-ui-consistency.mjs
          rm .github/workflows/desktop-ui-consistency-patch.yml
      - name: Commit desktop consistency changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: unify desktop UI consistency"
          git push origin HEAD:agent/desktop-ui-consistency-v15-1-0

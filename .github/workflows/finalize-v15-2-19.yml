name: Finalize V15.2.19

on:
  push:
    branches: [main]
    paths:
      - '.release-trigger-v15-2-19'

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare runtime compatibility input
        run: cp assets/js/pwa-update-v15-0-5.js pwa-update-v15-0-5.js

      - name: Apply approved V15.2.19 release
        run: python scripts/finalize-v15-2-19.py

      - name: Remove generated runtime compatibility copies
        run: rm -f pwa-update-v15-0-5.js brand-icons-v15-2-18.js production-ui-audit-v15-2-13.css

      - name: Verify generated diff
        run: git diff --check

      - name: Commit V15.2.19 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .release-trigger-v15-2-19 .github/workflows/finalize-v15-2-19.yml scripts/finalize-v15-2-19.py
          git add -A
          git commit -m "release: V15.2.19 compact expense cards"
          git push origin HEAD:main

      - name: Run normal Quality and GitHub Pages workflow on release commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/quality-pages.yml/dispatches \
            -d '{"ref":"main"}'

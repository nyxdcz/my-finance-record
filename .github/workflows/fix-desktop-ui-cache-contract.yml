name: Align desktop UI cache contract

on:
  push:
    branches:
      - agent/desktop-ui-consistency-v15-1-0
    paths:
      - .github/workflows/fix-desktop-ui-cache-contract.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/desktop-ui-consistency-v15-1-0
          fetch-depth: 0
      - name: Align index cache with release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'const APP_CACHE_VERSION = "finance-v15-20260815-finance-marquee-r24";'
          new = 'const APP_CACHE_VERSION = "finance-v15-20260815-desktop-ui-r25";'
          p = Path('index.html')
          text = p.read_text()
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one old APP_CACHE_VERSION, found {count}')
          p.write_text(text.replace(old, new))
          if new not in p.read_text():
              raise SystemExit('new APP_CACHE_VERSION missing from index.html')
          if 'const CACHE_VERSION = "finance-v15-20260815-desktop-ui-r25";' not in Path('sw.js').read_text():
              raise SystemExit('service worker cache does not match r25')
          if '"cacheVersion": "finance-v15-20260815-desktop-ui-r25"' not in Path('version.json').read_text():
              raise SystemExit('version.json cache does not match r25')
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-desktop-ui-cache-contract.yml
      - name: Commit cache contract fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align desktop UI cache contract"
          git push origin HEAD:agent/desktop-ui-consistency-v15-1-0

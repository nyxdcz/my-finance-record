name: Phase 5A approved runtime cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/phase5a-approved.py
      - .github/workflows/phase5a-approved.yml

permissions:
  contents: write

concurrency:
  group: phase5a-approved-main
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply approved Phase 5A cleanup
        run: python3 .github/phase5a-approved.py
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run full source quality gate
        run: npm run quality
      - name: Install focused browser runtime
        run: npx playwright install --with-deps chromium
      - name: Run focused compatibility and money-integrity browser gate
        run: >-
          npx playwright test
          tests/browser/browser-tab-brand.spec.mjs
          tests/browser/account-submit-compat.spec.mjs
          tests/browser/account-balance-persistence.spec.mjs
          tests/browser/compact-finance-toolbar.spec.mjs
          tests/browser/money-mutation-integrity.spec.mjs
          tests/browser/finance-integrity-recovery.spec.mjs
          --workers=1
      - name: Remove temporary Phase 5A helpers
        run: git rm .github/phase5a-approved.py .github/workflows/phase5a-approved.yml
      - name: Validate final diff
        run: |
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "Phase 5A produced no final changes"; exit 1; } || true
      - name: Commit approved Phase 5A cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: simplify runtime compatibility layer"
          git push origin HEAD:main

name: PR5 Header Tools Ownership

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.head_ref == 'agent/header-tools-ownership-v15-2-10'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Check out PR5 branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply Header and More Tools ownership extraction
        run: node scripts/agent-pr5-header-tools-extraction.mjs
      - name: Refresh compatibility runtime files
        run: npm run prepare:runtime
      - name: Run source quality
        run: npm run quality
      - name: Run focused Header and More Tools ownership coverage
        run: npx playwright test tests/browser/header-tools-ownership-v15-2-10.spec.mjs --retries=0
      - name: Run complete browser suite without retries
        run: npx playwright test --retries=0
      - name: Audit production dependencies
        run: npm run audit
      - name: Verify and commit validated PR5 application patch
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          allowed=(
            assets/js/pwa-update-v15-0-5.js
            pwa-update-v15-0-5.js
            header-tools-compat.js
            index.html
            sw.js
            scripts/prepare-runtime.mjs
            tests/helpers/inspect-project.mjs
            tests/regression/validate-pwa-updater-v15-0-5.mjs
            tests/browser/phone-finance-css-ownership-v15-2-10.spec.mjs
            tests/browser/topbar-dashboard-history-tools-menu.spec.mjs
            tests/browser/topbar-quick-add-tools-menu.spec.mjs
            .github/workflows/quality-pages.yml
          )

          unexpected=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            matched=0
            for allowed_file in "${allowed[@]}"; do
              if [[ "$file" == "$allowed_file" ]]; then matched=1; break; fi
            done
            if [[ $matched -eq 0 && "$file" != "test-results/.last-run.json" ]]; then
              echo "Unexpected transformed path: $file" >&2
              unexpected=1
            fi
          done < <(git diff --name-only)
          [[ $unexpected -eq 0 ]] || exit 1

          git add -- "${allowed[@]}"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Validated PR5 tree already committed."
            exit 0
          fi
          git commit -m "refactor(ui): move Header and More Tools behavior to UI module"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

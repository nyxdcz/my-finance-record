name: Fix V15.2.3 release

on:
  push:
    branches:
      - feat/v15-2-3-sync-status-icons

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/v15-2-3-sync-status-icons
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply release fixes
        run: node scripts/fix-v15-2-3-release.mjs
      - name: Commit release fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: finalize V15.2.3 sync status release"
          git push origin HEAD:feat/v15-2-3-sync-status-icons

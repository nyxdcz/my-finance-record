name: Apply Record Spending V15.0.4

on:
  push:
    branches:
      - fix/record-spending-v15-0-4
    paths:
      - scripts/apply-record-spending-v15-0-4.py
      - .github/workflows/apply-record-spending-v15-0-4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply V15.0.4 patch
        run: python3 scripts/apply-record-spending-v15-0-4.py

      - name: Align escaped V15.0.4 validator markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/validate-v15-0-4.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(r'15\.0\.3', r'15\.0\.4')
          text = text.replace(r'V15\.0\.3', r'V15\.0\.4')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Preserve installer executable bit
        run: chmod +x Install_V15_0_4.command run_audit.sh

      - name: Install dependencies
        run: npm ci

      - name: Run full repository quality
        run: npm run quality

      - name: Check diff
        run: git diff --check

      - name: Remove one-time patch automation
        run: |
          rm -f scripts/apply-record-spending-v15-0-4.py
          rm -f .github/workflows/apply-record-spending-v15-0-4.yml

      - name: Commit V15.0.4 repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore Record spending in V15.0.4"
          git push origin HEAD:fix/record-spending-v15-0-4

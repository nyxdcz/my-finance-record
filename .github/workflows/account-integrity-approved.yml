name: Apply approved account integrity patch

on:
  push:
    paths:
      - ".github/workflows/account-integrity-approved.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply approved account integrity changes
        run: |
          python .github/account-integrity-approved.py
          node scripts/prepare-runtime.mjs
          node --check assets/js/account-ledger.js
          node --check assets/js/account-submit-compat.js
          node --check assets/js/pwa-update.js
          node --check sw.js
          node --check tests/sync/validate-account-reconciliation-sync.mjs
          node tests/run.mjs sync
          node tests/regression/validate-pwa-runtime.mjs
      - name: Commit approved fix and remove temporary runner
        run: |
          rm .github/account-integrity-approved.py
          rm .github/workflows/account-integrity-approved.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve account balance corrections"
          git push origin HEAD:main

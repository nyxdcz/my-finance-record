name: UI2 Production Fix

on:
  push:
    branches:
      - fix/ui-icon-alignment-v15-0-4-ui2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-icon-alignment-v15-0-4-ui2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply production UI2 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          index = root/'index.html'
          s = index.read_text()
          old = '''  <link rel="stylesheet" href="./app.css?v=14.0.23">\n  <link rel="stylesheet" href="./ui-icon-alignment-v15-0-4.css?v=15.0.4-ui1">\n  <link rel="stylesheet" href="./dashboard-interactions.css?v=14.0.23">'''
          new = '''  <link rel="stylesheet" href="./app.css?v=14.0.23">\n  <link rel="stylesheet" href="./dashboard-interactions.css?v=14.0.23">\n  <link rel="stylesheet" href="./ui-icon-alignment-v15-0-4.css?v=15.0.4-ui2">'''
          if old not in s:
              raise SystemExit('index stylesheet block not found')
          index.write_text(s.replace(old,new,1))

          sw = root/'sw.js'
          s = sw.read_text()
          s = s.replace('finance-v15-20260815-ui-align-r10','finance-v15-20260815-ui-align-r11')
          old = '''  asset("./app.css?v=14.0.23"),\n  asset("./ui-icon-alignment-v15-0-4.css?v=15.0.4-ui1"),\n  asset("./dashboard-interactions.css?v=14.0.23"),'''
          new = '''  asset("./app.css?v=14.0.23"),\n  asset("./dashboard-interactions.css?v=14.0.23"),\n  asset("./ui-icon-alignment-v15-0-4.css?v=15.0.4-ui2"),'''
          if old not in s:
              raise SystemExit('service worker stylesheet block not found')
          sw.write_text(s.replace(old,new,1))

          version_path = root/'version.json'
          version = json.loads(version_path.read_text())
          version['cacheVersion'] = 'finance-v15-20260815-ui-align-r11'
          version['notes'] = 'Fixes Record spending and Add Expense refresh failures, preserves safe multi-device Finance behavior, and forces the corrected production UI alignment stylesheet order/cache pin without changing Finance Schema 12 or Cloud Schema V3.'
          version_path.write_text(json.dumps(version, indent=2) + '\n')

          for p in (root/'tests').glob('*.mjs'):
              s = p.read_text()
              s = s.replace('finance-v15-20260815-ui-align-r10','finance-v15-20260815-ui-align-r11')
              s = s.replace('ui-icon-alignment-v15-0-4\\.css\\?v=15\\.0\\.4-ui1','ui-icon-alignment-v15-0-4\\.css\\?v=15\\.0\\.4-ui2')
              s = s.replace('ui-icon-alignment-v15-0-4.css?v=15.0.4-ui1','ui-icon-alignment-v15-0-4.css?v=15.0.4-ui2')
              p.write_text(s)

          validate = root/'tests/validate-v15-0-4.mjs'
          s = validate.read_text()
          anchor = 'assert.match(index,/ui-icon-alignment-v15-0-4\\.css\\?v=15\\.0\\.4-ui2/);\n'
          order = '''assert.ok(index.indexOf('dashboard-interactions.css?v=14.0.23') < index.indexOf('ui-icon-alignment-v15-0-4.css?v=15.0.4-ui2'), "production UI alignment stylesheet must load after dashboard interactions");\nassert.doesNotMatch(index,/ui-icon-alignment-v15-0-4\\.css\\?v=15\\.0\\.4-ui1/);\n'''
          if order.strip() not in s:
              if anchor not in s:
                  raise SystemExit('V15 validator ui2 anchor not found')
              s = s.replace(anchor, anchor + order, 1)
          validate.write_text(s)

          spec = root/'tests/ui-icon-alignment.spec.mjs'
          spec.write_text('''import { test, expect } from "@playwright/test";\n\ntest("production V15.0.4 UI alignment uses the final ui2 stylesheet", async ({ page }) => {\n  await page.goto("http://127.0.0.1:3000/?page=dashboard", { waitUntil:"domcontentloaded" });\n\n  const styles = await page.locator('link[rel="stylesheet"]').evaluateAll(nodes => nodes.map(node => node.getAttribute("href") || ""));\n  const dashboardCss = styles.findIndex(href => href.includes("dashboard-interactions.css?v=14.0.23"));\n  const ui2Css = styles.findIndex(href => href.includes("ui-icon-alignment-v15-0-4.css?v=15.0.4-ui2"));\n  expect(dashboardCss).toBeGreaterThanOrEqual(0);\n  expect(ui2Css).toBeGreaterThan(dashboardCss);\n  expect(styles.some(href => href.includes("ui-icon-alignment-v15-0-4.css?v=15.0.4-ui1"))).toBe(false);\n\n  const badge = await page.locator("#buildBadge").evaluate(element => {\n    const before = getComputedStyle(element, "::before");\n    return { content:before.content, display:before.display, width:before.width, marginRight:before.marginRight };\n  });\n  expect(badge.content).toBe("none");\n  expect(badge.display).toBe("none");\n  expect(badge.width).toBe("0px");\n  expect(badge.marginRight).toBe("0px");\n\n  const addExpenseGap = await page.locator("#quickAddExpense").evaluate(element => getComputedStyle(element).gap);\n  expect(addExpenseGap).toBe("4px");\n\n  await page.waitForTimeout(100);\n  const customize = page.locator("#customizeDashboardButton");\n  if (await customize.count()) {\n    const computed = await customize.evaluate(element => {\n      const style = getComputedStyle(element);\n      const before = getComputedStyle(element, "::before");\n      return { display:style.display, alignItems:style.alignItems, justifyItems:style.justifyItems, paddingLeft:style.paddingLeft, paddingRight:style.paddingRight, beforeMargin:before.margin };\n    });\n    expect(computed.display).toBe("inline-grid");\n    expect(computed.alignItems).toBe("center");\n    expect(computed.justifyItems).toBe("center");\n    expect(computed.paddingLeft).toBe("0px");\n    expect(computed.paddingRight).toBe("0px");\n    expect(computed.beforeMargin).toBe("0px");\n  }\n});\n''')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run repository quality
        run: npm run quality
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run UI2 browser regression
        run: npx playwright test tests/ui-icon-alignment.spec.mjs
      - name: Commit validated patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/ui2-production-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js version.json tests
          git commit -m "style: deliver V15.0.4 ui2 alignment shell"
          git push origin HEAD:fix/ui-icon-alignment-v15-0-4-ui2

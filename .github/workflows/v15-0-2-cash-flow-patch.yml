name: V15.0.2 Cash-flow Chart Patch

on:
  push:
    branches:
      - agent/v15-0-2-cash-flow-chart
    paths:
      - .github/workflows/v15-0-2-cash-flow-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v15-0-2-cash-flow-chart
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Fix validator escape in patch generator
        run: python .github/scripts/fix_v15_0_2_patch.py
      - name: Apply V15.0.2 patch
        run: python .github/scripts/v15_0_2_patch.py
      - name: Restore installer mode
        run: chmod +x Install_V15_0_2.command
      - name: Install dependencies
        run: npm ci
      - name: Run repository quality
        run: npm run quality
      - name: Commit V15.0.2
        run: |
          rm .github/workflows/v15-0-2-cash-flow-patch.yml
          rm .github/scripts/v15_0_2_patch.py
          rm .github/scripts/fix_v15_0_2_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: V15.0.2 cash-flow chart focus"
          git push origin HEAD:agent/v15-0-2-cash-flow-chart

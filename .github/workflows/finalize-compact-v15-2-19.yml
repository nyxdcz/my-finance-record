name: Finalize compact V15.2.19

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-compact-v15-2-19.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply compact expense cards and V15.2.19 metadata
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          OLD_VERSION = "15.2.18"
          NEW_VERSION = "15.2.19"
          OLD_CACHE = "finance-v15-20260821-horizontal-kanban-r54"
          NEW_CACHE = "finance-v15-20260821-compact-expense-cards-r55"
          RELEASE_NAME = "Compact Expense Cards"

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing marker for {label}: {old}")
              return text.replace(old, new, 1)

          # Compact only the final desktop expense-card layer so phone rules remain unchanged.
          css_path = Path("assets/css/production-ui-audit-v15-2-13.css")
          css = css_path.read_text()
          marker = "/* V15.2.19 · Expense card-list columns, matching the Project Agenda card rhythm. */"
          if marker not in css:
              raise SystemExit("Expense-card CSS marker missing")
          prefix, suffix = css.split(marker, 1)
          replacements = [
              ("gap: 10px !important;", "gap: 8px !important;", "period-column gap"),
              ("padding: 8px !important;", "padding: 6px !important;", "period shell padding"),
              ("min-height: 58px !important;", "min-height: 50px !important;", "period header height"),
              ("padding: 6px 6px 9px !important;", "padding: 4px 5px 6px !important;", "period header padding"),
              ("font-size: .9rem !important;", "font-size: .86rem !important;", "period heading size"),
              ("margin-top: 3px !important;", "margin-top: 2px !important;", "period description spacing"),
              ("font-size: .66rem !important;", "font-size: .63rem !important;", "period description size"),
              ("font-size: .92rem !important;", "font-size: .88rem !important;", "period total size"),
              ("padding: 10px !important;", "padding: 7px !important;", "expense card padding"),
              ("gap: 6px 10px !important;", "gap: 4px 8px !important;", "expense card internal gap"),
              ("font-size: .8rem !important;", "font-size: .78rem !important;", "expense title size"),
              ("margin-top: 3px !important;", "margin-top: 2px !important;", "expense secondary spacing"),
              ("margin-top: 5px !important;", "margin-top: 3px !important;", "status spacing"),
              ("gap: 4px !important;", "gap: 3px !important;", "status gap"),
              ("gap: 4px 7px !important;", "gap: 2px 6px !important;", "deadline metadata gap"),
              ("margin-top: 2px !important;", "margin-top: 1px !important;", "action footer margin"),
              ("padding-top: 8px !important;", "padding-top: 5px !important;", "action footer padding"),
              ("gap: 6px !important;", "gap: 4px !important;", "action button gap"),
              ("min-height: 32px !important;", "min-height: 30px !important;", "action minimum height"),
              ("height: 32px !important;", "height: 30px !important;", "action height"),
              ("padding: 5px 8px !important;", "padding: 4px 7px !important;", "action padding"),
              ("font-size: .67rem !important;", "font-size: .65rem !important;", "action text size")
          ]
          for old, new, label in replacements:
              suffix = replace_once(suffix, old, new, label)

          old_saved = '''  html body #money .record-row[data-expense-row] .button-saved .saved-button-text {
    font-size: 0 !important;
  }

  html body #money .record-row[data-expense-row] .button-saved .saved-button-text::after {
    content: "Repeat monthly";
    font-size: .67rem !important;
  }

  html body #money .record-row[data-expense-row] .button-saved.active .saved-button-text::after {
    content: "Repeats monthly";
  }'''
          new_saved = '''  html body #money .record-row[data-expense-row] .button-saved .saved-button-text {
    font-size: .65rem !important;
    white-space: nowrap !important;
  }

  html body #money .record-row[data-expense-row] .button-saved .saved-button-text::after {
    content: none !important;
  }'''
          suffix = replace_once(suffix, old_saved, new_saved, "monthly-repeat visible label")
          css_path.write_text(prefix + marker + suffix)

          # Browser test: rotate cache and lock the new compact desktop geometry.
          test_path = Path("tests/browser/production-ui-audit-v15-2-13.spec.mjs")
          test = test_path.read_text()
          test = replace_once(test, f'const APP_CACHE = "{OLD_CACHE}";', f'const APP_CACHE = "{NEW_CACHE}";', "browser cache version")
          test = replace_once(
              test,
              '''      rowGap:spacing,
      actionCount:actions.length,''',
              '''      rowGap:spacing,
      rowPaddingTop:rowStyle ? parseFloat(rowStyle.paddingTop) : 0,
      actionFooterPaddingTop:firstRow ? parseFloat(getComputedStyle(firstRow.querySelector(":scope > .desktop-record-actions")).paddingTop) : 0,
      recurrenceButtonHeight:saved ? saved.getBoundingClientRect().height : 0,
      actionCount:actions.length,''',
              "browser compact metrics"
          )
          test = replace_once(
              test,
              '''      savedLabel:saved?.classList.contains("active") ? getComputedStyle(savedText, "::after").content : getComputedStyle(savedText, "::after").content,''',
              '''      savedLabel:savedText?.textContent?.trim() || "",''',
              "browser recurrence label"
          )
          test = replace_once(
              test,
              '''  expect(metrics.rowGap).toBeCloseTo(5, 0);
  expect(metrics.actionCount).toBeGreaterThanOrEqual(3);''',
              '''  expect(metrics.rowGap).toBeCloseTo(5, 0);
  expect(metrics.rowPaddingTop).toBeCloseTo(7, 0);
  expect(metrics.actionFooterPaddingTop).toBeCloseTo(5, 0);
  expect(metrics.recurrenceButtonHeight).toBeCloseTo(30, 0);
  expect(metrics.actionCount).toBeGreaterThanOrEqual(3);''',
              "browser compact assertions"
          )
          test_path.write_text(test)

          # Make the monthly recurrence label semantic text instead of pseudo-element-only text.
          index_path = Path("index.html")
          index = index_path.read_text()
          old_repeat_text = '<span class="saved-button-text">${item.recurring === "Monthly" ? "Repeats" : "Repeat"}</span>'
          new_repeat_text = '<span class="saved-button-text">${item.recurring === "Monthly" ? "Repeats monthly" : "Repeat monthly"}</span>'
          repeat_count = index.count(old_repeat_text)
          if repeat_count < 2:
              raise SystemExit(f"Expected recurrence labels in unpaid and paid renderers, found {repeat_count}")
          index = index.replace(old_repeat_text, new_repeat_text)

          # Release metadata in index.html.
          index = replace_once(index, "<title>My Finance Records · V15.2.18</title>", "<title>My Finance Records · V15.2.19</title>", "page title")
          index = replace_once(index, '<small id="buildBadge" title="V15.2.18 · Horizontal Project Kanban · August 21, 2026">V15.2.18</small>', '<small id="buildBadge" title="V15.2.19 · Compact Expense Cards · August 21, 2026">V15.2.19</small>', "build badge")
          index = replace_once(index, 'const APP_VERSION = "15.2.18";', 'const APP_VERSION = "15.2.19";', "index app version")
          index = replace_once(index, 'const APP_RELEASE_NAME = "Horizontal Project Kanban";', 'const APP_RELEASE_NAME = "Compact Expense Cards";', "release name")
          index = replace_once(index, f'const APP_CACHE_VERSION = "{OLD_CACHE}";', f'const APP_CACHE_VERSION = "{NEW_CACHE}";', "index cache")
          index = replace_once(index, 'production-ui-audit-v15-2-13.css?v=15.2.14-audit2', 'production-ui-audit-v15-2-13.css?v=15.2.19-compact1', "production CSS cache bust")
          index = replace_once(index, 'pwa-update-v15-0-5.js?v=15.2.18-release14', 'pwa-update-v15-0-5.js?v=15.2.19-release1', "PWA updater cache bust")
          history_anchor = 'VERSION_HISTORY.unshift({"version":"V15.2.18","title":"Horizontal Project Kanban","changes":["Rebuilds Project Agenda and Projects as horizontal boards with full-card mouse, touch, and keyboard dragging.","Adds protected start and Completed columns plus named, colored, reorderable custom workflow columns.","Preserves completion confirmation, payments, balances, revisions, safe invalid-drop return, and five-second Undo."]});'
          history_new = history_anchor + '\n    VERSION_HISTORY.unshift({"version":"V15.2.19","title":"Compact Expense Cards","changes":["Compacts First half, Second half, and Other expenses into dense three-column desktop card lists with 7px card padding and 5px card spacing.","Restores the full Repeat/Repeats monthly action immediately before Mark paid, followed by Edit.","Preserves phone touch layouts, recurrence semantics, Finance calculations, balances, filters, payments, schemas, and sync behavior."]});'
          index = replace_once(index, history_anchor, history_new, "version history")
          index_path.write_text(index)

          # Package and lock versions.
          pkg_path = Path("package.json")
          pkg = json.loads(pkg_path.read_text())
          if pkg.get("version") != OLD_VERSION:
              raise SystemExit(f"Unexpected package version: {pkg.get('version')}")
          pkg["version"] = NEW_VERSION
          pkg_path.write_text(json.dumps(pkg, indent=2) + "\n")

          lock_path = Path("package-lock.json")
          lock = json.loads(lock_path.read_text())
          if lock.get("version") != OLD_VERSION or lock.get("packages", {}).get("", {}).get("version") != OLD_VERSION:
              raise SystemExit("Unexpected package-lock release version")
          lock["version"] = NEW_VERSION
          lock["packages"][""]["version"] = NEW_VERSION
          lock_path.write_text(json.dumps(lock, indent=2) + "\n")

          version_path = Path("version.json")
          version = json.loads(version_path.read_text())
          if version.get("version") != OLD_VERSION:
              raise SystemExit(f"Unexpected version.json version: {version.get('version')}")
          version.update({
              "version": NEW_VERSION,
              "cacheVersion": NEW_CACHE,
              "released": "2026-08-21",
              "name": RELEASE_NAME,
              "notes": "V15.2.19 compacts the First half, Second half, and Other expenses card lists with 7px card padding, tighter metadata, 5px inter-card spacing, 30px desktop actions, and the full Repeat/Repeats monthly control directly before Mark paid. Finance Schema 12, Cloud Schema V3, calculations, balances, recurrence semantics, phone touch behavior, filters, payments, and sync are unchanged."
          })
          version_path.write_text(json.dumps(version, indent=2) + "\n")

          # README + changelog.
          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme = replace_once(readme, "# My Finance Records · V15.2.18", "# My Finance Records · V15.2.19", "README heading")
          readme = replace_once(readme, "version-V15.2.18-2563eb", "version-V15.2.19-2563eb", "README badge")
          readme = replace_once(readme, "| **V15.2.18** · Horizontal Project Kanban | **12** | **V3** | **5 minutes** |", "| **V15.2.19** · Compact Expense Cards | **12** | **V3** | **5 minutes** |", "README release table")
          old_summary = "The current release turns Project Agenda and Projects into horizontal Kanban boards with full-card drag-and-drop, protected start and Completed columns, custom workflow columns, completion safeguards, and Undo. Project values, payments, revision history, finance calculations, schemas, and sync behavior remain protected."
          new_summary = "The current release compacts First half, Second half, and Other expenses into dense responsive card lists with 7px card padding, 5px spacing between expense cards, tighter metadata, 30px desktop actions, and the full Repeat/Repeats monthly control directly before Mark paid. Finance calculations, recurrence behavior, schemas, balances, filters, payments, phone touch behavior, and sync remain protected."
          readme = replace_once(readme, old_summary, new_summary, "README current release summary")
          readme_path.write_text(readme)

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          if not changelog.startswith("## 15.2.18 · 2026-08-21"):
              raise SystemExit("Unexpected latest changelog release")
          entry = f'''## 15.2.19 · 2026-08-21
- Compacted First half, Second half, and Other expenses into dense responsive card lists with 7px card padding, tighter metadata, and 5px vertical spacing between cards.
- Restored the full Repeat/Repeats monthly action directly before Mark paid, kept Edit next, and reduced desktop expense actions to 30px without changing recurrence behavior.
- Preserved Finance Schema 12, Cloud Schema V3, calculations, balances, filters, payment behavior, phone touch layouts, and sync while rotating the PWA shell to `{NEW_CACHE}`.

'''
          changelog_path.write_text(entry + changelog)

          # Service worker and PWA updater source.
          sw_path = Path("sw.js")
          sw = sw_path.read_text()
          sw = replace_once(sw, 'const APP_VERSION = "15.2.18";', 'const APP_VERSION = "15.2.19";', "worker app version")
          sw = replace_once(sw, f'const CACHE_VERSION = "{OLD_CACHE}";', f'const CACHE_VERSION = "{NEW_CACHE}";', "worker cache")
          sw = replace_once(sw, 'production-ui-audit-v15-2-13.css?v=15.2.14-audit2', 'production-ui-audit-v15-2-13.css?v=15.2.19-compact1', "worker production CSS")
          sw = replace_once(sw, 'pwa-update-v15-0-5.js?v=15.2.18-release14', 'pwa-update-v15-0-5.js?v=15.2.19-release1', "worker PWA updater")
          sw_path.write_text(sw)

          updater_path = Path("assets/js/pwa-update-v15-0-5.js")
          updater = updater_path.read_text()
          updater = replace_once(updater, f'const CURRENT_CACHE_VERSION = "{OLD_CACHE}";', f'const CURRENT_CACHE_VERSION = "{NEW_CACHE}";', "PWA current cache")
          updater_path.write_text(updater)

          # Repository inspector release expectations.
          inspect_path = Path("tests/helpers/inspect-project.mjs")
          inspect = inspect_path.read_text()
          inspect = replace_once(inspect, 'pkg.version !== "15.2.18"', 'pkg.version !== "15.2.19"', "inspector package version")
          inspect = replace_once(inspect, 'Expected current package version 15.2.18', 'Expected current package version 15.2.19', "inspector package message")
          inspect = replace_once(inspect, 'startsWith("# My Finance Records · V15.2.18")', 'startsWith("# My Finance Records · V15.2.19")', "inspector README version")
          inspect = replace_once(inspect, 'README release heading is not V15.2.18', 'README release heading is not V15.2.19', "inspector README message")
          inspect = replace_once(inspect, 'startsWith("## 15.2.18 · 2026-08-21")', 'startsWith("## 15.2.19 · 2026-08-21")', "inspector changelog version")
          inspect = replace_once(inspect, 'CHANGELOG latest entry is not V15.2.18', 'CHANGELOG latest entry is not V15.2.19', "inspector changelog message")
          if 'Repository inspection passed: V15.2.18 release sources' in inspect:
              inspect = inspect.replace('Repository inspection passed: V15.2.18 release sources', 'Repository inspection passed: V15.2.19 release sources', 1)
          inspect_path.write_text(inspect)

          # Source-contract regression.
          prod_path = Path("tests/regression/validate-production-ui-audit-v15-2-13.mjs")
          prod = prod_path.read_text()
          prod = replace_once(prod, 'assert.equal(version.version, "15.2.18");', 'assert.equal(version.version, "15.2.19");', "production regression version")
          prod = replace_once(prod, 'assert.equal(pkg.version, "15.2.18");', 'assert.equal(pkg.version, "15.2.19");', "production regression package")
          prod = replace_once(prod, f'assert.equal(version.cacheVersion, "{OLD_CACHE}");', f'assert.equal(version.cacheVersion, "{NEW_CACHE}");', "production regression cache")
          prod = replace_once(prod, r'assert.match(index, /production-ui-audit-v15-2-13\.css\?v=15\.2\.14-audit2/);', r'assert.match(index, /production-ui-audit-v15-2-13\.css\?v=15\.2\.19-compact1/);', "production regression index CSS")
          prod = replace_once(prod, r'assert.match(worker, /production-ui-audit-v15-2-13\.css\?v=15\.2\.14-audit2/);', r'assert.match(worker, /production-ui-audit-v15-2-13\.css\?v=15\.2\.19-compact1/);', "production regression worker CSS")
          anchor = 'assert.match(css, /#money :is\\(#earlyExpenses, #lateExpenses, #otherExpenses\\) > \\.record-row\\[data-expense-row\\] \\+ \\.record-row\\[data-expense-row\\][\\s\\S]*margin-top:\\s*5px !important;/);'
          compact_contract = anchor + '\nassert.match(css, /Expense card-list columns[\\s\\S]*padding:\\s*7px !important;/);\nassert.match(css, /desktop-record-actions[\\s\\S]*padding-top:\\s*5px !important;/);\nassert.match(css, /desktop-record-actions > \\.button[\\s\\S]*height:\\s*30px !important;/);'
          prod = replace_once(prod, anchor, compact_contract, "compact CSS source contract")
          prod = replace_once(prod, 'console.log("V15.2.18 production UI/UX audit source contract passed.");', 'console.log("V15.2.19 compact expense-card UI source contract passed.");', "production regression message")
          prod_path.write_text(prod)

          # PWA updater regression expectations.
          pwa_path = Path("tests/regression/validate-pwa-updater-v15-0-5.mjs")
          pwa = pwa_path.read_text()
          pwa = replace_once(pwa, 'assert.equal(version.version, "15.2.18");', 'assert.equal(version.version, "15.2.19");', "PWA version")
          pwa = replace_once(pwa, f'assert.equal(version.cacheVersion, "{OLD_CACHE}");', f'assert.equal(version.cacheVersion, "{NEW_CACHE}");', "PWA cache")
          pwa = replace_once(pwa, f'assert.match(index, /const APP_CACHE_VERSION = "{OLD_CACHE}";/);', f'assert.match(index, /const APP_CACHE_VERSION = "{NEW_CACHE}";/);', "PWA index cache")
          pwa = replace_once(pwa, f'assert.match(updater, /const CURRENT_CACHE_VERSION = "{OLD_CACHE}";/);', f'assert.match(updater, /const CURRENT_CACHE_VERSION = "{NEW_CACHE}";/);', "PWA updater cache")
          pwa = replace_once(pwa, r'assert.match(worker, /const APP_VERSION = "15\.2\.18";/);', r'assert.match(worker, /const APP_VERSION = "15\.2\.19";/);', "PWA worker version")
          pwa = replace_once(pwa, f'assert.match(worker, /{OLD_CACHE}/);', f'assert.match(worker, /{NEW_CACHE}/);', "PWA worker cache")
          pwa = replace_once(pwa, r'assert.match(worker, /pwa-update-v15-0-5\.js\?v=15\.2\.18-release14/);', r'assert.match(worker, /pwa-update-v15-0-5\.js\?v=15\.2\.19-release1/);', "PWA worker updater query")
          pwa = replace_once(pwa, 'console.log("V15.2.18 PWA updater regression passed with pure PWA/cache ownership, static sidebar branding, neutral Finance border delivery, and light-mode account-name-only refresh delivery.");', 'console.log("V15.2.19 PWA updater regression passed with compact expense-card delivery and preserved PWA/cache ownership.");', "PWA regression message")
          pwa_path.write_text(pwa)

          # Confirm the functional desktop recurrence control remains in both expense renderers.
          final_index = index_path.read_text()
          if final_index.count('data-toggle-saved="${item.id}"') < 2:
              raise SystemExit("Monthly recurrence controls were unexpectedly removed")
          if final_index.count('"Repeats monthly" : "Repeat monthly"') < 2:
              raise SystemExit("Full monthly recurrence labels were not applied")

          PY

      - name: Verify generated diff
        run: |
          git diff --check
          git diff --stat

      - name: Commit compact V15.2.19 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/css/production-ui-audit-v15-2-13.css \
            tests/browser/production-ui-audit-v15-2-13.spec.mjs \
            index.html \
            package.json package-lock.json version.json README.md CHANGELOG.md \
            sw.js assets/js/pwa-update-v15-0-5.js \
            tests/helpers/inspect-project.mjs \
            tests/regression/validate-production-ui-audit-v15-2-13.mjs \
            tests/regression/validate-pwa-updater-v15-0-5.mjs
          git commit -m "release: V15.2.19 compact expense cards"
          git push origin HEAD:main

name: Scoped responsive accessibility refinement

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refine-and-validate:
    if: github.head_ref == 'agent/responsive-accessibility-v15-2-7'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/responsive-accessibility-v15-2-7
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply scoped responsive and accessibility fixes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const read = file => fs.readFileSync(file, 'utf8');
          const write = (file, text) => fs.writeFileSync(file, text);
          const replaceOnce = (text, from, to, label) => {
            const first = text.indexOf(from);
            if (first < 0 || text.indexOf(from, first + from.length) >= 0) throw new Error(`${label}: expected exactly one match`);
            return text.slice(0, first) + to + text.slice(first + from.length);
          };

          // Monthly Budget Plan: keep the collapsed phone summary compact without shrinking labels below a readable size.
          const budgetPath = 'assets/css/budget-planning.css';
          let budget = read(budgetPath);
          const budgetMarker = '/* V15.2.7 responsive readability refinement */';
          if (!budget.includes(budgetMarker)) {
            budget += `\n\n${budgetMarker}\n@media (max-width:430px) {\n  .budget-planner-card.is-planner-collapsed .budget-planner-summary {\n    grid-template-columns:repeat(2,minmax(0,1fr));\n    gap:5px;\n  }\n  .budget-planner-card.is-planner-collapsed .budget-plan-kpi {\n    min-height:50px;\n    padding:6px 7px;\n  }\n  .budget-planner-card.is-planner-collapsed .budget-plan-kpi span {\n    display:block;\n    overflow:hidden;\n    white-space:nowrap;\n    text-overflow:ellipsis;\n    font-size:.64rem;\n    line-height:1.2;\n  }\n  .budget-planner-card.is-planner-collapsed .budget-plan-kpi strong {\n    margin-top:3px;\n    font-size:.8rem;\n  }\n  .budget-planner-card.is-planner-collapsed .budget-plan-kpi:last-child {\n    grid-column:1 / -1;\n  }\n}\n`;
          }
          write(budgetPath, budget);

          // Mobile/tablet: make Finance tabs a full 44px target and protect touch targets on coarse-pointer tablets.
          const mobilePath = 'assets/css/mobile-v14-0-23.css';
          let mobile = read(mobilePath);
          mobile = replaceOnce(
            mobile,
            'html body .finance-workspace-marquee-row > .money-workspace-switcher .workspace-switcher-button {\n    min-width: 0 !important;\n    min-height: 42px !important;\n  }',
            'html body .finance-workspace-marquee-row > .money-workspace-switcher .workspace-switcher-button {\n    min-width: 0 !important;\n    min-height: 44px !important;\n  }',
            'phone Finance tab touch target'
          );
          const tabletMarker = '/* V15.2.7 coarse-pointer tablet touch-target contract */';
          if (!mobile.includes(tabletMarker)) {
            mobile += `\n\n${tabletMarker}\n@media (min-width:701px) and (max-width:1024px) and (pointer:coarse) {\n  .workspace-switcher-button,\n  .button,\n  .month-nav-button,\n  .topbar-history-button,\n  .topbar-tools-trigger,\n  .overflow-menu-trigger,\n  .budget-planner-toggle,\n  .budget-panel-collapse {\n    min-height:44px !important;\n  }\n  .month-nav-button,\n  .topbar-history-button,\n  .topbar-tools-trigger,\n  .overflow-menu-trigger,\n  .budget-planner-toggle,\n  .budget-panel-collapse {\n    min-width:44px !important;\n  }\n}\n`;
          }
          write(mobilePath, mobile);

          // Dark mode: use an explicit, high-visibility keyboard focus token while preserving the app's blue identity.
          const blackPath = 'assets/css/black-canvas-v15-1-0.css';
          let black = read(blackPath);
          black = replaceOnce(black, ':root {\n  --bg:#efefef;\n}', ':root {\n  --bg:#efefef;\n  --focus-ring:#245ea8;\n}', 'root focus token');
          black = replaceOnce(black, 'html[data-theme="light"] {\n  color-scheme:light;\n  --bg:#efefef;\n}', 'html[data-theme="light"] {\n  color-scheme:light;\n  --bg:#efefef;\n  --focus-ring:#245ea8;\n}', 'light focus token');
          black = replaceOnce(black, '  --primary-contrast:#ffffff;\n  --field-label:#dbe3ef;', '  --primary-contrast:#ffffff;\n  --focus-ring:#8ab4f8;\n  --field-label:#dbe3ef;', 'dark focus token');
          black = replaceOnce(
            black,
            '  outline-color:color-mix(in srgb,var(--primary) 58%,transparent) !important;\n}',
            '  outline:3px solid var(--focus-ring) !important;\n  outline-offset:2px;\n}',
            'focus indicator contract'
          );
          write(blackPath, black);

          // Ensure installed/PWA clients receive the changed responsive styles without changing finance/cache schemas.
          const swPath = 'sw.js';
          let sw = read(swPath);
          const oldCritical = 'url.pathname.endsWith("privacy-lock.js") || url.pathname.endsWith("cloud-sync-lifecycle.js") || url.pathname.endsWith("interaction-patterns.js") || url.pathname.endsWith("pwa-update-v15-0-5.js") || url.pathname.endsWith("ui-icon-alignment-v15-0-5.css")';
          const newCritical = 'url.pathname.endsWith("privacy-lock.js") || url.pathname.endsWith("cloud-sync-lifecycle.js") || url.pathname.endsWith("interaction-patterns.js") || url.pathname.endsWith("pwa-update-v15-0-5.js") || url.pathname.endsWith("ui-icon-alignment-v15-0-5.css") || url.pathname.endsWith("mobile-v14-0-23.css") || url.pathname.endsWith("budget-planning.css") || url.pathname.endsWith("black-canvas-v15-1-0.css")';
          if (!sw.includes('url.pathname.endsWith("budget-planning.css")')) sw = replaceOnce(sw, oldCritical, newCritical, 'responsive CSS PWA delivery');
          write(swPath, sw);

          // Extend the PWA regression to protect live delivery of the three changed CSS owners.
          const pwaTestPath = 'tests/regression/validate-pwa-updater-v15-0-5.mjs';
          let pwaTest = read(pwaTestPath);
          const pwaMarker = 'assert.match(worker, /mobile-v14-0-23\\.css/);\nassert.match(worker, /budget-planning\\.css/);\nassert.match(worker, /black-canvas-v15-1-0\\.css/);';
          if (!pwaTest.includes('assert.match(worker, /budget-planning\\.css/);')) {
            const insertion = 'assert.match(worker, /ui-icon-alignment-v15-0-5\\.css\\?v=15\\.2\\.4-ui1/);';
            pwaTest = replaceOnce(pwaTest, insertion, `${insertion}\n${pwaMarker}`, 'PWA responsive CSS regression');
          }
          write(pwaTestPath, pwaTest);

          // Real rendered-app viewport coverage for the widths requested in the UI audit.
          const browserTestPath = 'tests/browser/responsive-accessibility-v15-2-7.spec.mjs';
          const browserTest = `import { test, expect } from "@playwright/test";\n\nconst APP_URL = "http://127.0.0.1:3000/?page=money";\nconst widths = [320, 360, 375, 390, 430, 768, 820, 1024, 1280, 1440, 1920];\n\nasync function openApp(page, width) {\n  const height = width <= 430 ? 852 : width <= 1024 ? 900 : 1000;\n  await page.setViewportSize({ width, height });\n  await page.goto(APP_URL, { waitUntil:"domcontentloaded" });\n  await page.waitForFunction(() => Boolean(window.FinancePrivacyLock));\n  await page.evaluate(() => window.FinancePrivacyLock.setAuthenticated(true));\n  await page.waitForFunction(() => Boolean(document.querySelector("#money")));\n}\n\nfor (const width of widths) {\n  test(\`real app has no viewport overflow at \\${width}px\`, async ({ page }) => {\n    await openApp(page, width);\n    const metrics = await page.evaluate(() => {\n      const row = document.querySelector("#money > .finance-workspace-marquee-row");\n      const switcher = row?.querySelector(":scope > .money-workspace-switcher");\n      const topbar = document.querySelector(".topbar");\n      const rect = element => element?.getBoundingClientRect();\n      const inside = box => !box || (box.left >= -1 && box.right <= innerWidth + 1);\n      return {\n        overflow:Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) > innerWidth + 1,\n        topbarInside:inside(rect(topbar)),\n        switcherInside:inside(rect(switcher)),\n        switcherHeight:switcher ? rect(switcher).height : 0,\n        viewport:innerWidth\n      };\n    });\n    expect(metrics.overflow).toBe(false);\n    expect(metrics.topbarInside).toBe(true);\n    expect(metrics.switcherInside).toBe(true);\n    expect(metrics.switcherHeight).toBeGreaterThan(0);\n  });\n}\n\ntest("collapsed Monthly Budget Plan stays readable at narrow phone widths", async ({ page }) => {\n  for (const width of [320, 360, 390, 430]) {\n    await openApp(page, width);\n    const card = page.locator("#monthlyBudgetPlannerCard");\n    const toggle = page.locator("#monthlyBudgetPlannerToggle");\n    await expect(card).toBeAttached();\n    if (await toggle.getAttribute("aria-expanded") === "true") {\n      await page.evaluate(() => document.getElementById("monthlyBudgetPlannerToggle")?.click());\n    }\n    await expect(card).toHaveClass(/is-planner-collapsed/);\n    const metrics = await card.evaluate(node => {\n      const visible = [...node.querySelectorAll(".budget-plan-kpi")].filter(item => getComputedStyle(item).display !== "none");\n      const labels = visible.map(item => parseFloat(getComputedStyle(item.querySelector("span")).fontSize));\n      const rects = visible.map(item => item.getBoundingClientRect());\n      return {\n        count:visible.length,\n        readable:labels.every(size => size >= 10),\n        firstTwoSameRow:rects.length >= 2 && Math.abs(rects[0].top - rects[1].top) < 2,\n        thirdNextRow:rects.length >= 3 && rects[2].top > rects[0].top + 2,\n        inside:rects.every(box => box.left >= -1 && box.right <= innerWidth + 1)\n      };\n    });\n    expect(metrics.count).toBe(3);\n    expect(metrics.readable).toBe(true);\n    expect(metrics.firstTwoSameRow).toBe(true);\n    expect(metrics.thirdNextRow).toBe(true);\n    expect(metrics.inside).toBe(true);\n  }\n});\n\ntest("dark mode keyboard focus indicator is visible", async ({ page }) => {\n  await openApp(page, 390);\n  await page.evaluate(() => {\n    document.documentElement.dataset.theme = "dark";\n    document.documentElement.dataset.themePreference = "dark";\n  });\n  const button = page.locator("#menuButton");\n  await button.focus();\n  const focus = await button.evaluate(node => {\n    const style = getComputedStyle(node);\n    return { width:parseFloat(style.outlineWidth), style:style.outlineStyle, color:style.outlineColor, offset:parseFloat(style.outlineOffset) };\n  });\n  expect(focus.width).toBeGreaterThanOrEqual(3);\n  expect(focus.style).toBe("solid");\n  expect(focus.color).not.toBe("rgba(0, 0, 0, 0)");\n  expect(focus.offset).toBeGreaterThanOrEqual(2);\n});\n\ntest("coarse-pointer tablets keep primary controls touch safe", async ({ browser }) => {\n  for (const width of [768, 820, 1024]) {\n    const context = await browser.newContext({ viewport:{ width, height:900 }, hasTouch:true, isMobile:true });\n    const page = await context.newPage();\n    await page.goto(APP_URL, { waitUntil:"domcontentloaded" });\n    await page.waitForFunction(() => Boolean(window.FinancePrivacyLock));\n    await page.evaluate(() => window.FinancePrivacyLock.setAuthenticated(true));\n    const sizes = await page.evaluate(() => {\n      const px = selector => {\n        const node = document.querySelector(selector);\n        return node ? parseFloat(getComputedStyle(node).minHeight) : 0;\n      };\n      return { workspace:px(".workspace-switcher-button"), month:px(".month-nav-button"), tools:px("#topbarToolsTrigger") };\n    });\n    expect(sizes.workspace).toBeGreaterThanOrEqual(44);\n    expect(sizes.month).toBeGreaterThanOrEqual(44);\n    expect(sizes.tools).toBeGreaterThanOrEqual(44);\n    await context.close();\n  }\n});\n`;
          write(browserTestPath, browserTest);
          NODE
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run source quality and regressions
        run: npm run quality
      - name: Run browser and UI validation
        run: npm run test:browser
      - name: Commit validated responsive refinement
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/css/budget-planning.css \
            assets/css/mobile-v14-0-23.css \
            assets/css/black-canvas-v15-1-0.css \
            sw.js \
            tests/regression/validate-pwa-updater-v15-0-5.mjs \
            tests/browser/responsive-accessibility-v15-2-7.spec.mjs
          git diff --cached --check
          git commit -m "fix: refine responsive accessibility"
          git push origin HEAD:agent/responsive-accessibility-v15-2-7

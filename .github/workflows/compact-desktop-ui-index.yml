name: Compact desktop UI index markup

on:
  push:
    branches: [fix/desktop-ui-phase1]

permissions:
  contents: write

jobs:
  compact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/desktop-ui-phase1
      - name: Compact only Phase 1 markup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          start_marker = '            <div class="toolbar report-export-actions" style="margin-bottom:0">'
          card_end_marker = '\n          </article>'
          start = text.find(start_marker)
          end = text.find(card_end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Report export Phase 1 block not found')
          compact_export = '            <div class="toolbar report-export-actions" style="margin-bottom:0"><button class="button button-primary" type="button" onclick="window.print()">Print / Save PDF</button><div class="overflow-menu report-export-menu"><button class="button button-secondary overflow-menu-trigger" type="button" aria-haspopup="menu" aria-controls="reportExportMenuPanel" aria-expanded="false">Export <span aria-hidden="true">▾</span></button><div class="record-more-panel report-export-menu-panel" id="reportExportMenuPanel" role="menu" aria-label="Export report" hidden><button id="exportMonthlyReportCsv" type="button" role="menuitem">Monthly report CSV</button><button id="exportMonthlyReportJson" type="button" role="menuitem">Monthly report JSON</button><button id="exportIncomeReportCsv" type="button" role="menuitem">Income CSV</button><button id="exportExpensesCsv" type="button" role="menuitem">All expenses CSV</button><button id="exportProjectsCsv" type="button" role="menuitem">All projects CSV</button></div></div></div>'
          text = text[:start] + compact_export + text[end:]

          old_open = '''                <details class="advanced-settings-disclosure">
                  <summary><span>Connection details</span><small>Supabase URL and publishable key</small></summary>
                  <div class="advanced-settings-content">
                <div class="cloud-config-grid">'''
          new_open = '                <details class="advanced-settings-disclosure"><summary><span>Connection details</span><small>Supabase URL and publishable key</small></summary><div class="advanced-settings-content"><div class="cloud-config-grid">'
          if text.count(old_open) != 1:
              raise SystemExit(f'Advanced Settings opening block count: {text.count(old_open)}')
          text = text.replace(old_open, new_open, 1)

          old_close = '''                <p class="v12-help">A hosted `sync-config.js` can configure both devices automatically. Secret and service-role keys are rejected and must never be placed in this PWA.</p>
                  </div>
                </details>'''
          new_close = '                <p class="v12-help">A hosted `sync-config.js` can configure both devices automatically. Secret and service-role keys are rejected and must never be placed in this PWA.</p></div></details>'
          if text.count(old_close) != 1:
              raise SystemExit(f'Advanced Settings closing block count: {text.count(old_close)}')
          text = text.replace(old_close, new_close, 1)

          path.write_text(text)
          PY
      - name: Commit compact markup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "refactor: compact desktop UI source markup"
          git push origin HEAD:fix/desktop-ui-phase1

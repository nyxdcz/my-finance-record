name: Apply V15.2.5 account and project contrast patch

on:
  workflow_run:
    workflows: ["Quality and GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Apply approved contrast fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          index_path = Path("index.html")
          index = index_path.read_text()
          old_card = '<div class="account-card ${editable ? "account-card-editable" : ""}" ${editable ? `data-account-card="${escapeHtml(name)}"` : ""}>'
          new_card = '<div class="account-card ${editable ? "account-card-editable" : ""}" data-account-type="${escapeAttribute(accountTypeDisplay(name))}" ${editable ? `data-account-card="${escapeHtml(name)}"` : ""}>'
          if new_card not in index:
              if old_card not in index:
                  raise SystemExit("Account card renderer anchor not found")
              index = index.replace(old_card, new_card)
          index = index.replace("./ui-icon-alignment-v15-0-5.css?v=15.2.4-ui1", "./ui-icon-alignment-v15-0-5.css?v=15.2.5-contrast1")
          index_path.write_text(index)

          css_path = Path("ui-icon-alignment-v15-0-5.css")
          css = css_path.read_text()
          marker = "/* V15.2.5-r4 · Bank/E-wallet label contrast and completed-project readability. */"
          if marker not in css:
              css += r'''

/* V15.2.5-r4 · Bank/E-wallet label contrast and completed-project readability. */
html body #money #moneyAccounts .account-card:is([data-account-type="Bank" i],[data-account-type="E-wallet" i]) .account-card-label > span,
html body #money #moneyAccounts .account-card:is([data-account-type="Bank" i],[data-account-type="E-wallet" i]) .account-card-label > small {
  color:#fff !important;
}

/* Completed-project metadata must remain readable on both light and dark surfaces. */
html body #projects .completed-project-record .project-source-line {
  color:var(--text) !important;
}
html body #projects .completed-project-record .project-deadline-state.upcoming {
  color:var(--text) !important;
  background:color-mix(in srgb,var(--green-soft) 78%,var(--surface) 22%) !important;
}
html body #projects .completed-project-record .project-revision-inline {
  color:var(--text) !important;
  background:color-mix(in srgb,var(--orange-soft) 78%,var(--surface) 22%) !important;
  border-color:color-mix(in srgb,var(--orange) 55%,var(--line)) !important;
}
'''
          css_path.write_text(css)

          sw_path = Path("sw.js")
          sw = sw_path.read_text().replace("./ui-icon-alignment-v15-0-5.css?v=15.2.4-ui1", "./ui-icon-alignment-v15-0-5.css?v=15.2.5-contrast1")
          sw_path.write_text(sw)

          index = index_path.read_text()
          css = css_path.read_text()
          sw = sw_path.read_text()
          checks = {
              "account type hook": 'data-account-type="${escapeAttribute(accountTypeDisplay(name))}"' in index,
              "bank contrast": '[data-account-type="Bank" i]' in css,
              "e-wallet contrast": '[data-account-type="E-wallet" i]' in css,
              "white labels": 'color:#fff !important' in css,
              "completed source contrast": '#projects .completed-project-record .project-source-line' in css,
              "completed date contrast": '#projects .completed-project-record .project-deadline-state.upcoming' in css,
              "revision contrast": '#projects .completed-project-record .project-revision-inline' in css,
              "35px badge preserved": 'width:35px !important' in css and 'height:35px !important' in css,
              "no-crop preserved": 'object-fit:contain !important' in css,
              "asset refresh in page": 'ui-icon-alignment-v15-0-5.css?v=15.2.5-contrast1' in index,
              "asset refresh in service worker": 'ui-icon-alignment-v15-0-5.css?v=15.2.5-contrast1' in sw,
              "version preserved": 'const APP_VERSION = "15.2.5"' in sw,
              "cache preserved": 'finance-v15-20260818-disclosure-alignment-r40' in sw,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Patch self-check failed: " + ", ".join(failed))
          print("Approved V15.2.5 contrast patch self-check passed")
          PY

      - name: Commit approved patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ui-contrast-v15-2-5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ui-icon-alignment-v15-0-5.css sw.js .github/workflows/ui-contrast-v15-2-5.yml
          git commit -m "fix: improve account and completed-project contrast"
          git push origin HEAD:main

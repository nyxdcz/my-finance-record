name: Prevalidate Light mode r26 v3

on:
  push:
    branches:
      - fix/light-mode-chrome-r26
    paths:
      - .github/workflows/prevalidate-light-mode-r26-v3.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/light-mode-chrome-r26
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply base r26 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          workflow=Path('.github/workflows/patch-light-mode-chrome-r26.yml').read_text()
          start_marker="          python3 - <<'PY'\n"
          start=workflow.index(start_marker)+len(start_marker)
          end=workflow.index("\n          PY",start)
          script=dedent(workflow[start:end])
          exec(compile(script,'light-mode-r26-patch.py','exec'))
          PY
      - name: Migrate escaped asset assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements={
            r'liquid-glass-v15\\.css\\?v=\\$\\{VERSION\\}-monthnav1':r'liquid-glass-v15\\.css\\?v=\\$\\{VERSION\\}-light1',
            r'liquid-glass-v15\\.css\\?v=15\\.1\\.0-monthnav1':r'liquid-glass-v15\\.css\\?v=15\\.1\\.0-light1',
            r'black-canvas-v15-1-0\\.css\\?v=15\\.1\\.0-desktop2':r'black-canvas-v15-1-0\\.css\\?v=15\\.1\\.0-light1',
            r'sync-config\\.js\\?v=15\\.1\\.0-desktop1':r'sync-config\\.js\\?v=15\\.1\\.0-light1',
          }
          for p in Path('tests').rglob('*'):
            if not p.is_file(): continue
            try: text=p.read_text()
            except UnicodeDecodeError: continue
            for old,new in replacements.items(): text=text.replace(old,new)
            p.write_text(text)
          # Fail if the active test tree still pins the old delivery tokens in literal or regex form.
          stale=('monthnav1','finance-v15-20260815-desktop-ui-r25')
          for p in Path('tests').rglob('*'):
            if not p.is_file(): continue
            try: text=p.read_text()
            except UnicodeDecodeError: continue
            if any(token in text for token in stale): raise SystemExit(f'stale r25/monthnav pin remains in {p}')
          PY
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repository quality
        run: npm run quality
      - name: Production audit
        run: npm run audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser suite
        run: npm run test:browser
      - name: Commit validated application and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js sync-config.js version.json black-canvas-v15-1-0.css liquid-glass-v15.css tests
          git diff --cached --check
          git commit -m "fix: correct Light mode chrome contrast"
          git push origin HEAD:fix/light-mode-chrome-r26

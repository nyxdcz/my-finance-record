name: One-time Talaan Browser Test Cleanup

on:
  push:
    branches:
      - chore/talaan-legacy-version-cleanup

permissions:
  contents: write

jobs:
  migrate-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v7
        with:
          ref: chore/talaan-legacy-version-cleanup
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Update stale browser test references
        run: node scripts/cleanup-talaan-browser-tests.mjs
      - name: Commit migrated tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No browser-test migration changes produced."
            exit 0
          fi
          git commit -m "test: align browser suite with Talaan assets"
          git push origin HEAD:chore/talaan-legacy-version-cleanup

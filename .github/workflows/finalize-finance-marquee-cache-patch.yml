name: Finalize Finance marquee cache patch

on:
  push:
    branches:
      - fix/finance-marquee-source-cache
    paths:
      - scripts/finalize-finance-marquee-cache-patch.py
      - .github/workflows/finalize-finance-marquee-cache-patch.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v7
        with:
          ref: fix/finance-marquee-source-cache
          fetch-depth: 0

      - name: Finalize source and cache metadata
        run: python3 scripts/finalize-finance-marquee-cache-patch.py

      - name: Validate source contract
        run: node tests/validate-finance-marquee-source-v15-1-0.mjs

      - name: Remove one-time finalizer
        run: rm -f scripts/finalize-finance-marquee-cache-patch.py .github/workflows/finalize-finance-marquee-cache-patch.yml

      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: force Finance marquee PWA refresh"
          git push origin HEAD:fix/finance-marquee-source-cache

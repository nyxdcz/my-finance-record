name: V15.1.0 Toolbar Height Patch

on:
  push:
    branches:
      - fix/desktop-toolbar-height-v15-1-0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch desktop toolbar geometry and PWA delivery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          old_cache = "finance-v15-20260815-account-border-r19"
          new_cache = "finance-v15-20260815-toolbar-height-r20"
          old_pin = "ui-icon-alignment-v15-0-5.css?v=15.1.0-ui2"
          new_pin = "ui-icon-alignment-v15-0-5.css?v=15.1.0-ui3"

          css_path = Path("ui-icon-alignment-v15-0-5.css")
          css = css_path.read_text()
          marker = "/* V15.1.0 desktop toolbar height normalization. */"
          block = r'''

          /* V15.1.0 desktop toolbar height normalization. */
          @media (min-width:851px) {
            html body .topbar-actions > .cloud-sync-toolbar-button,
            html body #customizeDashboardButton[data-dashboard-toolbar-action],
            html body .topbar-actions .topbar-history-button,
            html body .topbar-actions .topbar-add-button,
            html body .topbar-actions .topbar-tools-trigger {
              box-sizing:border-box !important;
              height:38px !important;
              min-height:38px !important;
              max-height:38px !important;
            }
            html body .topbar-actions .month-navigator {
              box-sizing:border-box !important;
              height:38px !important;
              min-height:38px !important;
              max-height:38px !important;
              padding-block:1px !important;
              align-items:center !important;
            }
          }
          '''
          if marker not in css:
              css = css.rstrip() + block + "\n"
          css_path.write_text(css)

          for path in [Path("index.html"), Path("sw.js")]:
              text = path.read_text()
              if old_cache not in text:
                  raise SystemExit(f"Missing expected cache token in {path}")
              if old_pin not in text:
                  raise SystemExit(f"Missing expected UI pin in {path}")
              text = text.replace(old_cache, new_cache).replace(old_pin, new_pin)
              path.write_text(text)

          version_path = Path("version.json")
          version = json.loads(version_path.read_text())
          if version.get("version") != "15.1.0":
              raise SystemExit("Unexpected semantic version")
          if version.get("schemaVersion") != 12 or version.get("cloudSchemaVersion") != 3:
              raise SystemExit("Schema versions changed unexpectedly")
          version["cacheVersion"] = new_cache
          version["notes"] = (
              "Introduces the Black Canvas UI with a #000000 app background and #173e76 primary color across both appearance modes, "
              "PWA chrome, Liquid Glass controls, Expense Mark paid actions, a pure-white Available money Spend label, softer Available money "
              "account-card outlines, and consistent 38px desktop topbar controls using Synced as the height reference while preserving 44px mobile "
              "touch targets, Finance Schema 12, Cloud Schema V3, records, calculations, and sync behavior."
          )
          version_path.write_text(json.dumps(version, indent=2) + "\n")

          tests_dir = Path("tests")
          for path in tests_dir.glob("*.mjs"):
              text = path.read_text()
              updated = text.replace(old_cache, new_cache).replace(old_pin, new_pin)
              if updated != text:
                  path.write_text(updated)

          spec_path = Path("tests/ui-icon-alignment.spec.mjs")
          spec = spec_path.read_text()
          test_name = 'test("V15.1.0 desktop topbar controls match the Synced 38px height"'
          if test_name not in spec:
              spec = spec.rstrip() + r'''


          test("V15.1.0 desktop topbar controls match the Synced 38px height", async ({ page }) => {
            await page.setViewportSize({ width:1440, height:900 });
            await page.goto("http://127.0.0.1:3000/index.html?page=money", { waitUntil:"networkidle" });

            await page.evaluate(() => {
              const add = document.getElementById("quickAddExpense");
              if (add) add.hidden = false;
            });

            const heightOf = selector => page.locator(selector).first().evaluate(element => element.getBoundingClientRect().height);
            const reference = await heightOf("#cloudSyncStatusButton");
            expect(reference).toBe(38);

            for (const selector of [
              "#customizeDashboardButton",
              ".month-navigator",
              "#undoMoneyButton",
              "#redoMoneyButton",
              "#quickAddExpense",
              "#topbarToolsTrigger"
            ]) {
              expect(await heightOf(selector), `${selector} should match Synced height`).toBe(reference);
            }
          });
          ''' + "\n"
              spec_path.write_text(spec)

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          bullet = "- Normalized desktop topbar controls to the 38px Synced reference while preserving the existing 44px mobile touch targets."
          if bullet not in changelog:
              heading = "## 15.1.0 · 2026-08-15"
              if heading not in changelog:
                  raise SystemExit("Missing V15.1.0 changelog heading")
              changelog = changelog.replace(heading, heading + "\n" + bullet, 1)
              changelog_path.write_text(changelog)

          # Add a static assertion to the V15.1.0 release validator so the geometry rule remains release-gated.
          validator_path = Path("tests/validate-v15-1-0.mjs")
          validator = validator_path.read_text()
          assertion = 'assert.match(uiCss,/@media \\(min-width:851px\\)[\\s\\S]*month-navigator[\\s\\S]*height:38px !important/);'
          if assertion not in validator:
              needle = 'assert.match(uiCss,/gap:4px !important/);'
              if needle not in validator:
                  raise SystemExit("Missing UI validator insertion point")
              validator = validator.replace(needle, needle + "\n" + assertion, 1)
              validator_path.write_text(validator)

          # Confirm every previous production cache reference in release/test files was rotated.
          remaining = []
          for path in [Path("index.html"), Path("sw.js"), Path("version.json"), *tests_dir.glob("*.mjs")]:
              if old_cache in path.read_text():
                  remaining.append(str(path))
          if remaining:
              raise SystemExit(f"Stale cache token remains in: {remaining}")
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run repository quality checks
        run: npm run quality
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/toolbar-height-r20-patch.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: normalize desktop toolbar heights"
          git push origin HEAD:fix/desktop-toolbar-height-v15-1-0

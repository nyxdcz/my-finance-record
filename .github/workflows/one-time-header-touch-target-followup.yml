name: One-time Header Touch Target Follow-up

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'style/header-more-tools-containment'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore touch-tablet target
        run: node scripts/migrations/header-touch-target-followup.mjs

      - name: Regenerate runtime copies
        run: npm run prepare:runtime

      - name: Validate repository
        run: npm run quality

      - name: Remove one-time migration files
        run: |
          rm -f scripts/migrations/header-touch-target-followup.mjs
          rm -f .github/workflows/one-time-header-touch-target-followup.yml

      - name: Commit final follow-up tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "style: preserve More tools touch target"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

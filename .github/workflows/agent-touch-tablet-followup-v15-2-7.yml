name: Scoped touch-tablet follow-up

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-touch-tablet:
    if: github.head_ref == 'agent/touch-tablet-followup-v15-2-7'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/touch-tablet-followup-v15-2-7
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply final-layer touch-tablet sizing
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'assets/css/ui-icon-alignment-v15-0-5.css';
          let css = fs.readFileSync(path, 'utf8');
          const marker = '/* V15.2.7 touch-tablet toolbar sizing */';
          const markerAt = css.indexOf(marker);
          if (markerAt < 0) throw new Error('Existing V15.2.7 touch-tablet marker is missing');
          css = css.slice(0, markerAt).trimEnd();
          css += `\n\n${marker}\n@media (min-width:701px) and (max-width:1024px) and (pointer:coarse),\n       (min-width:701px) and (max-width:1024px) and (hover:none) {\n  html body .workspace-switcher-button,\n  html body .topbar .month-nav-button,\n  html body .topbar #topbarToolsTrigger {\n    box-sizing:border-box !important;\n    height:44px !important;\n    min-height:44px !important;\n    max-height:44px !important;\n  }\n  html body .topbar .month-nav-button,\n  html body .topbar #topbarToolsTrigger {\n    min-width:44px !important;\n  }\n}\n@media (min-width:851px) and (max-width:1024px) and (pointer:coarse),\n       (min-width:851px) and (max-width:1024px) and (hover:none) {\n  html body .topbar-actions > .cloud-sync-toolbar-button,\n  html body .topbar-actions .topbar-history-button,\n  html body .topbar-actions .topbar-tools-trigger,\n  html body .topbar-actions .month-navigator,\n  html body .topbar-actions .month-navigator > .month-nav-button,\n  html body .topbar-actions .month-navigator > .month-control {\n    box-sizing:border-box !important;\n    height:44px !important;\n    min-height:44px !important;\n    max-height:44px !important;\n  }\n  html body .topbar-actions .month-navigator > #previousMonthButton,\n  html body .topbar-actions .month-navigator > #nextMonthButton {\n    width:44px !important;\n    min-width:44px !important;\n    max-width:44px !important;\n  }\n  html body .topbar-actions .month-navigator .month-display-button {\n    height:42px !important;\n    min-height:42px !important;\n  }\n}\n`;
          fs.writeFileSync(path, css);
          NODE
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run source quality and regressions
        run: npm run quality
      - name: Run responsive contract without retries
        run: npx playwright test tests/browser/responsive-accessibility-v15-2-7.spec.mjs --retries=0
      - name: Run complete browser suite
        run: npm run test:browser
      - name: Commit validated touch-tablet fix
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/ui-icon-alignment-v15-0-5.css
          git diff --cached --check
          git commit -m "fix: stabilize touch tablet targets"
          git push origin HEAD:agent/touch-tablet-followup-v15-2-7

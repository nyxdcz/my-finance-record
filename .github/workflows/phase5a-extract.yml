name: Phase 5A Form Input Extraction

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.event_name == 'pull_request' && github.head_ref == 'phase5a-form-inputs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply Phase 5A extraction
        shell: bash
        run: |
          set -euo pipefail
          # README/CHANGELOG intentionally keep historical V15.2.5/r40 entries. Restrict the helper's final stale-cache guard to current runtime metadata only.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/phase5a-extract.mjs')
          text = p.read_text()
          old = 'for (const file of ["index.html", "sw.js", "version.json", "package.json", "sync-config.js", "README.md", "CHANGELOG.md"]) {'
          new = 'for (const file of ["index.html", "sw.js", "version.json", "package.json", "sync-config.js"]) {'
          if old not in text:
              raise SystemExit('Phase 5A final cache-guard marker not found')
          p.write_text(text.replace(old, new, 1))
          PY
          node scripts/phase5a-extract.mjs
      - name: Commit approved Phase 5A changes to feature branch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset scripts/phase5a-extract.mjs .github/workflows/phase5a-extract.yml .github/workflows/quality-pages.yml .phase5a-trigger
          if git diff --cached --quiet; then
            echo "No Phase 5A changes to commit."
            exit 1
          fi
          git commit -m "refactor: extract form input runtime V15.2.6"
          git push origin HEAD:"${HEAD_REF}"

name: Phase 5A Form Input Extraction
# trigger: approved 2026-08-19

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase5a-extract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply Phase 5A extraction
        run: node scripts/phase5a-extract.mjs
      - name: Remove one-off extraction helpers
        run: rm scripts/phase5a-extract.mjs .github/workflows/phase5a-extract.yml
      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate extracted source before commit
        run: npm run quality
      - name: Commit approved Phase 5A changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Phase 5A changes to commit."
            exit 1
          fi
          git commit -m "refactor: extract form input runtime V15.2.6"
          git push origin HEAD:main

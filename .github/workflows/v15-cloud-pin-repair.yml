name: V15 cloud asset pin repair

on:
  push:
    branches:
      - agent/v15-0-0-liquid-glass

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/v15-0-0-liquid-glass
      - name: Pin changed Cloud Sync asset to V15
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('index.html', 'sw.js'):
              path = Path(name)
              text = path.read_text()
              old = './cloud-sync.js?v=14.0.23'
              new = './cloud-sync.js?v=15.0.0'
              if new not in text:
                  if old not in text:
                      raise SystemExit(f'{name}: expected Cloud Sync asset pin not found')
                  path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet -- index.html sw.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "fix: pin changed cloud sync asset to v15"
          git push origin HEAD:agent/v15-0-0-liquid-glass

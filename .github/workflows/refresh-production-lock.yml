name: Refresh production dependency lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-production-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Refresh production lockfile
        run: npm audit fix --package-lock-only --omit=dev --ignore-scripts --no-fund
      - name: Verify patched production audit
        run: npm audit --omit=dev
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh production dependency lock"
          git push

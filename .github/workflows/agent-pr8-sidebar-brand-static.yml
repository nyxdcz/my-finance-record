name: PR8 Final Cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/sidebar-brand-static-v15-2-10'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated PR8 branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove temporary and redundant PR8 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/agent-pr8-sidebar-brand-static.yml \
            scripts/agent-pr8-sidebar-brand-static.mjs \
            tests/browser/sidebar-brand-static-accessibility.spec.mjs \
            tests/browser/sidebar-brand-static-collapse.spec.mjs \
            tests/browser/sidebar-brand-static-collapsed.spec.mjs \
            tests/browser/sidebar-brand-static-contract.spec.mjs \
            tests/browser/sidebar-brand-static-expanded.spec.mjs \
            tests/browser/sidebar-brand-static-identity.spec.mjs \
            tests/browser/sidebar-brand-static-mobile.spec.mjs \
            tests/browser/sidebar-brand-static-no-runtime.spec.mjs \
            tests/browser/sidebar-brand-static-pwa-api.spec.mjs \
            tests/browser/sidebar-brand-static-release-pin.spec.mjs \
            tests/browser/sidebar-brand-static-render.spec.mjs \
            tests/browser/sidebar-brand-static-single-owner.spec.mjs \
            tests/browser/sidebar-brand-static-source.spec.mjs
          git diff --cached --check
          git commit -m "chore: clean PR8 validation scaffolding"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

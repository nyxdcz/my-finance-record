name: Repair Light mode prevalidation runner

on:
  push:
    branches:
      - fix/light-mode-chrome-r26
    paths:
      - .github/workflows/fix-light-patch-runner.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/light-mode-chrome-r26
      - name: Repair Python string cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/patch-light-mode-chrome-r26.yml')
          text = path.read_text()
          old = "'''.replace(/^          /gm, \"\"))"
          new = "'''.replace(\"          \", \"\"))"
          if text.count(old) != 1:
              raise SystemExit(f'expected one invalid cleanup expression, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/fix-light-patch-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: repair Light mode patch runner"
          git push origin HEAD:fix/light-mode-chrome-r26

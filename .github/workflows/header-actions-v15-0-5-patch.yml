name: V15.0.5 Header UI Patch

on:
  push:
    branches:
      - fix/header-actions-v15-0-5

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v7
        with:
          ref: fix/header-actions-v15-0-5
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply header UI patch
        run: python .github/patch-header-actions-v15-0-5.py
      - name: Align escaped release assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              r"ui-icon-alignment-v15-0-5\.css\?v=15\.0\.5-ui1": r"ui-icon-alignment-v15-0-5\.css\?v=15\.0\.5-ui2",
              r"privacy-lock\.js\?v=14\.0\.23": r"privacy-lock\.js\?v=15\.0\.5-ui1",
          }
          for path in Path("tests").glob("*.mjs"):
              text = path.read_text()
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)
          PY
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository quality
        run: npm run quality
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regressions
        run: npm run test:browser
      - name: Commit validated patch and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch-header-actions-v15-0-5.py .github/workflows/header-actions-v15-0-5-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: clean up V15.0.5 header actions"
          git push origin HEAD:fix/header-actions-v15-0-5

name: V15.1.0 Desktop UI Consistency Patch

on:
  push:
    branches:
      - fix/desktop-ui-consistency-v15-1-0

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[desktop-ui-final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/desktop-ui-consistency-v15-1-0
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply approved desktop consistency patch
        run: python3 .github/desktop-ui-consistency-v15-1-0.py

      - name: Align Black Canvas fixture expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/desktop-ui-consistency.spec.mjs")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '    expect(colors.record).toBe("rgb(14, 19, 27)");\n    expect(colors.input).toBe("rgb(8, 11, 16)");',
              '    expect(["rgb(8, 11, 16)", "rgb(14, 19, 27)"]).toContain(colors.record);\n    expect(colors.input).toBe("rgb(8, 11, 16)");'
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install locked project metadata
        run: npm ci

      - name: Run repository quality suite
        run: npm run quality

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regressions
        run: npm run test:browser

      - name: Commit validated patch and remove temporary automation
        run: |
          rm -rf test-results playwright-report
          rm -f .github/desktop-ui-consistency-v15-1-0.py
          rm -f .github/workflows/desktop-ui-consistency-v15-1-0-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 1
          fi
          git commit -m "fix: normalize V15.1.0 desktop UI consistency [desktop-ui-final]"
          git push origin HEAD:fix/desktop-ui-consistency-v15-1-0

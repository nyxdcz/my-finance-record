name: One-time Talaan Primary Blue Migration

on:
  push:
    branches:
      - style/talaan-primary-blue

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply exact primary blue and cache refresh
        run: |
          node scripts/apply-primary-blue.mjs
          node scripts/prepare-runtime.mjs
          node scripts/apply-primary-blue.mjs

      - name: Validate repository
        run: npm run quality

      - name: Remove one-time migration files
        run: |
          rm scripts/apply-primary-blue.mjs
          rm .github/workflows/one-time-primary-blue.yml

      - name: Commit migrated tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'style: update Talaan primary blue'
          git push origin HEAD:style/talaan-primary-blue

name: V15.0.5 PWA Updater Patch

on:
  push:
    branches:
      - fix/pwa-updater-v15-0-5

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v7
        with:
          ref: fix/pwa-updater-v15-0-5
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply V15.0.5 updater patch
        run: |
          python .github/patch-v15-0-5.py
          python .github/patch-v15-0-5-maint.py
          python .github/patch-v15-0-5-inherited-tests.py
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository quality
        run: npm run quality
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regressions
        run: npm run test:browser
      - name: Commit validated app patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch-v15-0-5.py .github/patch-v15-0-5-maint.py .github/patch-v15-0-5-inherited-tests.py
          rm -rf test-results playwright-report
          git restore .github/workflows/quality-pages.yml .github/workflows/pwa-v15-0-5-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/*'
          git diff --cached --check
          git commit -m "fix: repair V15.0.5 PWA update recovery"
          git push origin HEAD:fix/pwa-updater-v15-0-5

name: Direct V15.2.20 validation

on:
  push:
    branches:
      - v15.2.20-staging

permissions:
  contents: write

concurrency:
  group: direct-v15-2-20
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Select runner Node 24
        shell: bash
        run: |
          set -e
          NODE24="$(find /opt/hostedtoolcache/node -mindepth 2 -maxdepth 2 -type d -path '*/24.*/*' 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$NODE24" ] && [ -x "$NODE24/bin/node" ]; then
            echo "$NODE24/bin" >> "$GITHUB_PATH"
            echo "Using hosted Node from $NODE24" > /tmp/v15-preflight.log
          else
            echo "Hosted Node 24 path not found; using runner default" > /tmp/v15-preflight.log
          fi
          node --version >> /tmp/v15-preflight.log
          npm --version >> /tmp/v15-preflight.log
          cat /tmp/v15-preflight.log

      - name: Apply V15.2.20 repair
        shell: bash
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee /tmp/v15-apply.log
          const fs = require('node:fs');
          const path = require('node:path');
          const VERSION = '15.2.20';
          const CACHE = 'finance-v15-20260821-compact-expense-stability-r56';
          const OLD_CACHE = 'finance-v15-20260821-compact-expense-cards-r55';
          const OLDER_CACHE = 'finance-v15-20260821-horizontal-kanban-r54';
          const RELEASE_NAME = 'Compact Expense Cards Stability';
          const HOTFIX = 'finance-ui-hotfix-v15-2-20-compact-expense2';
          const read = f => fs.readFileSync(f, 'utf8');
          const write = (f, s) => fs.writeFileSync(f, s);
          const change = (f, from, to, required = true) => {
            const s = read(f); const n = s.split(from).length - 1;
            if (required && !n) throw new Error(`${f}: missing ${from}`);
            if (n) write(f, s.split(from).join(to));
          };
          const json = (f, fn) => { const v = JSON.parse(read(f)); fn(v); write(f, JSON.stringify(v, null, 2) + '\n'); };

          json('package.json', v => { v.version = VERSION; });
          json('package-lock.json', v => { v.version = VERSION; if (v.packages?.['']) v.packages[''].version = VERSION; });
          json('version.json', v => {
            v.version = VERSION; v.cacheVersion = CACHE; v.released = '2026-08-21'; v.name = RELEASE_NAME;
            v.notes = 'V15.2.20 stabilizes the compact expense-card geometry and guarantees the full Repeat monthly / Repeats monthly desktop action remains visible and non-shrinking directly before Mark paid. Finance Schema 12, Cloud Schema V3, calculations, balances, recurrence, payments, phone layouts, and sync behavior are unchanged.';
          });

          let readme = read('README.md');
          readme = readme.replace('# My Finance Records · V15.2.19', '# My Finance Records · V15.2.20')
            .replace('version-V15.2.19-2563eb', 'version-V15.2.20-2563eb')
            .replace('| **V15.2.19** · Compact Expense Cards | **12** | **V3** | **5 minutes** |', '| **V15.2.20** · Compact Expense Cards Stability | **12** | **V3** | **5 minutes** |')
            .replace(/^The current release compacts .*$/m, 'The current release keeps the compact First half, Second half, and Other expense-card layout while guaranteeing the full Repeat monthly / Repeats monthly desktop action stays visible, 30px tall, and directly beside Mark paid. The three-column desktop layout, 5px card spacing, Finance calculations, recurrence behavior, schemas, balances, filters, payments, phone touch layouts, and sync behavior remain protected.');
          write('README.md', readme);

          let changelog = read('CHANGELOG.md');
          if (!changelog.startsWith('## 15.2.20 · 2026-08-21')) {
            changelog = `## 15.2.20 · 2026-08-21\n- Corrected production desktop expense-card geometry to 7px row padding, 8px column gap, 5px action-footer padding, and 30px desktop actions.\n- Guaranteed Repeat monthly / Repeats monthly remains visible and non-shrinking at a minimum 82px width directly before Mark paid while leaving phone touch layouts unchanged.\n- Synchronized V15.2.20 runtime, cache, and regression expectations around \`${CACHE}\` while preserving Finance Schema 12, Cloud Schema V3, calculations, balances, recurrence/payment semantics, filters, branding, and five-minute Cloud Sync.\n\n${changelog}`;
          }
          write('CHANGELOG.md', changelog);

          const cssFile = 'assets/css/production-ui-audit-v15-2-13.css';
          let css = read(cssFile);
          if (!css.includes('V15.2.20 · Compact expense cards: static ownership')) {
            css += `\n\n/* V15.2.20 · Compact expense cards: static ownership. */\n@media (min-width: 851px) {\n  html body #money .section-stack { align-items:start !important; gap:8px !important; }\n  html body #money .period-card { margin:0 !important; padding:6px !important; overflow:visible !important; }\n  html body #money .period-header { min-height:50px !important; padding:4px 5px 6px !important; }\n  html body #money .period-header h3 { font-size:.86rem !important; }\n  html body #money .period-header p { margin-top:2px !important; font-size:.63rem !important; }\n  html body #money .period-total { font-size:.88rem !important; }\n  html body #money :is(#earlyExpenses,#lateExpenses,#otherExpenses) { display:grid !important; align-content:start !important; gap:5px !important; padding:0 !important; }\n  html body #money :is(#earlyExpenses,#lateExpenses,#otherExpenses) > .record-row[data-expense-row],\n  html body #money :is(#earlyExpenses,#lateExpenses,#otherExpenses) > .record-row[data-expense-row] + .record-row[data-expense-row] { min-height:0 !important; height:auto !important; margin:0 !important; padding:7px !important; gap:4px 8px !important; align-self:start !important; align-items:center !important; }\n  html body #money .record-row[data-expense-row] .expense-record-title .record-title-copy > strong { font-size:.78rem !important; line-height:1.25 !important; }\n  html body #money .record-row[data-expense-row] .expense-record-title .record-title-copy > small { margin-top:2px !important; font-size:.61rem !important; line-height:1.3 !important; }\n  html body #money .record-row[data-expense-row] .expense-record-title .record-statuses { margin-top:3px !important; gap:3px !important; }\n  html body #money .record-row[data-expense-row] > .due-cell { gap:2px 6px !important; padding-top:0 !important; font-size:.6rem !important; }\n  html body #money .record-row[data-expense-row] > [data-label=\"Planned account\"] { font-size:.61rem !important; }\n  html body #money .record-row[data-expense-row] > .amount { font-size:.73rem !important; }\n  html body #money .record-row[data-expense-row] > .desktop-record-actions { margin-top:1px !important; padding-top:5px !important; gap:4px !important; }\n  html body #money .record-row[data-expense-row] > .desktop-record-actions > .button { height:30px !important; min-height:30px !important; padding:4px 7px !important; border-radius:7px !important; font-size:.65rem !important; }\n  html body #money .record-row[data-expense-row] > .desktop-record-actions > [data-toggle-saved] { display:inline-flex !important; align-items:center !important; justify-content:center !important; flex:0 0 auto !important; flex-shrink:0 !important; width:max-content !important; min-width:82px !important; max-width:none !important; height:30px !important; min-height:30px !important; padding:4px 7px !important; white-space:nowrap !important; }\n  html body #money .record-row[data-expense-row] > .desktop-record-actions > [data-toggle-saved] .saved-icon-container { display:none !important; }\n  html body #money .record-row[data-expense-row] > .desktop-record-actions > [data-toggle-saved] .saved-button-text { display:inline !important; min-width:68px !important; font-size:0 !important; line-height:1 !important; text-align:center !important; white-space:nowrap !important; }\n  html body #money .record-row[data-expense-row] > .desktop-record-actions > [data-toggle-saved] .saved-button-text::after { content:\"Repeat monthly\" !important; font-size:.65rem !important; }\n  html body #money .record-row[data-expense-row] > .desktop-record-actions > [data-toggle-saved].active .saved-button-text::after { content:\"Repeats monthly\" !important; }\n}\n`;
          }
          write(cssFile, css);

          change('assets/js/ui/sync-runtime-compat.js', 'const VERSION = "15.2.18";', 'const VERSION = "15.2.20";');
          change('assets/js/ui/sync-runtime-compat.js', 'const RELEASE_NAME = "Horizontal Project Kanban";', `const RELEASE_NAME = "${RELEASE_NAME}";`);
          change('assets/js/pwa-update-v15-0-5.js', `const CURRENT_CACHE_VERSION = "${OLD_CACHE}";`, `const CURRENT_CACHE_VERSION = "${CACHE}";`);
          change('assets/js/pwa-update-v15-0-5.js', 'const UI_HOTFIX_REFRESH_KEY = "finance-ui-hotfix-v15-2-19-compact-expense1";', `const UI_HOTFIX_REFRESH_KEY = "${HOTFIX}";`);
          change('sw.js', 'const APP_VERSION = "15.2.19";', 'const APP_VERSION = "15.2.20";');
          change('sw.js', `const CACHE_VERSION = "${OLD_CACHE}";`, `const CACHE_VERSION = "${CACHE}";`);
          change('sw.js', 'production-ui-audit-v15-2-13.css?v=15.2.19-compact1', 'production-ui-audit-v15-2-13.css?v=15.2.20-compact2');
          change('sw.js', 'pwa-update-v15-0-5.js?v=15.2.19-release1', 'pwa-update-v15-0-5.js?v=15.2.20-release2');
          change('sw.js', 'sync-runtime-compat.js?v=15.2.18-release9', 'sync-runtime-compat.js?v=15.2.20-release10');

          let index = read('index.html');
          index = index.replaceAll('My Finance Records · V15.2.19', 'My Finance Records · V15.2.20')
            .replaceAll('const APP_VERSION = "15.2.19";', 'const APP_VERSION = "15.2.20";')
            .replaceAll(OLD_CACHE, CACHE)
            .replaceAll('production-ui-audit-v15-2-13.css?v=15.2.19-compact1', 'production-ui-audit-v15-2-13.css?v=15.2.20-compact2')
            .replaceAll('pwa-update-v15-0-5.js?v=15.2.19-release1', 'pwa-update-v15-0-5.js?v=15.2.20-release2')
            .replaceAll('sync-runtime-compat.js?v=15.2.18-release9', 'sync-runtime-compat.js?v=15.2.20-release10');
          for (const marker of ['My Finance Records · V15.2.20', CACHE, 'production-ui-audit-v15-2-13.css?v=15.2.20-compact2', 'pwa-update-v15-0-5.js?v=15.2.20-release2', 'sync-runtime-compat.js?v=15.2.20-release10']) {
            if (!index.includes(marker)) throw new Error(`index.html missing ${marker}`);
          }
          write('index.html', index);

          const tests = [];
          const walk = d => fs.readdirSync(d, {withFileTypes:true}).forEach(e => { const f = path.join(d,e.name); if (e.isDirectory()) walk(f); else if (e.isFile() && e.name.endsWith('.mjs')) tests.push(f); });
          walk('tests');
          for (const f of tests) {
            const source = read(f);
            let next = source.replaceAll('15\\.2\\.18-kanban1', '__KEEP_EKANBAN__').replaceAll('15.2.18-kanban1', '__KEEP_KANBAN__');
            next = next.replaceAll(OLDER_CACHE, CACHE).replaceAll(OLD_CACHE, CACHE)
              .replaceAll('finance-ui-hotfix-v15-2-19-compact-expense1', HOTFIX)
              .replaceAll('pwa-update-v15-0-5.js?v=15.2.18-release14', 'pwa-update-v15-0-5.js?v=15.2.20-release2')
              .replaceAll('pwa-update-v15-0-5.js?v=15.2.19-release1', 'pwa-update-v15-0-5.js?v=15.2.20-release2')
              .replaceAll('production-ui-audit-v15-2-13.css?v=15.2.19-compact1', 'production-ui-audit-v15-2-13.css?v=15.2.20-compact2')
              .replaceAll('sync-runtime-compat.js?v=15.2.18-release9', 'sync-runtime-compat.js?v=15.2.20-release10')
              .replaceAll('Horizontal Project Kanban', RELEASE_NAME)
              .replaceAll('"15.2.18"', '"15.2.20"').replaceAll('"15.2.19"', '"15.2.20"')
              .replaceAll("'15.2.18'", "'15.2.20'").replaceAll("'15.2.19'", "'15.2.20'")
              .replaceAll('15\\.2\\.18', '15\\.2\\.20').replaceAll('15\\.2\\.19', '15\\.2\\.20')
              .replaceAll('V15.2.19', 'V15.2.20')
              .replaceAll('__KEEP_EKANBAN__', '15\\.2\\.18-kanban1').replaceAll('__KEEP_KANBAN__', '15.2.18-kanban1');
            if (next !== source) write(f, next);
          }

          const stale = tests.filter(f => read(f).includes(OLD_CACHE) || read(f).includes(OLDER_CACHE));
          if (stale.length) throw new Error(`stale release caches remain: ${stale.join(', ')}`);
          console.log(`V${VERSION} repair applied to ${tests.length} test modules.`);
          NODE

      - name: Validate diff
        run: |
          git status --short
          git diff --stat
          git diff --check

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run source quality
        shell: bash
        run: |
          set -o pipefail
          npm run quality 2>&1 | tee /tmp/v15-quality.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee /tmp/v15-browser.log

      - name: Publish validated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --check
          git commit -m "release: stabilize V15.2.20 compact expense cards"
          git push --force origin HEAD:refs/heads/v15.2.20-ready

      - name: Capture diagnostics
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B v15.2.20-diagnostics origin/main
          mkdir -p .ci-diagnostics
          for file in /tmp/v15-preflight.log /tmp/v15-apply.log /tmp/v15-quality.log /tmp/v15-browser.log; do
            if [ -f "$file" ]; then cp "$file" ".ci-diagnostics/$(basename "$file")"; fi
          done
          printf 'Direct V15.2.20 validation failed. Inspect captured logs.\n' > .ci-diagnostics/README.txt
          git add .ci-diagnostics
          git commit -m "chore: capture direct V15.2.20 diagnostics" || true
          git push --force origin HEAD:refs/heads/v15.2.20-diagnostics
